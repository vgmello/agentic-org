[package]
name = "console-attach"
version = "0.1.0"
edition = "2021"
publish = false
description = "POC: intercept a program's TTY via a Unix PTY proxy or drive long-lived Claude Code stream-json sessions over a background Unix control socket"

# Keep this POC standalone so it does not alter the root workspace Cargo.lock.
[workspace]

[dependencies]
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
