# DSS factory as a process-package flow (REQ-01/02/06, YAML per REQ-07).
#
# Transitions:
#   on:    event that fires it — an agent outcome (`published`) or a host event (`task.status_changed`)
#   where: CEL filter over the event payload (`event.to == 'in_review'`)
#   when:  CEL guard over facts (`flags.*`, `task.*`, `project.*`); with no `on` it is
#          level-triggered: it fires as soon as the condition holds, however it became true
#   fallback: rule used when the host lacks a capability (`task`, `project`) the rule needs
id: dss-factory
version: 2
title: Desired State Specification factory

# Judgments an agent passes with an outcome. Facts come from capabilities instead.
flags:
  standards_defined: bool   # only used when the host has no `project` capability
  standards_changed: bool

agents:
  setup-agent: { label: Setup agent, persona: Project bootstrapper }
  product-owner: { label: Product owner, persona: Talks with the user, owns the Product DSS }
  architect: { label: System architect, persona: Owns the Technical DSS and standards }
  staff-engineer: { label: Staff engineer, persona: Co-owns the Technical DSS, plans the work }
  executor: { label: Execution agent, persona: Implements tasks }
  reviewer: { label: Reviewer, persona: Independent review of the change }
  reconciler: { label: Reconciler, persona: Converges code to the published DSS }

triggers:
  - { command: project-setup, start: project-setup }
  - { command: dss, start: product-dss-dialogue }

blocks:
  - { id: project-setup, title: Brand-new project checks, file: blocks/project-setup.md, agent: setup-agent, stage: setup }
  - { id: product-dss-dialogue, title: Product DSS dialogue, file: blocks/product-dss-dialogue.md, agent: product-owner, stage: product, interactive: true }
  - { id: publish-product-dss, title: Publish Product DSS, file: blocks/publish-product-dss.md, agent: product-owner, stage: product, produces: [product-dss] }
  - { id: tech-dss-autonomous, title: Technical DSS (autonomous), file: blocks/tech-dss-autonomous.md, agent: architect, stage: factory, produces: [technical-dss] }
  - { id: tech-dss-interactive, title: Technical DSS (interactive), file: blocks/tech-dss-interactive.md, agent: architect, stage: factory, interactive: true, produces: [technical-dss] }
  - { id: architecture-standards, title: Version architecture standards, file: blocks/architecture-standards.md, agent: architect, stage: factory, produces: [architecture-standards] }
  - { id: implementation-planning, title: Implementation planning, file: blocks/implementation-planning.md, agent: staff-engineer, stage: delivery, produces: [tasks] }
  - { id: execute-tasks, title: Execute task, file: blocks/execute-tasks.md, agent: executor, stage: delivery }
  - { id: architect-consult, title: Architecture consultation, file: blocks/architect-consult.md, agent: architect, stage: delivery }
  - { id: code-review, title: Review (In Review), file: blocks/code-review.md, agent: reviewer, stage: delivery }
  - { id: reconcile, title: Reconcile to desired state, file: blocks/reconcile.md, agent: reconciler, stage: reconcile, produces: [trace-links] }
  - { id: converged, title: Converged, file: blocks/converged.md, agent: reconciler, stage: reconcile }

transitions:
  - { from: project-setup, on: completed, to: product-dss-dialogue }
  - { from: product-dss-dialogue, on: context_sufficient, to: publish-product-dss }

  # A fact, not a judgment: with the `project` capability the runner reads it from the
  # project's information architecture; without it, the product owner passes a flag.
  - from: publish-product-dss
    on: published
    when: project.standards_defined
    fallback: { on: published, when: flags.standards_defined }
    to: tech-dss-autonomous
  - from: publish-product-dss
    on: published
    when: "!project.standards_defined"
    fallback: { on: published, when: "!flags.standards_defined" }
    to: tech-dss-interactive

  - { from: tech-dss-autonomous, on: decision_open, to: tech-dss-interactive }
  - { from: tech-dss-autonomous, on: recorded, when: flags.standards_changed, to: architecture-standards }
  - { from: tech-dss-autonomous, on: recorded, when: "!flags.standards_changed", to: implementation-planning }
  - { from: tech-dss-interactive, on: recorded, when: flags.standards_changed, to: architecture-standards }
  - { from: tech-dss-interactive, on: recorded, when: "!flags.standards_changed", to: implementation-planning }
  - { from: architecture-standards, on: versioned, to: implementation-planning }
  - { from: implementation-planning, on: tasks_created, to: execute-tasks }
  - { from: execute-tasks, on: question, to: architect-consult }
  - { from: architect-consult, on: answered, to: execute-tasks }

  # Level-triggered (REQ-02): as soon as the task IS in review — moved by the agent, a
  # person or a script, even if the change event was missed — the reviewer gets the block.
  - from: execute-tasks
    when: task.status == 'in_review'
    fallback: { on: submitted_for_review }
    to: code-review

  # Edge-triggered with a filter: someone moves the task back to in progress.
  - from: code-review
    on: task.status_changed
    where: event.to == 'in_progress'
    fallback: { on: changes_requested }
    to: execute-tasks
  # The approval is a judgment; the guard is a fact (with `task`, the task must be done).
  - from: code-review
    on: approved
    when: task.status == 'done'
    fallback: { on: approved }
    to: reconcile

  - { from: reconcile, on: drift_detected, to: implementation-planning }
  - { from: reconcile, on: converged, to: converged }
  - { from: converged, on: new_version, to: product-dss-dialogue }
