# The checks of AGENTS.md rule 3, on every pushed branch. The team merges into `v1` without pull
# requests, so a branch is ready only with a green run for its exact commit.
name: CI

on:
  push:
    branches: ["**"]
  # Manual runs work only once this file is on the repo's default branch (today `main`, not `v1`).
  workflow_dispatch:

# No `concurrency` block: cancelling a branch's run on a newer push would leave the earlier commit
# without a green run, and the reviewer gives a verdict on an exact commit.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-15: macOS arm64. ubuntu-26.04: Linux x86-64.
        os: [macos-15, ubuntu-26.04]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's rustup installs the channel and components pinned in rust-toolchain.toml.
      - name: Install Rust
        id: rust-toolchain
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          cargo --version

      # Caches are saved only on v1, so branches don't churn the repo's cache quota. Branches restore
      # only their own and the default branch's caches, so making v1 the default branch would warm them.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/v1' }}

      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Organization data specification
        if: runner.os == 'Linux'
        run: python3 docs/design/organization-data/test_schema.py

      - name: Published scripts and docs hygiene
        if: runner.os == 'Linux'
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          fi
          python3 .github/scripts/check_published_docs_hygiene.py --require-shellcheck

      # ADR-0017 LNX-5: zero platform predicates outside crates/org-platform and crates/org-platform-host
      # (.github/platform-conditionals.allow is empty). `cargo test` below runs it again with the rest.
      - name: Platform conditionals (LNX-5)
        run: cargo test --locked -p org-platform --test platform_conditionals

      # A Unix target that is neither macOS nor GNU/Linux gets the refusing adapters of org-platform
      # and org-platform-host.
      # Linux with musl is such a target, and its test binaries run on this runner. Consumers
      # whose system code lives behind org-platform build there too (crates that compile C cannot
      # be built for musl on this runner).
      - name: Install musl target
        id: rust-musl
        if: ${{ runner.os == 'Linux' && !cancelled() && steps.rust-toolchain.outcome == 'success' }}
        run: rustup target add x86_64-unknown-linux-musl

      - name: Clippy refusing adapters
        if: ${{ !cancelled() && steps.rust-musl.outcome == 'success' }}
        run: cargo clippy --locked -p org-platform -p org-platform-host --all-targets --all-features --target x86_64-unknown-linux-musl -- -D warnings

      - name: Clippy musl consumers
        if: ${{ !cancelled() && steps.rust-musl.outcome == 'success' }}
        run: cargo clippy --locked -p org-supervise -p org-socket --lib --target x86_64-unknown-linux-musl -- -D warnings

      - name: Test refusing adapters
        if: ${{ !cancelled() && steps.rust-musl.outcome == 'success' }}
        run: cargo test --locked -p org-platform -p org-platform-host --all-features --target x86_64-unknown-linux-musl

      # Report each native lint result even if an earlier check found debt.
      - name: Clippy production function length
        if: ${{ !cancelled() && steps.rust-toolchain.outcome == 'success' }}
        run: cargo clippy --locked --workspace --lib --bins -- -D clippy::too_many_lines

      - name: cargo clippy
        if: ${{ !cancelled() && steps.rust-toolchain.outcome == 'success' }}
        run: cargo clippy --locked --workspace --all-targets --keep-going -- -D warnings

      - name: Clippy release production function length
        if: ${{ !cancelled() && steps.rust-toolchain.outcome == 'success' }}
        run: cargo clippy --locked --workspace --release --lib --bins -- -D clippy::too_many_lines

      - name: Clippy release safety documentation and suppression reasons
        if: ${{ !cancelled() && steps.rust-toolchain.outcome == 'success' }}
        run: >-
          cargo clippy --locked --workspace --release --lib --bins --keep-going --
          -D clippy::undocumented_unsafe_blocks -D clippy::allow_attributes_without_reason

      - name: Clippy store latency example
        if: ${{ !cancelled() && steps.rust-toolchain.outcome == 'success' }}
        run: cargo clippy --locked -p org-office --features testkit --example store_latency -- -D warnings

      # agentic-org-web's dependency-closure test reads the locked graph for every platform with
      # `cargo metadata --offline`. A build downloads only this platform's packages, so the rest
      # are fetched here; without this step the test fails on a runner with a cold cache.
      - name: cargo fetch (every platform's locked packages)
        id: rust-fetch
        if: ${{ !cancelled() && steps.rust-toolchain.outcome == 'success' }}
        run: cargo fetch --locked

      # --no-fail-fast: a failing test binary must not hide the result of every crate after it.
      - name: cargo test
        if: ${{ !cancelled() && steps.rust-fetch.outcome == 'success' }}
        run: cargo test --locked --workspace --no-fail-fast

      # ADR-0014 / TASK-33 (B1c): office store latency measurement and regression guard on macOS & Linux.
      - name: Office store latency benchmark & regression check (B1c)
        if: ${{ !cancelled() && steps.rust-fetch.outcome == 'success' }}
        run: |
          cargo run --locked --release -p org-office --features testkit --example store_latency -- \
            --iterations 200 --durable-iterations 20 --check-regression \
            --markdown "$GITHUB_STEP_SUMMARY"

  # ADR-0017 LNX-5: a change never adds a file to .github/platform-conditionals.allow or raises a
  # count in it. A branch is compared with where it left v1, the integration branch; a push to v1
  # with the commit it replaced.
  platform-list:
    name: Platform conditionals list only shrinks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the list with its base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/v1" ]; then
            base="$BEFORE"
          else
            base="$(git merge-base HEAD origin/v1)" || {
              echo "This branch shares no history with v1."; exit 1; }
          fi
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "No base commit to compare with."; exit 0 ;;
          esac
          python3 .github/scripts/platform_allowlist_shrinks.py "$base"

  # ADR-0017 LNX-2: the container image built from deploy/container and checked in real containers
  # by deploy/container/lnx2.sh, which builds the image itself. This job only builds what the
  # script needs (the UI, and the Linux executables with deploy/container/build.sh, in the Rust
  # toolchain's Debian image) and runs it, so it does not depend on what the script checks.
  # It also records the one-shot `agent-os` timings on Linux (CLI-15: recorded, not bounded).
  container:
    name: Container (LNX-2) and agent-os timings
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Docker
        run: docker version

      # build.sh keeps its cargo home and its output in target/linux. Saved only on v1, as the
      # rust job's cache is; the key changes with what decides how the dependencies build.
      - name: Restore the Linux build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/linux/cargo/registry/index
            target/linux/cargo/registry/cache
            target/linux/debug
            target/linux/release
          key: container-linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'deploy/container/build.sh') }}
          restore-keys: container-linux-

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Build the UI
        working-directory: apps/agentic-org-ui
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Build the Linux executables
        run: deploy/container/build.sh

      # The release build, as an agent runs it: fifty runs of each command. The table goes to
      # the job summary and the samples to an artifact.
      - name: agent-os one-shot timings (Linux)
        run: |
          deploy/container/build.sh --release -p agent-os
          mkdir -p "$RUNNER_TEMP/timings"
          python3 .github/scripts/agent_os_timings.py target/linux/release/agent-os --runs 50 \
            --json "$RUNNER_TEMP/timings/agent-os-timings.json" --markdown "$GITHUB_STEP_SUMMARY"

      - name: Upload the timings
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: agent-os-timings-linux-${{ github.run_attempt }}
          path: ${{ runner.temp }}/timings/agent-os-timings.json
          retention-days: 90
          if-no-files-found: error

      # Step 10 of LNX-2, the optional seccomp and AppArmor profiles, needs a Docker host that
      # enforces AppArmor, with the profile loaded. GitHub's Ubuntu runners enforce it; on one
      # that does not, the step is skipped with the reason in the log and the job summary. Where
      # the runner can load profiles, a profile the parser refuses fails the job: it is this
      # repository's file, and a skip would hide that it no longer loads.
      - name: Load the optional AppArmor profile (LNX-2 step 10)
        run: |
          reason=
          if [ "$(cat /sys/module/apparmor/parameters/enabled 2>/dev/null)" != Y ]; then
            reason="the kernel does not enforce AppArmor"
          elif ! docker info -f '{{.SecurityOptions}}' | grep -q apparmor; then
            reason="Docker does not apply AppArmor profiles"
          elif ! sudo -n true 2>/dev/null; then
            reason="sudo is not available without a password"
          elif ! sudo -n sh -c 'command -v apparmor_parser' >/dev/null; then
            reason="apparmor_parser is not installed"
          fi
          if [ -n "$reason" ]; then
            echo "::warning::LNX-2 step 10 is skipped: $reason"
            echo "LNX-2 step 10 (the optional profiles) was skipped: $reason." >>"$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          sudo apparmor_parser -r -W deploy/container/apparmor-agentic-org
          echo "LNX2_PROFILES=1" >>"$GITHUB_ENV"

      - name: LNX-2 (deploy/container/lnx2.sh)
        run: deploy/container/lnx2.sh

      # The incremental state of the workspace's own crates is not worth its size in the cache.
      - name: Drop incremental state before the cache is saved
        if: github.ref == 'refs/heads/v1'
        run: rm -rf target/linux/debug/incremental target/linux/release/incremental

      - name: Save the Linux build cache
        if: github.ref == 'refs/heads/v1'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/linux/cargo/registry/index
            target/linux/cargo/registry/cache
            target/linux/debug
            target/linux/release
          key: container-linux-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'deploy/container/build.sh') }}

  # The UI checks run in a browser against the app's own code and fakes, with no Tauri and nothing
  # platform-specific, so they run on Linux only. Node and Bun are both pinned.
  ui:
    name: ui (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The full browser suite exceeds one runner's 30-minute budget. fullyParallel in
        # playwright.config.ts balances individual tests across all four shards.
        shard: [1, 2, 3, 4]
    env:
      UI_DIR: apps/agentic-org-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: bun install
        working-directory: ${{ env.UI_DIR }}
        run: bun install --frozen-lockfile

      - name: Lint and formatting
        if: matrix.shard == 1
        working-directory: ${{ env.UI_DIR }}
        run: |
          bun run lint
          bun run format:check

      - name: Type check
        working-directory: ${{ env.UI_DIR }}
        run: bun run check

      - name: Unit tests
        working-directory: ${{ env.UI_DIR }}
        run: bun run test

      - name: Build
        working-directory: ${{ env.UI_DIR }}
        run: bun run build

      - name: Install Playwright Chromium
        working-directory: ${{ env.UI_DIR }}
        run: bunx playwright install --with-deps chromium

      # playwright.config.ts sets no reporter, so add the HTML report here for the failure artifact.
      - name: UI tests (Playwright)
        working-directory: ${{ env.UI_DIR }}
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: bun run test:e2e --shard=${{ matrix.shard }}/4 --reporter=line,html

      - name: Upload the Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ env.UI_DIR }}/playwright-report/
            ${{ env.UI_DIR }}/test-results/
          retention-days: 14
          if-no-files-found: ignore

  dependencies:
    name: Dependency security and licenses
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2; cargo-deny 0.20.2
        with:
          arguments: --locked
          rust-version: 1.99.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Frontend dependency audit (moderate and higher)
        working-directory: apps/agentic-org-ui
        run: bun run audit:check

  secrets:
    name: Secret scanning
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan complete history (redacted)
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact'

  ui-csp:
    name: Browser CSP (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/agentic-org-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium webkit firefox
      - name: CSP controls, browser smoke tests and full Chromium suite
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: bun run test:e2e:csp --shard=${{ matrix.shard }}/4 --reporter=line,html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: csp-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            apps/agentic-org-ui/playwright-report/
            apps/agentic-org-ui/test-results-csp/
          retention-days: 14
          if-no-files-found: ignore

  ui-gateway-and-webkit:
    name: Gateway CSP and WebKit journeys
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/agentic-org-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install Rust
        working-directory: .
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/v1' }}
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium webkit firefox
      - name: Real gateway CSP in Chromium, WebKit and Firefox
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: bun run test:e2e:csp-gateway --reporter=line,html
      - name: WebKit keyboard and navigation journeys
        env:
          PW_WEBKIT: "1"
          PLAYWRIGHT_HTML_OPEN: never
        run: bun run test:e2e --project=webkit --grep @journey --reporter=line,html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: gateway-webkit-report-${{ github.run_attempt }}
          path: |
            apps/agentic-org-ui/playwright-report/
            apps/agentic-org-ui/test-results/
            apps/agentic-org-ui/test-results-csp-gateway/
          retention-days: 14
          if-no-files-found: ignore
