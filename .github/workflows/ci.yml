# The checks of AGENTS.md rule 3, on every pushed branch. The team merges into `v1` without pull
# requests, so a branch is ready only with a green run for its exact commit.
name: CI

on:
  push:
    branches: ["**"]
  # Manual runs work only once this file is on the repo's default branch (today `main`, not `v1`).
  workflow_dispatch:

# No `concurrency` block: cancelling a branch's run on a newer push would leave the earlier commit
# without a green run, and the reviewer gives a verdict on an exact commit.

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # macos-15: macOS arm64. ubuntu-26.04: Linux x86-64.
        os: [macos-15, ubuntu-26.04]
        include:
          - os: ubuntu-26.04
            # The extracted org-host library has items only its macOS code uses (code-signature peer checks,
            # Keychain key store), so on Linux clippy's dead-code and unused-import lints fail, and
            # the host integration tests in agentic-org cannot start every worker path yet. Until the Linux host bring-up (implementation plan X1) gates those items
            # by target, it's excluded here and linted by the `clippy (Linux host)` step with only
            # those two lints allowed; its tests stay excluded.
            clippy-flags: --exclude org-host --exclude agentic-org
            test-flags: --exclude org-host --exclude agentic-org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner's rustup installs the channel and components pinned in rust-toolchain.toml.
      - name: Install Rust
        run: |
          rustup toolchain install --no-self-update
          rustc --version
          cargo --version

      # Caches are saved only on v1, so branches don't churn the repo's cache quota. Branches restore
      # only their own and the default branch's caches, so making v1 the default branch would warm them.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/v1' }}

      - name: cargo fmt --check
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: Organization data specification
        if: runner.os == 'Linux'
        run: python3 docs/design/organization-data/test_schema.py

      # ADR-0017 LNX-5: no platform predicate outside crates/org-platform, beyond the shrinking
      # list in .github/platform-conditionals.allow. `cargo test` below runs it again with the rest.
      - name: Platform conditionals (LNX-5)
        run: cargo test --locked -p org-platform --test platform_conditionals

      # A Unix target that is neither macOS nor GNU/Linux gets org-platform's refusing adapters.
      # Linux with musl is such a target, and its test binaries run on this runner.
      - name: Refusing adapters (a target without an adapter)
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo clippy --locked -p org-platform --all-targets --all-features --target x86_64-unknown-linux-musl -- -D warnings
          cargo test --locked -p org-platform --all-features --target x86_64-unknown-linux-musl

      - name: cargo clippy
        run: cargo clippy --locked --workspace --all-targets ${{ matrix.clippy-flags }} -- -D warnings

      - name: clippy (Linux host)
        if: runner.os == 'Linux'
        run: cargo clippy --locked -p org-host -p agentic-org --all-targets -- -D warnings -A dead_code -A unused_imports

      - name: CLI migration checks (Linux)
        if: runner.os == 'Linux'
        run: cargo test --locked -p agentic-org --lib --test cli

      - name: cargo test
        run: cargo test --locked --workspace ${{ matrix.test-flags }}

  # ADR-0017 LNX-5: a change never adds a file to .github/platform-conditionals.allow or raises a
  # count in it. A branch is compared with where it left v1-integration; a push to v1-integration
  # with the commit it replaced.
  platform-list:
    name: Platform conditionals list only shrinks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare the list with its base
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/v1-integration" ]; then
            base="$BEFORE"
          else
            base="$(git merge-base HEAD origin/v1-integration)"
          fi
          case "$base" in
            ""|0000000000000000000000000000000000000000)
              echo "No base commit to compare with."; exit 0 ;;
          esac
          python3 .github/scripts/platform_allowlist_shrinks.py "$base"

  # The UI checks run in a browser against the app's own code and fakes, with no Tauri and nothing
  # platform-specific, so they run on Linux only. Node and Bun are both pinned.
  ui:
    name: ui (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The full browser suite exceeds one runner's 30-minute budget. fullyParallel in
        # playwright.config.ts balances individual tests across all four shards.
        shard: [1, 2, 3, 4]
    env:
      UI_DIR: apps/agentic-org-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: bun install
        working-directory: ${{ env.UI_DIR }}
        run: bun install --frozen-lockfile

      - name: Lint and formatting
        if: matrix.shard == 1
        working-directory: ${{ env.UI_DIR }}
        run: |
          bun run lint
          bun run format:check

      - name: Type check
        working-directory: ${{ env.UI_DIR }}
        run: bun run check

      - name: Unit tests
        working-directory: ${{ env.UI_DIR }}
        run: bun run test

      - name: Build
        working-directory: ${{ env.UI_DIR }}
        run: bun run build

      - name: Install Playwright Chromium
        working-directory: ${{ env.UI_DIR }}
        run: bunx playwright install --with-deps chromium

      # playwright.config.ts sets no reporter, so add the HTML report here for the failure artifact.
      - name: UI tests (Playwright)
        working-directory: ${{ env.UI_DIR }}
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: bun run test:e2e --shard=${{ matrix.shard }}/4 --reporter=line,html

      - name: Upload the Playwright report
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            ${{ env.UI_DIR }}/playwright-report/
            ${{ env.UI_DIR }}/test-results/
          retention-days: 14
          if-no-files-found: ignore

  dependencies:
    name: Dependency security and licenses
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2; cargo-deny 0.20.2
        with:
          arguments: --locked
          rust-version: 1.99.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Frontend dependency audit (moderate and higher)
        working-directory: apps/agentic-org-ui
        run: bun run audit:check

  secrets:
    name: Secret scanning
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified Gitleaks 8.30.1
        run: |
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan complete history (redacted)
        run: '"$RUNNER_TEMP/gitleaks-bin/gitleaks" git --redact'

  ui-csp:
    name: Browser CSP (${{ matrix.shard }}/4)
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/agentic-org-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium webkit firefox
      - name: CSP controls, browser smoke tests and full Chromium suite
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: bun run test:e2e:csp --shard=${{ matrix.shard }}/4 --reporter=line,html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: csp-report-${{ matrix.shard }}-${{ github.run_attempt }}
          path: |
            apps/agentic-org-ui/playwright-report/
            apps/agentic-org-ui/test-results-csp/
          retention-days: 14
          if-no-files-found: ignore

  ui-gateway-and-webkit:
    name: Gateway CSP and WebKit journeys
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/agentic-org-ui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Install Rust
        working-directory: .
        run: rustup toolchain install --no-self-update
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/v1' }}
      - run: bun install --frozen-lockfile
      - run: bunx --no-install playwright install --with-deps chromium webkit firefox
      - name: Real gateway CSP in Chromium, WebKit and Firefox
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: bun run test:e2e:csp-gateway --reporter=line,html
      - name: WebKit keyboard and navigation journeys
        env:
          PW_WEBKIT: "1"
          PLAYWRIGHT_HTML_OPEN: never
        run: bun run test:e2e --project=webkit --grep @journey --reporter=line,html
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: gateway-webkit-report-${{ github.run_attempt }}
          path: |
            apps/agentic-org-ui/playwright-report/
            apps/agentic-org-ui/test-results/
            apps/agentic-org-ui/test-results-csp-gateway/
          retention-days: 14
          if-no-files-found: ignore
