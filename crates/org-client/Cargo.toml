[package]
name = "org-client"
description = "Talks to this machine's host and its office servers over their sockets using org-proto. Used by the desktop app and org-agent."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
org-socket = { path = "../org-socket" }
org-proto = { path = "../org-proto" }
# `office.json`, which an agent's CLI reads to find its office (`agent::find_office`).
org-office-launch = { path = "../org-office-launch" }
libc.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
