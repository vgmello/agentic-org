[package]
name = "org-client"
description = "Talks to this machine's host and its office servers over their sockets using org-proto. Used by the desktop app and agent-os."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Explicit teardown for descriptor-owning tests; never enabled in normal builds.
testkit = []

[dependencies]
org-socket = { path = "../org-socket" }
org-proto = { path = "../org-proto" }
# Durable flush and exclusive rename of the agent spool; the default office home and the
# socket path limit.
org-platform = { path = "../org-platform" }
# `office.json`, which an agent's CLI reads to find its office (`agent::find_office`).
org-office-launch = { path = "../org-office-launch" }
libc.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
