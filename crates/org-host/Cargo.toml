[package]
name = "org-host"
description = "The host: the per-user login service that supervises one agentic-org-office per office, creates organizations and tells clients where offices are."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Exposes fixtures only to the agentic-org composition integration tests.
test-support = ["org-host-tls/test-support"]

[dependencies]
argon2.workspace = true
org-host-control = { path = "../../crates/org-host-control" }
org-host-release = { path = "../org-host-release" }
org-host-tls = { path = "../org-host-tls" }
org-pki = { path = "../org-pki" }
org-socket = { path = "../../crates/org-socket" }
org-proto = { path = "../../crates/org-proto" }
org-office-launch = { path = "../../crates/org-office-launch" }
org-platform = { path = "../org-platform" }
org-platform-host = { path = "../org-platform-host" }
org-redact = { path = "../org-redact" }
serde.workspace = true
zeroize = "=1.9.1"
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
libc.workspace = true
caseless = "=0.2.2"
unicode-normalization = "=0.1.26"
ring = "=0.17.14"

[dev-dependencies]
org-host-tls = { path = "../org-host-tls", features = ["test-support"] }
# Test locations and the flush steps the platform counted (`dirs::testing`, `fs::testing`).
org-platform = { path = "../org-platform", features = ["test-support"] }
# The scripted image check and the children a test names itself (`testing::admission`).
org-platform-host = { path = "../org-platform-host", features = ["test-support"] }
tempfile.workspace = true
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = "=1.0.107"

[lints]
workspace = true
