[package]
name = "org-platform"
description = "Every operating-system difference: the platform contracts of ADR-0017 with their macOS, Linux and refusing adapters. No domain or policy knowledge."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test doubles and executable contract checks (`service::testing`), for other crates' tests.
test-support = []

[dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The platform-conditional check (ADR-0017 LNX-5) parses the workspace's sources.
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
