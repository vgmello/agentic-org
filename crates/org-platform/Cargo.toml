[package]
name = "org-platform"
description = "Every operating-system difference behind small contracts: one non-conditional constructor per capability, its macOS and Linux adapters, and a refusing adapter elsewhere (ADR-0017 decision 6)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Test adapters built from the contracts, for consumer tests only.
test-support = []

[dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The linked-dependency check (libc_only) reads `cargo metadata`.
serde_json.workspace = true
# The platform-conditional check (ADR-0017 LNX-5) reads the workspace's sources.
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }

# `posix::answer_from_child` forks only a process with one thread: this test is its own
# `main`, which starts no thread, unlike the standard harness.
[[test]]
name = "single_threaded_fork"
harness = false

[lints]
workspace = true
