[package]
name = "org-supervise"
description = "Owned process spawning with explicit environment, descriptors and process identity"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
libc.workspace = true
org-platform = { path = "../org-platform" }
org-runtime = { path = "../org-runtime" }

[dev-dependencies]
# test-support: the before-main hook of tests/support/core_limit.rs and the process
# test helpers (subreaper, stopped state, argv[0]).
org-platform = { path = "../org-platform", features = ["test-support"] }
tempfile.workspace = true
