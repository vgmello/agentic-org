[package]
name = "org-office"
description = "The office: domain and storage (organizations, agents, projects, SQLite, workspace files)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `InMemoryKeys`, the in-memory key provider for dev runs. Off by default and never enabled
# in release builds: an office's key belongs in the Keychain (ADR-0002). Enforced: with it,
# a build without debug assertions fails (`compile_error!` in key.rs), so
# `--release --all-features` fails too.
#
# Release and CI jobs name their feature sets explicitly (`--no-default-features` plus what the
# job needs, never `--all-features`): `--all-features` enables `dev-keys`, and a release build
# with it fails to compile on purpose.
dev-keys = []

[dependencies]
org-proto = { path = "../org-proto" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
