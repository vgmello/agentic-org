[package]
name = "org-office"
description = "The office: domain and storage (organizations, agents, projects, SQLite, workspace files)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `testkit`: the memory ports of the families on the office store and their conformance suites.
testkit = ["org-store/testkit", "dep:tempfile"]

[dependencies]
org-docs = { path = "../org-docs" }
org-store = { path = "../org-store" }
zeroize = "=1.9.1"
org-work = { path = "../org-work" }
org-proto = { path = "../org-proto" }
org-platform = { path = "../org-platform" }
org-mailbox = { path = "../org-mailbox" }
org-sync = { path = "../org-sync" }
org-sync-proto = { path = "../org-sync-proto" }
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
libc.workspace = true
# Only the `testkit` suites: each runs its store in a temporary directory.
tempfile = { workspace = true, optional = true }

[dev-dependencies]
org-work = { path = "../org-work", features = ["testkit"] }
org-mailbox = { path = "../org-mailbox", features = ["testkit"] }
org-sync = { path = "../org-sync", features = ["testkit"] }
# The flush steps the platform counted, for the publication evidence tests.
org-platform = { path = "../org-platform", features = ["test-support"] }
org-store = { path = "../org-store", features = ["testkit"] }
serde_json.workspace = true
tempfile.workspace = true
