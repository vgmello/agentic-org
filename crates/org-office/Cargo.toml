[package]
name = "org-office"
description = "The office: domain and storage (the organization on the office store, its folder and its CA records)."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# `testkit`: the memory ports of the families on the office store and their conformance suites.
testkit = ["org-store/testkit", "org-reviews/testkit", "dep:image", "dep:tempfile"]

[[example]]
name = "store_latency"
required-features = ["testkit"]

[dependencies]
base64.workspace = true
# Only `attachments::testkit::sample_png`: test fixture PNG encoding.
image = { workspace = true, optional = true }
org-accounting = { path = "../org-accounting" }
org-budgets = { path = "../org-budgets" }
org-docs = { path = "../org-docs" }
org-media = { path = "../org-media", features = ["sanitize"] }
org-pki = { path = "../org-pki" }
org-process = { path = "../org-process" }
org-reviews = { path = "../org-reviews" }
org-store = { path = "../org-store" }
org-sync = { path = "../org-sync" }
org-sync-proto = { path = "../org-sync-proto" }
org-proto = { path = "../org-proto" }
# Only `writer::marker`: the host's custody marker in an office folder.
org-office-launch = { path = "../org-office-launch" }
org-platform = { path = "../org-platform" }
serde.workspace = true
serde_json.workspace = true
# Only the `testkit` suites: each runs its store in a temporary directory.
tempfile = { workspace = true, optional = true }

[dev-dependencies]
image.workspace = true
org-media = { path = "../org-media", features = ["sanitize", "testkit"] }
# Only `examples/store_latency.rs` (benchmarking the SQLite projection via `org-office`'s public seam).
org-office-sqlite = { path = "../org-office-sqlite" }
# The flush steps the platform counted, for the publication evidence tests.
org-platform = { path = "../org-platform", features = ["test-support"] }
org-reviews = { path = "../org-reviews", features = ["testkit"] }
org-store = { path = "../org-store", features = ["testkit"] }
serde_json.workspace = true
tempfile.workspace = true
# Only `tests/engine_boundary.rs`: the ENG-1 scan parses the crate's Rust files.
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = "=1.0.107"

[lints]
workspace = true
