[package]
name = "org-office-server"
description = "Office server orchestration: launch control, IPC socket, host channels, transfer, and inbox."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Test helpers shared with binary integration suites: the test grant signer and a host-channel caller.
test-support = []

[dependencies]
org-pki = { path = "../org-pki" }
org-sync = { path = "../org-sync" }
org-sync-proto = { path = "../org-sync-proto" }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
base64.workspace = true
zeroize = "=1.9.1"
org-socket = { path = "../org-socket" }
org-proto = { path = "../org-proto" }
org-office = { path = "../org-office" }
org-doc-render = { path = "../org-doc-render" }
org-git = { path = "../org-git" }
org-copilot = { path = "../org-copilot" }
# The writer custody contract the office's store calls, implemented over the host channel.
org-store = { path = "../org-store" }
org-mailbox = { path = "../org-mailbox" }
org-office-launch = { path = "../org-office-launch" }
org-office-sessions = { path = "../org-office-sessions" }
# The default office home and the socket path limit of the build target.
org-platform = { path = "../org-platform" }
# Shared declarative `agent-os` command table and `MutationPolicy` (`TASK-80.4`, `TASK-254`).
org-command-catalogue = { path = "../org-command-catalogue" }
org-tess = { path = "../org-tess" }
libc.workspace = true
ring = "=0.17.14"
serde.workspace = true
serde_json.workspace = true
hmac.workspace = true
sha2.workspace = true

[dev-dependencies]
org-agent-cli = { path = "../org-agent-cli" }
org-agent-runtime = { path = "../org-agent-runtime" }
org-sync = { path = "../org-sync" }
org-office = { path = "../org-office", features = ["testkit"] }
org-mailbox = { path = "../org-mailbox", features = ["testkit"] }
org-client = { path = "../org-client", features = ["testkit"] }
tempfile.workspace = true
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = "=1.0.107"

[lints]
workspace = true
