[package]
name = "org-office-sessions"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
libc.workspace = true
org-agent-runtime = { path = "../org-agent-runtime" }
org-agent-runtime-agy = { path = "../org-agent-runtime-agy" }
org-agent-runtime-claude = { path = "../org-agent-runtime-claude" }
org-agent-runtime-codex = { path = "../org-agent-runtime-codex" }
org-command = { path = "../org-command" }
org-office = { path = "../org-office" }
org-pki = { path = "../org-pki" }
org-platform = { path = "../org-platform" }
org-process = { path = "../org-process" }
org-proto = { path = "../org-proto" }
org-supervise = { path = "../org-supervise" }
org-turn-attachments = { path = "../org-turn-attachments" }
ring = "=0.17.14"
serde.workspace = true
serde_json.workspace = true
# Audited constant-time comparison of run and fast tokens (`ring`'s is deprecated and makes no
# side-channel promise).
subtle = { version = "=2.6.1", default-features = false }
zeroize = "=1.9.1"

[dev-dependencies]
# The live `agent-os` command table the tests render; production injects it from the office binary.
org-agent-cli = { path = "../org-agent-cli" }
org-office = { path = "../org-office", features = ["testkit"] }
tempfile.workspace = true

[lints]
workspace = true
