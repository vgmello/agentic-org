[package]
name = "org-agent-cli"
description = "Library implementation of the agent-os command line on top of org-command and org-client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
org-client = { path = "../org-client" }
org-command = { path = "../org-command" }
org-command-catalogue = { path = "../org-command-catalogue" }
org-media = { path = "../org-media" }
org-platform = { path = "../org-platform" }
org-proto = { path = "../org-proto" }
ring = "=0.17.14"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
zeroize = "=1.9.1"

[dev-dependencies]
org-command = { path = "../org-command", features = ["testkit"] }
tempfile.workspace = true

[lints]
workspace = true
