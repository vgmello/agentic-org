[package]
name = "org-agent-cli"
description = "Library implementation of the agent-os command line on top of org-command and org-client."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
org-client = { path = "../org-client" }
org-command = { path = "../org-command" }
org-proto = { path = "../org-proto" }
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
org-command = { path = "../org-command", features = ["testkit"] }
tempfile.workspace = true
