# Interactive Codex defaults. The review runner supplies phase-specific overrides.
model = "gpt-6.1-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

# kit_context.py setup adds the shared Repowise MCP lookup here.
# Project compiler/type checks establish semantics; no extra navigation server
# or command-rewriting proxy is required by the fixed stack.

[agents]
max_concurrent_threads_per_session = 2



# Authorize only the kit's bounded retrieval tools for noninteractive read-only reviews.
# No source-edit, shell, promotion or memory-write tool is exposed by this server.
# Kept outside the generated context block so setup preserves these local defaults.
[mcp_servers.starter_kit_context.tools.lookup]
approval_mode = "approve"

[mcp_servers.starter_kit_context.tools.recall]
approval_mode = "approve"

# BEGIN STARTER KIT CONTEXT
[mcp_servers.starter_kit_context]
command = "python3"
args = ["-c", "import pathlib,runpy,subprocess,sys; p=pathlib.Path(subprocess.check_output(['git','rev-parse','--show-toplevel'],text=True).strip()); sys.argv.extend(['--repo',str(p)]); sys.path.insert(0,str(p/'.agent-kit/runtime')); runpy.run_path(str(p/'.agent-kit/runtime/kit_context.py'),run_name='__main__')", "serve"]
enabled_tools = ["lookup", "recall"]
env_vars = ["AGENT_KIT_MEMORY_ACCESS", "AGENT_KIT_MEMORY_BACKEND"]
tool_timeout_sec = 1260
# END STARTER KIT CONTEXT
