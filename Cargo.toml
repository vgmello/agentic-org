[workspace]
resolver = "2"
members = [
  "crates/org-proto",
  "crates/org-client",
  "crates/org-office",
  "crates/org-spool",
  "crates/org-runtime",
  "crates/org-supervise",
  "apps/org-office-server",
  "apps/org-agent",
  "apps/desktop/src-tauri",
]
# Every member except the Tauri shell, so a plain `cargo test` at the root doesn't compile Tauri.
# Build the app with `cargo <cmd> -p agentic-org` or from apps/desktop.
default-members = [
  "crates/org-proto",
  "crates/org-client",
  "crates/org-office",
  "crates/org-spool",
  "crates/org-runtime",
  "crates/org-supervise",
  "apps/org-office-server",
  "apps/org-agent",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/vgmello/agentic-org"

[workspace.dependencies]
# Pin exact versions here; crates opt in with `x.workspace = true`.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.41.1", features = ["bundled-sqlcipher"] }
tempfile = "=3.27.0"
libc = "=0.2.191"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
