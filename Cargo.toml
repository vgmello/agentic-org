[workspace.package]
version = "0.0.0"
edition = "2021"
license = "FSL-1.1-ALv2"
publish = false
repository = "https://github.com/vgmello/agentic-org"

[workspace.lints.clippy]
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"

[workspace.dependencies]
# The operator CLI's grammar, help and completion (apps/agentic-org only; vetted 2026-11-26).
clap = { version = "=4.6.10", features = ["derive", "wrap_help"] }
clap_complete = { version = "=4.6.12", features = ["unstable-dynamic"] }
argon2 = { version = "=0.5.3", default-features = false, features = ["password-hash", "alloc", "zeroize"] }
# Pin exact versions here; crates opt in with `x.workspace = true`.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# YAML front matter (org-docs only). Vetted 2026-11-12; 0.3.4 deliberately not yet (ada).
saphyr-parser = "=0.3.3"
rusqlite = { version = "=0.42.0", features = ["bundled", "functions"] }
tempfile = "=3.27.0"
sha2 = "=0.10.9"
hmac = "=0.12.1"
libc = "=0.2.191"
# Browser gateway stack (ada D-B45); deliberately no HTTP/2 or HTTP client.
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
scraper = { version = "=0.29.0", default-features = false }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
# The host's retained code-signature checks and Data Protection keychain
# (`OSX_10_15`, `kSecUseDataProtectionKeychain`), where it keeps office database keys.
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
# The host key store's direct `SecItemAdd` (add-only); the version security-framework uses.
security-framework-sys = { version = "=2.17.0", features = ["OSX_10_15"] }
# security-framework's code-signing API takes Core Foundation types (the peer's audit token).
core-foundation = "=0.10.1"
# The operator command line's shell (`crates/org-cli-shell` only; TASK-188): tables, colors,
# prompts, terminal width, Ctrl+C, the error enum and the strict `agentic-org.toml` reader.
# No `preserve_order` on `toml` or `serde_json`: key order elsewhere stays as it is.
cliclack = "=0.5.7"
console = "=0.16.6"
ctrlc = "=3.5.3"
owo-colors = "=4.4.0"
tabled = { version = "=0.22.0", default-features = false, features = ["std", "ansi"] }
terminal_size = "=0.4.4"
thiserror = "=2.0.21"
# Attachment image sanitization (`crates/org-media` `sanitize` feature; TASK-98.1, TASK-252, ADR-0037):
# pure-Rust decoders and encoders for exactly PNG, JPEG, WebP and GIF. No default features: no C
# codecs, no threads (rayon), no other formats.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
# Bounded inflate for attachment validation (PDF object streams, OOXML `[Content_Types].xml`).
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
# Pure-Rust Markdown/HTML+CSS -> PDF renderer (`crates/org-doc-render` only; TASK-98.7).
# Both `ironpress = "=1.7.0"` (`arrayref` BSD-2-Clause via `resvg`/`tiny-skia`) and full
# `typst = "=0.15.1"` (BSD-2-Clause/0BSD/LLVM-exception + `quick-xml` RUSTSEC-2026-0194/0195)
# fail unmodified `deny.toml`; we compose Typst's pure-Rust `pdf-writer` (MIT/Apache-2.0) with
# `pulldown-cmark` (MIT) and workspace `scraper` + `image` behind `DocumentRenderer`.
pdf-writer = "=0.15.0"
pulldown-cmark = { version = "=0.13.6", default-features = false }
toml = { version = "=1.2.3", default-features = false, features = ["std", "serde", "parse"] }

# Debug builds keep line tables only: panics and backtraces still name every function, file
# and line, while `target/debug` is a fraction of its full-debug-info size, which counts once
# per worktree when several agents build side by side. The `test` profile inherits `dev`.
# For a debugger session, build with `CARGO_PROFILE_DEV_DEBUG=full`.
[profile.dev]
debug = "line-tables-only"

# Password hashing is Argon2id at 64 MiB: unoptimized it takes seconds per hash, more under
# load, and a sign-in then overruns the web process's 5 s host-call deadline (a 503). Only
# these two crates are optimized in debug builds; release is unaffected.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# The host hashes each program it starts (the office worker, the web process) when it
# builds their admission. Unoptimised SHA-256 takes over a second for a debug-built
# executable, on every host start and in every test that starts a host.
[profile.dev.package.sha2]
opt-level = 3
