[workspace]
resolver = "2"
# app/src-tauri joins once Riley's scaffold is in v1.
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
toml = { version = "1", default-features = false, features = ["std", "serde", "parse"] }
