  "crates/org-proto",
  "crates/org-pki",
  "crates/org-host-control",
  "crates/org-client",
  "crates/org-command",
  "crates/org-store",
  "crates/org-office",
  "crates/org-office-launch",
  "crates/org-office-sessions",
  "crates/org-office-server",
  "crates/org-agent-cli",
  "crates/org-mailbox",
  "crates/org-docs",
  "crates/org-git",
  "crates/org-process",
  "crates/org-copilot",
  "crates/org-work",
  "crates/org-agent-runtime",
  "crates/org-agent-runtime-agy",
  "crates/org-agent-runtime-claude",
  "crates/org-agent-runtime-codex",
