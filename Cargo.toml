[workspace]
resolver = "2"
members = [
  "crates/org-proto",
  "crates/org-host-control",
  "crates/org-client",
  "crates/org-office",
  "crates/org-office-launch",
  "crates/org-spool",
  "crates/org-mailbox",
  "crates/org-docs",
  "crates/org-process",
  "crates/org-copilot",
  "crates/org-work",
  "crates/org-runtime",
  "crates/org-supervise",
  "crates/org-socket",
  "crates/org-sync",
  "crates/org-sync-proto",
  "apps/org-server",
  "apps/org-office-host",
  "apps/org-agent",
  "apps/org-gateway",
]
# Root checks cover every retained server, CLI and domain member.
default-members = [
  "crates/org-proto",
  "crates/org-host-control",
  "crates/org-client",
  "crates/org-office",
  "crates/org-office-launch",
  "crates/org-spool",
  "crates/org-mailbox",
  "crates/org-docs",
  "crates/org-process",
  "crates/org-copilot",
  "crates/org-work",
  "crates/org-runtime",
  "crates/org-supervise",
  "crates/org-socket",
  "crates/org-sync",
  "crates/org-sync-proto",
  "apps/org-server",
  "apps/org-office-host",
  "apps/org-agent",
  "apps/org-gateway",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
repository = "https://github.com/vgmello/agentic-org"

[workspace.dependencies]
# Pin exact versions here; crates opt in with `x.workspace = true`.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# YAML front matter (org-docs only). Vetted 2026-11-12; 0.3.4 deliberately not yet (ada).
saphyr-parser = "=0.3.3"
rusqlite = { version = "=0.41.1", features = ["bundled-sqlcipher"] }
tempfile = "=3.27.0"
sha2 = "=0.10.9"
hmac = "=0.12.1"
libc = "=0.2.191"
# Browser gateway stack (ada D-B45); deliberately no HTTP/2 or HTTP client.
tokio = { version = "=1.54.1", default-features = false, features = ["rt-multi-thread", "net", "time", "sync", "io-util"] }
hyper = { version = "=1.12.0", default-features = false, features = ["server", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
scraper = { version = "=0.29.0", default-features = false }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }
# The host's retained code-signature checks and Data Protection keychain
# (`OSX_10_15`, `kSecUseDataProtectionKeychain`), where it keeps office database keys.
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }
# The host key store's direct `SecItemAdd` (add-only); the version security-framework uses.
security-framework-sys = { version = "=2.17.0", features = ["OSX_10_15"] }
# security-framework's code-signing API takes Core Foundation types (the peer's audit token).
core-foundation = "=0.10.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
