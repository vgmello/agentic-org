[package]
name = "org-agent"
description = "The agents' CLI: tiny and fast; messages now, tasks and queues later."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
org-client = { path = "../../crates/org-client" }
org-proto = { path = "../../crates/org-proto" }
org-spool = { path = "../../crates/org-spool" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Test-only: the real office server for tests/office.rs. Never a dependency of the binary.
org-server = { path = "../org-server" }
org-office-launch = { path = "../../crates/org-office-launch" }
tempfile.workspace = true

[[test]]
name = "office"
path = "tests/office.rs"
# Its own main: run with ORG_AGENT_TEST_OFFICE_SERVER set, it is the office server (the server's
# library run as a child process, exactly as its binary runs it, with a test key on the launch
# line).
harness = false
