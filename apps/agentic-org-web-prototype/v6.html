        <span class="acct-txt"><span class="who">You</span> <span class="muted">· Owner</span></span>
        <svg class="ic ic20 acct-chev" aria-hidden="true"><use href="#i-chev-updown"/></svg>
      </button>
      <div class="menu up" id="menu-acct" role="menu" hidden>
        <button role="menuitem" type="button" data-act="go" data-v="#/settings/appearance"><svg class="ic ic20" aria-hidden="true"><use href="#i-adjustments"/></svg>Your preferences</button>
        <button role="menuitem" type="button" data-act="shortcuts-help"><svg class="ic ic20" aria-hidden="true"><use href="#i-question"/></svg><span>Keyboard shortcuts</span><kbd class="menu-kbd">?</kbd></button>
        <button role="menuitem" type="button" data-act="proto" data-v="Switch organization (goes to the welcome screen)"><svg class="ic ic20" aria-hidden="true"><use href="#i-arrows-updown"/></svg>Switch organization</button>
        <button role="menuitem" type="button" data-act="proto" data-v="About Agentic Org"><svg class="ic ic20" aria-hidden="true"><use href="#i-info"/></svg>About</button>
      </div>
    </div>
    <a class="office-link" id="office-link" href="#/settings/offices" style="padding-top:0" aria-label="This Mac, HQ office, online. Open Offices" title="This Mac · HQ office · Online">
      <span class="office office-full" id="office-full"><svg class="ic ic14" aria-hidden="true"><use href="#i-check-circle"/></svg>This Mac · HQ office · Online</span>
      <span class="office-rail" aria-hidden="true"><svg class="ic ic20"><use href="#i-office"/></svg><span class="obadge" id="office-rail-badge"><svg class="ic"><use href="#i-check-circle"/></svg></span></span>
    </a>
  </div>
</aside>
<div class="scrim" data-act="drawer-close"></div>

<div class="content" id="content">
  <div class="proto-hotzone" id="banner-hotzone" aria-hidden="true" title="Hover top edge for prototype controls"></div>
  <div class="proto-banner" id="banner" role="note">
    <svg class="ic ic16" aria-hidden="true"><use href="#i-info"/></svg>
    <span class="grow">Prototype · v6 · mock data</span>
    <div class="bctl" id="banner-ctl"></div>
    <button class="btn ghost sm icon" type="button" data-act="banner-close" aria-label="Dismiss prototype banner"><svg class="ic ic16" aria-hidden="true"><use href="#i-x"/></svg></button>
  </div>
  <header class="topbar" id="home-toolbar">
    <button class="btn ghost icon menu-btn" type="button" data-act="drawer" aria-label="Open navigation" aria-controls="sidebar"><svg class="ic ic20" aria-hidden="true"><use href="#i-menu"/></svg></button>
    <div class="cmdk-shell" id="cmdk-shell" hidden>
      <div class="cmdk-local" id="cmdk-local" hidden></div>
    </div>
    <span class="sr-only" id="notif-live" aria-live="polite"></span>
  </header>
  <main id="main" tabindex="-1"></main>
</div>
<p class="home-scroll-hint" id="home-scroll-hint" hidden>
  Scroll for more <svg class="ic ic16" aria-hidden="true"><use href="#i-chev-down"/></svg>
</p>

<div id="overlay-root"></div>
<div class="tess-panel-scrim" id="tess-panel-scrim" data-act="tess-close" hidden></div>
<aside class="tess-panel" id="tess-panel" aria-label="Tess assistant" hidden></aside>
<div class="cmdk-backdrop" id="cmdk-root" hidden>
  <div class="cmdk-dialog" id="cmdk-dialog" role="dialog" aria-modal="true" aria-label="Command palette and Ask Tess">
    <div class="cmdk-tabs">
      <div class="cmdk-tab-grp" role="tablist" aria-label="Palette mode">
        <button class="cmdk-tab" id="cmdk-tab-cmd" type="button" role="tab" aria-selected="true" aria-controls="cmdk-list" data-act="cmdk-mode" data-v="cmd">
          <svg class="ic ic14" aria-hidden="true"><use href="#i-search"/></svg><span>Search &amp; Commands</span>
        </button>
        <button class="cmdk-tab" id="cmdk-tab-ai" type="button" role="tab" aria-selected="false" aria-controls="cmdk-list" data-act="cmdk-mode" data-v="ai">
          <svg class="ic ic14" aria-hidden="true"><use href="#i-sparkle"/></svg><span>Ask Tess</span>
        </button>
      </div>
      <button type="button" class="cmdk-esc" data-act="cmdk-close" aria-label="Close command palette">ESC</button>
    </div>
    <div class="cmdk-in-row">
      <svg class="ic ic20" id="cmdk-in-ico" aria-hidden="true"><use href="#i-search"/></svg>
      <input id="cmdk-input" type="search" placeholder="Type a command, search anything, or ask a question…" autocomplete="off" aria-label="Search, run a command, or ask Tess" role="combobox" aria-autocomplete="list" aria-expanded="true" aria-controls="cmdk-list">
      <button class="cmdk-ask-go" id="cmdk-ask-go" type="button" data-act="cmdk-ai-submit" hidden>Ask</button>
    </div>
    <div class="cmdk-list" id="cmdk-list" role="listbox" aria-label="Commands and search results"></div>
    <div class="cmdk-foot" aria-hidden="true">
      <span id="cmdk-foot-nav"><kbd>↑</kbd><kbd>↓</kbd> Navigate</span>
      <span><kbd>↵</kbd> Run / Ask</span>
      <span><kbd id="cmdk-switch-kbd">⌘/</kbd> Switch Search &amp; AI</span>
      <span><kbd>Esc</kbd> Close</span>
    </div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite" role="status"></div>

<script type="module" src="./v6/main.js"></script>
</body>
</html>
