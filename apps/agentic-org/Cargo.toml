[package]
name = "agentic-org"
description = "Agentic Org human CLI and service host composition."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = ["org-host/test-support", "dep:org-platform", "org-platform/test-support", "dep:org-office-launch", "dep:org-socket", "dep:serde"]

[[bin]]
name = "agentic-org"
path = "src/main.rs"

[[bin]]
name = "fake-office-server"
path = "testing/fake_office_server.rs"
required-features = ["test-support"]
test = false
doc = false

# A2's real-process setup tests (kept out of tests/, which another increment owns).
[[test]]
name = "setup"
path = "setup-tests/setup.rs"

[[test]]
name = "shutdown_signals"
harness = false

[dependencies]
org-office-launch = { path = "../../crates/org-office-launch", optional = true }
org-socket = { path = "../../crates/org-socket", optional = true }
serde = { workspace = true, optional = true }
serde_json.workspace = true
org-agent-cli = { path = "../../crates/org-agent-cli" }
org-command = { path = "../../crates/org-command" }
org-host = { path = "../../crates/org-host" }
org-platform = { path = "../../crates/org-platform", optional = true }
org-proto = { path = "../../crates/org-proto" }
libc.workspace = true

[dev-dependencies]
agentic-org = { path = ".", features = ["test-support"] }
org-office-launch = { path = "../../crates/org-office-launch" }
org-host-control = { path = "../../crates/org-host-control" }
org-socket = { path = "../../crates/org-socket" }
# This system's socket path limit, for the tests that fill a home up to it, and its
# disk-backed temporary directory (`dirs::testing`).
org-platform = { path = "../../crates/org-platform", features = ["test-support"] }
# The LNX-1 test's unbound `hello` on the office socket, as a client makes it.
org-client = { path = "../../crates/org-client" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
syn = { version = "=2.0.119", features = ["full", "visit"] }

[lints]
workspace = true
