[package]
name = "agentic-org"
description = "Agentic Org human CLI and service host composition."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = ["org-host/test-support", "org-host-sqlite/test-support", "org-host-setup/test-support", "org-platform/test-support", "dep:org-office-launch", "dep:org-socket", "dep:libc"]

[[bin]]
name = "agentic-org"
path = "src/main.rs"

[[bin]]
name = "fake-office-server"
path = "testing/fake_office_server.rs"
required-features = ["test-support"]
test = false
doc = false

# A2's real-process setup tests (kept out of tests/, which another increment owns).
[[test]]
name = "setup"
path = "setup-tests/setup.rs"

[[test]]
name = "shutdown_signals"
harness = false

[dependencies]
clap.workspace = true
clap_complete.workspace = true
org-cli-shell = { path = "../../crates/org-cli-shell" }
thiserror.workspace = true
org-office-launch = { path = "../../crates/org-office-launch", optional = true }
org-socket = { path = "../../crates/org-socket", optional = true }
serde.workspace = true
serde_json.workspace = true
org-agent-cli = { path = "../../crates/org-agent-cli" }
# `backup` and `restore` (TASK-104): the archive, its verification and the restore.
org-backup = { path = "../../crates/org-backup" }
org-command = { path = "../../crates/org-command" }
org-host = { path = "../../crates/org-host" }
org-host-sqlite = { path = "../../crates/org-host-sqlite" }
org-host-setup = { path = "../../crates/org-host-setup" }
org-platform = { path = "../../crates/org-platform" }
org-proto = { path = "../../crates/org-proto" }
org-redact = { path = "../../crates/org-redact" }
zeroize = "=1.9.1"
# The test-support `fake-office-server` binary's descriptor plumbing only.
libc = { workspace = true, optional = true }

[dev-dependencies]
flate2.workspace = true
libc.workspace = true
agentic-org = { path = ".", features = ["test-support"] }
org-office-launch = { path = "../../crates/org-office-launch" }
org-host-control = { path = "../../crates/org-host-control" }
org-release = { path = "../../crates/org-release" }
org-socket = { path = "../../crates/org-socket" }
# This system's socket path limit, for the tests that fill a home up to it, and its
# disk-backed temporary directory (`dirs::testing`).
org-platform = { path = "../../crates/org-platform", features = ["test-support"] }
# Captured-stream execution contexts (`context::testing`) for command tests.
org-cli-shell = { path = "../../crates/org-cli-shell", features = ["test-support"] }
# The LNX-1 test's unbound `hello` on the office socket, as a client makes it.
org-client = { path = "../../crates/org-client" }
ring = "=0.17.14"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar = { version = "=0.4.46", default-features = false }
tempfile.workspace = true
syn = { version = "=2.0.119", features = ["full", "visit"] }
# The backup CLI test's real SQLite HQ office in a temporary folder (`TestOffice`).
org-office = { path = "../../crates/org-office", features = ["testkit"] }
org-office-sqlite = { path = "../../crates/org-office-sqlite" }

[lints]
workspace = true
