[package]
name = "agentic-org"
description = "Agentic Org human CLI and service host composition."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
test-support = ["org-host/test-support", "dep:org-office-launch", "dep:serde", "dep:serde_json"]

[[bin]]
name = "agentic-org"
path = "src/main.rs"

[[bin]]
name = "fake-office-server"
path = "testing/fake_office_server.rs"
required-features = ["test-support"]
test = false
doc = false

[[bin]]
name = "fixture-office-host"
path = "testing/fixture_host.rs"
required-features = ["test-support"]
test = false
doc = false

[[test]]
name = "shutdown_signals"
harness = false

[dependencies]
org-office-launch = { path = "../../crates/org-office-launch", optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
org-host = { path = "../../crates/org-host" }
org-proto = { path = "../../crates/org-proto" }
libc.workspace = true

[dev-dependencies]
agentic-org = { path = ".", features = ["test-support"] }
org-office-launch = { path = "../../crates/org-office-launch" }
org-host-control = { path = "../../crates/org-host-control" }
org-socket = { path = "../../crates/org-socket" }
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
syn = { version = "=2.0.119", features = ["full", "visit"] }
