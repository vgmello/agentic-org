[package]
name = "agent-os"
description = "The agents' CLI: tiny and fast; messages now, tasks and queues later."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agent-os"
path = "src/main.rs"

[dependencies]
org-client = { path = "../../crates/org-client" }
org-proto = { path = "../../crates/org-proto" }
org-spool = { path = "../../crates/org-spool" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Test-only: the real office server for tests/office.rs. Never a dependency of the binary.
# test-support: the grant signer and host-channel caller (persons act only through grants).
agentic-org-office = { path = "../agentic-org-office", features = ["test-support"] }
org-office = { path = "../../crates/org-office" }
org-office-launch = { path = "../../crates/org-office-launch" }
# Sends the transfer socket and channels over the rendezvous, as the host does.
org-socket = { path = "../../crates/org-socket" }
tempfile.workspace = true

[[test]]
name = "office"
path = "tests/office.rs"
# Its own main: run with ORG_AGENT_TEST_OFFICE_SERVER set, it is the office server (the server's
# library run as a child process, exactly as its binary runs it, with a test key on the launch
# line).
harness = false
