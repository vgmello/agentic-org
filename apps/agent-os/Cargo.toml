[package]
name = "agent-os"
description = "The agents' CLI: tiny and fast; messages now, tasks and queues later."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agent-os"
path = "src/main.rs"

[dependencies]
org-client = { path = "../../crates/org-client" }
org-proto = { path = "../../crates/org-proto" }
org-spool = { path = "../../crates/org-spool" }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Test-only, for tests/office.rs: the office's `office.json` as the host's provisioning
# leaves it. No office server runs in these tests; none is a dependency of the binary.
org-office-launch = { path = "../../crates/org-office-launch" }
tempfile.workspace = true

[[test]]
name = "office"
path = "tests/office.rs"
# Its own main, kept from when it also ran the office server as a child process: it runs its
# tests one after another and honours libtest's name filters, `--skip`, `--exact` and `--list`.
harness = false
