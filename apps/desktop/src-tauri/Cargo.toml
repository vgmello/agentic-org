[package]
name = "agentic-org"
description = "agentic.org: the desktop client for an AI organization's office servers"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
name = "agentic_org_lib"
