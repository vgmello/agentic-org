[package]
name = "agentic-org-office"
description = "Thin composition root binary for the Agentic Org office server daemon."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentic-org-office"
path = "src/main.rs"

[[test]]
name = "launch"
path = "tests/launch.rs"

[dependencies]
org-office-server = { path = "../../crates/org-office-server" }
org-office-sqlite = { path = "../../crates/org-office-sqlite" }
# Composition root wiring: concrete vendor runtime adapters are injected here so
# `org-office-sessions` never links vendor adapter crates.
org-agent-runtime = { path = "../../crates/org-agent-runtime" }
org-agent-runtime-acp = { path = "../../crates/org-agent-runtime-acp" }
org-agent-runtime-claude = { path = "../../crates/org-agent-runtime-claude" }
org-agent-runtime-codex = { path = "../../crates/org-agent-runtime-codex" }
org-office-sessions = { path = "../../crates/org-office-sessions" }
org-platform = { path = "../../crates/org-platform" }

[dev-dependencies]
org-office-server = { path = "../../crates/org-office-server", features = ["test-support"] }
libc.workspace = true
org-client = { path = "../../crates/org-client", features = ["testkit"] }
org-office = { path = "../../crates/org-office", features = ["testkit"] }
org-office-launch = { path = "../../crates/org-office-launch" }
org-proto = { path = "../../crates/org-proto" }
org-socket = { path = "../../crates/org-socket" }
hmac.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
