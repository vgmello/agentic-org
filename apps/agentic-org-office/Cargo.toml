[package]
name = "agentic-org-office"
description = "The office server: the daemon that holds an organization's office and serves org-proto."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentic-org-office"
path = "src/main.rs"

[[test]]
name = "launch"
path = "tests/launch.rs"

[[test]]
name = "owned_recovery"
path = "tests/owned_recovery.rs"

[features]
# Test helpers shared with the binary suite: the test grant signer and a host-channel caller.
test-support = []

[dependencies]
org-pki = { path = "../../crates/org-pki" }
zeroize = "=1.9.1"
org-socket = { path = "../../crates/org-socket" }
org-proto = { path = "../../crates/org-proto" }
org-office = { path = "../../crates/org-office" }
org-work = { path = "../../crates/org-work" }
org-mailbox = { path = "../../crates/org-mailbox" }
org-office-launch = { path = "../../crates/org-office-launch" }
org-supervise = { path = "../../crates/org-supervise" }
# The default office home and the socket path limit of the build target.
org-platform = { path = "../../crates/org-platform" }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
hmac.workspace = true
sha2.workspace = true

[dev-dependencies]
agentic-org-office = { path = ".", features = ["test-support"] }
org-sync = { path = "../../crates/org-sync" }
org-office = { path = "../../crates/org-office", features = ["testkit"] }
org-mailbox = { path = "../../crates/org-mailbox", features = ["testkit"] }
org-client = { path = "../../crates/org-client", features = ["testkit"] }
tempfile.workspace = true
syn = { version = "=2.0.119", features = ["full", "visit"] }
proc-macro2 = "=1.0.107"
