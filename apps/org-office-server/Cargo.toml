[package]
name = "org-office-server"
description = "The office server: the daemon that holds an organization's office and serves org-proto."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "org-office-server"
path = "src/main.rs"

[[test]]
name = "launch"
path = "tests/launch.rs"

[dependencies]
org-proto = { path = "../../crates/org-proto" }
org-office = { path = "../../crates/org-office" }
org-office-launch = { path = "../../crates/org-office-launch" }
libc.workspace = true
serde.workspace = true

[dev-dependencies]
org-client = { path = "../../crates/org-client" }
tempfile.workspace = true
serde_json.workspace = true
