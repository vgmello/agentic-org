[package]
name = "agentic-org-web"
description = "The instance browser HTTP service; no office database or key access."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentic-org-web"
path = "src/main.rs"

[dependencies]
org-proto = { path = "../../crates/org-proto" }
org-host-control = { path = "../../crates/org-host-control" }
# process::handoff/confinement, sessions::control (StreamReceiver, poll_readable), release::load (image cdhash).
org-socket = { path = "../../crates/org-socket" }
# release::{policy, authenticate, preload}: publisher-signed UI manifest verification.
org-release = { path = "../../crates/org-release" }
# sessions::http::Credentials (Deserialize), sessions::control typed host requests (Serialize).
serde.workspace = true
serde_json.workspace = true
# sessions::ingress::SecretBody, BrowserSessions::proof_key and Established::cookie.
zeroize = "=1.9.1"
# sessions::ProofMac: HMAC-SHA256 digest of the browser proof under a per-process key.
hmac.workspace = true
sha2.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio-rustls.workspace = true
scraper.workspace = true
base64.workspace = true
# release::files::Directory: no-follow openat reads of the verified release tree.
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
# build.rs embed_release_trust: validates the public publisher registry at build time.
org-release = { path = "../../crates/org-release" }
