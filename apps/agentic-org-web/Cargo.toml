[package]
name = "agentic-org-web"
description = "The instance browser HTTP service; no office database or key access."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentic-org-web"
path = "src/main.rs"

[dependencies]
org-proto = { path = "../../crates/org-proto" }
org-host-control = { path = "../../crates/org-host-control" }
# process::handoff/confinement, host (StreamReceiver, poll_readable), release::load (image cdhash).
org-socket = { path = "../../crates/org-socket" }
# process::serve: core-dump limit and confinement of this process before any input.
org-platform = { path = "../../crates/org-platform" }
# release::{policy, authenticate, preload}: publisher-signed UI manifest verification.
org-release = { path = "../../crates/org-release" }
# process handoff lines and host typed requests (Serialize/Deserialize).
serde.workspace = true
serde_json.workspace = true
# host::Reply and host request lines: control replies can carry the listener's TLS key.
zeroize = "=1.9.1"
sha2.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio-rustls.workspace = true
scraper.workspace = true
base64.workspace = true
# release::files::Directory: no-follow openat reads of the verified release tree.
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
# build.rs embed_release_trust: validates the public publisher registry at build time.
org-release = { path = "../../crates/org-release" }
