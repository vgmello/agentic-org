[package]
name = "agentic-org-web"
description = "The instance browser HTTP service; no office database or key access."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "agentic-org-web"
path = "src/main.rs"

[dependencies]
org-proto = { path = "../../crates/org-proto" }
org-host-control = { path = "../../crates/org-host-control" }
org-client = { path = "../../crates/org-client" }
org-socket = { path = "../../crates/org-socket" }
org-office-launch = { path = "../../crates/org-office-launch" }
org-release = { path = "../../crates/org-release" }
serde.workspace = true
serde_json.workspace = true
zeroize = "=1.9.1"
hmac.workspace = true
sha2.workspace = true
tokio.workspace = true
hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
tokio-rustls.workspace = true
scraper.workspace = true
base64.workspace = true
rustix = { version = "=1.1.6", default-features = false, features = ["fs", "std"] }

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[build-dependencies]
org-release = { path = "../../crates/org-release" }
