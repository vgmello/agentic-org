[package]
name = "org-server"
description = "The office server: the daemon that holds an organization's office and serves org-proto."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "org-server"
path = "src/main.rs"

[[test]]
name = "launch"
path = "tests/launch.rs"

[dependencies]
org-socket = { path = "../../crates/org-socket" }
org-proto = { path = "../../crates/org-proto" }
org-office = { path = "../../crates/org-office" }
org-work = { path = "../../crates/org-work" }
org-mailbox = { path = "../../crates/org-mailbox" }
org-office-launch = { path = "../../crates/org-office-launch" }
libc.workspace = true
serde.workspace = true
hmac.workspace = true
sha2.workspace = true

[dev-dependencies]
org-sync = { path = "../../crates/org-sync" }
org-office = { path = "../../crates/org-office", features = ["testkit"] }
org-mailbox = { path = "../../crates/org-mailbox", features = ["testkit"] }
org-client = { path = "../../crates/org-client" }
tempfile.workspace = true
serde_json.workspace = true
