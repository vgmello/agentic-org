[package]
name = "org-office-host"
description = "The host: the per-user login service that supervises one org-server per office, creates organizations and tells clients where offices are."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Builds `fake-office-server`, the stand-in office server the tests drive. Only the tests turn
# it on (through the dev-dependency on this package below), so a release build, an install or
# the app bundle never contains it.
test-support = []

[[bin]]
name = "org-office-host"
path = "src/main.rs"

[[bin]]
name = "fake-office-server"
path = "testing/fake_office_server.rs"
required-features = ["test-support"]
test = false
doc = false

[[bin]]
name = "fixture-office-host"
path = "testing/fixture_host.rs"
required-features = ["test-support"]
test = false
doc = false

[[test]]
name = "shutdown_signals"
# Exercise block-before-threads in a real single-threaded process, before libtest starts.
harness = false

[dependencies]
org-host-control = { path = "../../crates/org-host-control" }
org-socket = { path = "../../crates/org-socket" }
org-proto = { path = "../../crates/org-proto" }
org-office-launch = { path = "../../crates/org-office-launch" }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true
rusqlite.workspace = true
caseless = "=0.2.2"
unicode-normalization = "=0.1.26"

[target.'cfg(target_os = "macos")'.dependencies]
# The Data Protection keychain (the release key store, `src/keys/keychain.rs`) needs the
# workspace's `OSX_10_15` feature on both.
security-framework.workspace = true
security-framework-sys.workspace = true
core-foundation.workspace = true

[dev-dependencies]
# Turns on `test-support` for test builds only, so `CARGO_BIN_EXE_fake-office-server` exists.
org-office-host = { path = ".", features = ["test-support"] }
tempfile.workspace = true
