[package]
name = "org-office-host"
description = "The host: the per-user login service that supervises one org-office-server per office, creates organizations and tells clients where offices are."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Builds `fake-office-server`, the stand-in office server the tests drive. Only the tests turn
# it on (through the dev-dependency on this package below), so a release build, an install or
# the app bundle never contains it.
test-support = []

[[bin]]
name = "org-office-host"
path = "src/main.rs"

[[bin]]
name = "fake-office-server"
path = "testing/fake_office_server.rs"
required-features = ["test-support"]
test = false
doc = false

[dependencies]
org-proto = { path = "../../crates/org-proto" }
org-office-launch = { path = "../../crates/org-office-launch" }
serde.workspace = true
serde_json.workspace = true
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# `OSX_10_15` for the Data Protection keychain (`kSecUseDataProtectionKeychain`), where the
# release key store keeps every office's database key (`src/keys/keychain.rs`).
security-framework = { workspace = true, features = ["OSX_10_15"] }
# The key store's direct `SecItemAdd` (add-only), already in Cargo.lock through
# security-framework.
security-framework-sys = { version = "=2.17.0", features = ["OSX_10_15"] }
core-foundation.workspace = true

[dev-dependencies]
# Turns on `test-support` for test builds only, so `CARGO_BIN_EXE_fake-office-server` exists.
org-office-host = { path = ".", features = ["test-support"] }
tempfile.workspace = true
