<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agency · IA v2 prototype</title>
<!-- Prototype of information architecture v2 (Emery, draft 4.1: Eden's draft-4 recheck). Self-contained: no external requests. -->
<style>
:root {
  color-scheme: dark;
  --gray-950: #030712; --gray-900: #101828; --gray-800: #1e2939; --gray-700: #364153;
  --gray-500: #6a7282; --gray-400: #99a1af; --gray-300: #d1d5dc; --white: #ffffff;
  --indigo-500: #615fff; --indigo-400: #7c86ff; --indigo-300: #a3b3ff;
  --amber-400: #ffb900; --amber-300: #ffd230; --amber-200: #fee685;
  --green-500: #00c950; --green-400: #05df72;
  --red-400: #ff6467; --red-300: #ffa2a2;
  --sky-400: #00bcff; --sky-300: #74d4ff;
  --line: rgb(255 255 255 / .05); --line2: rgb(255 255 255 / .1);
  --hover: rgb(255 255 255 / .05); --sidebar: rgb(0 0 0 / .1);
  --radius-md: 6px; --radius-lg: 8px;
  --gutter: 32px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--gray-800); color: var(--white); }
body { font-family: "Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 14px; line-height: 24px; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, h4, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--indigo-400); outline-offset: 2px; border-radius: 4px; }
/* H3: the page title takes focus after navigation, but the ring is for keyboard focus only */
h1[tabindex="-1"]:focus, h1[tabindex="-1"]:focus-visible, h2[tabindex="-1"]:focus, h2[tabindex="-1"]:focus-visible { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--gray-400); }
.c-amber { color: var(--amber-200); } .c-green { color: var(--green-400); } .c-red { color: var(--red-300); }
.c-indigo { color: var(--indigo-300); } .c-gray { color: var(--gray-300); } .c-outline { color: var(--gray-400); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; color: var(--gray-300); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8em; background: var(--hover); color: var(--gray-300); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
.tnum { font-variant-numeric: tabular-nums; }

/* Icons: Heroicons outline style */
.ic { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.ic20 { width: 20px; height: 20px; } .ic16 { width: 16px; height: 16px; } .ic14 { width: 14px; height: 14px; stroke-width: 2; }
.ic48 { width: 48px; height: 48px; }

/* Skip link */
.skip { position: absolute; left: 12px; top: -60px; z-index: 200; background: var(--indigo-500); color: #fff; font-weight: 600; padding: 8px 12px; border-radius: var(--radius-md); }
.skip:focus { top: 12px; }

/* Shell */
/* §3: the panel doesn't scroll; the item list does, and Organization settings and the footer stay pinned below it */
.sidebar { position: fixed; inset: 0 auto 0 0; width: 288px; z-index: 50; display: flex; flex-direction: column; gap: 20px; overflow: hidden; background: #1b2533; box-shadow: inset -1px 0 0 var(--line); padding: 0 24px; }
.content { height: 100%; overflow-y: auto; padding-left: 288px; }
.logo { display: flex; align-items: center; gap: 12px; height: 64px; flex: none; margin: 0 -8px; padding: 0 8px; border-radius: var(--radius-md); width: calc(100% + 16px); text-align: left; }
.logo:hover { background: var(--hover); }
.logo .name { font-size: 16px; line-height: 28px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo:focus-visible { outline-offset: -2px; }
.nav { display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 20px; }
.nav > ul.nav-scroll { display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 28px; overflow-x: hidden; overflow-y: auto; margin: 0 -8px; padding: 0 8px 4px; }
.nav > ul.nav-pinned { flex: none; padding-bottom: 4px; }
/* DS v2.1 collapse rule: top-level items never scroll out of view. When the list is too short, fitNav() hides
   the Teams sub-list, then the Projects sub-list, leaving the parent items; if it still doesn't fit, it tightens
   the vertical spacing (.sidebar.tight); only then may the list scroll. */
.nav.fold-teams .subwrap[data-fold="teams"], .nav.fold-projects .subwrap[data-fold="projects"] { display: none; }
.sidebar.tight { gap: 8px; }
.sidebar.tight .nav { gap: 8px; }
.sidebar.tight .nav > ul.nav-scroll { gap: 12px; }
.nav-label { font-size: 12px; line-height: 24px; font-weight: 600; color: var(--gray-400); }
.nav-list { margin: 8px -8px 0; display: flex; flex-direction: column; gap: 4px; }
.nav-list.top { margin-top: 0; }
.nav-item { display: flex; align-items: center; gap: 12px; padding: 8px; border-radius: var(--radius-md); font-weight: 600; color: var(--gray-400); }
.nav-item:hover { background: var(--hover); color: #fff; }
.nav-item[aria-current="page"], .nav-item.cur { background: var(--hover); color: #fff; }
.nav-item:focus-visible { outline-offset: -2px; }
.nav-sub { margin: 4px 0 0 0; display: flex; flex-direction: column; gap: 2px; }
.nav-sub .nav-item { padding: 6px 8px 6px 44px; font-weight: 500; gap: 10px; }
.nav-sub .nav-item.more { font-size: 13px; }
.nav-sublabel { padding: 6px 8px 0 44px; font-size: 12px; line-height: 20px; font-weight: 600; color: var(--gray-400); }
.chip-i { display: inline-flex; width: 22px; height: 22px; flex: none; align-items: center; justify-content: center; border-radius: var(--radius-lg); border: 1px solid var(--line2); background: var(--hover); font-size: 10px; font-weight: 600; color: var(--gray-400); margin-left: -32px; }
.nav-item:hover .chip-i, .nav-item[aria-current="page"] .chip-i { color: #fff; border-color: rgb(255 255 255 / .2); }
.nav-sub .nav-item span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { margin-left: auto; border-radius: 999px; background: var(--amber-300); color: var(--gray-950); font-size: 12px; line-height: 16px; font-weight: 600; padding: 0 6px; }
.foot { flex: none; margin: 0 -24px; border-top: 1px solid var(--line); }
.foot .menu-wrap { display: block; }
.foot a, .foot .acct { display: flex; width: 100%; align-items: center; gap: 16px; padding: 12px 24px; text-align: left; }
.foot a:hover, .foot .acct:hover { background: var(--hover); }
.foot a:focus-visible, .foot .acct:focus-visible { outline-offset: -2px; }
.menu.up { top: auto; bottom: calc(100% + 6px); left: 16px; right: auto; }
.foot .who { font-weight: 600; }
.foot .office { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 20px; color: var(--gray-400); }
.foot .office .ic14 { color: var(--green-400); }
/* §3 owner button: trailing mini chevron-up-down */
.foot .acct .acct-chev { margin-left: auto; color: var(--gray-400); }
/* §20 rail office indicator: hidden at full width, shown in the rail */
.foot .office-rail { display: none; position: relative; }
.foot .office-rail .obadge { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 99px; background: #1b2533; display: inline-flex; align-items: center; justify-content: center; }
.foot .office-rail .obadge .ic { width: 12px; height: 12px; stroke-width: 2; color: var(--green-400); }

.proto-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 8px var(--gutter); background: rgb(0 0 0 / .2); border-bottom: 1px solid var(--line); font-size: 13px; color: var(--gray-300); }
.proto-banner .grow { flex: 1; min-width: 200px; }
.bctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; gap: 24px; height: 64px; padding: 0 var(--gutter); border-bottom: 1px solid var(--line); background: var(--gray-800); }
.search { position: relative; display: grid; flex: 1; max-width: 576px; height: 36px; border-radius: var(--radius-md); background: var(--hover); box-shadow: inset 0 0 0 1px var(--gray-500); }
.search:focus-within { box-shadow: inset 0 0 0 2px var(--indigo-400); }
.search > * { grid-area: 1 / 1; }
.search input { width: 100%; background: transparent; border: 0; color: #fff; padding: 0 40px 0 36px; font: inherit; font-size: 14px; }
.search input::placeholder { color: var(--gray-400); }
.search input:focus-visible { outline: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search > .ic20 { margin-left: 10px; align-self: center; color: var(--gray-400); pointer-events: none; }
.search kbd { justify-self: end; align-self: center; margin-right: 10px; border: 1px solid var(--line2); border-radius: 3px; padding: 0 4px; font-family: inherit; font-size: 12px; line-height: 18px; color: var(--gray-400); }
.sres { position: absolute; top: calc(100% + 6px); left: 0; right: 0; z-index: 70; max-height: 440px; overflow-y: auto; background: var(--gray-800); border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--line2), 0 8px 24px rgb(0 0 0 / .45); padding: 6px 0; }
.sres[hidden] { display: none; }
.sg { padding: 6px 12px 2px; font-size: 12px; line-height: 20px; font-weight: 600; color: var(--gray-400); }
.sopt { display: flex; align-items: center; gap: 10px; padding: 6px 12px; cursor: pointer; }
.sopt:hover, .sopt[aria-selected="true"] { background: var(--hover); }
.sopt[aria-selected="true"] { box-shadow: inset 2px 0 0 var(--indigo-400); }
.sopt > .ic20 { color: var(--gray-400); }
.sopt .grow { flex: 1; min-width: 0; }
.sopt .sl { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sopt .ss { display: block; font-size: 12px; line-height: 18px; color: var(--gray-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snone { padding: 10px 12px; color: var(--gray-400); }
.sopt.sall { font-weight: 600; color: var(--indigo-400); border-top: 1px solid var(--line); margin-top: 4px; }
/* §4: the "/" hint and the close button; the hint hides with Single-key shortcuts off and on phones */
body.nokeys .search kbd { display: none; }
.search .sclose { display: none; }
.new-btn .new-chev { color: var(--gray-400); }
.topbar .spacer { flex: 1; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 12px; border-radius: var(--radius-md); font-size: 14px; font-weight: 600; white-space: nowrap; }
.btn .ic20 { margin-left: -2px; }
.btn.primary { background: var(--indigo-500); color: #fff; }
.btn.primary:hover { background: rgb(97 95 255 / .8); }
.btn.outline { background: var(--hover); color: #fff; box-shadow: inset 0 0 0 1px var(--line2); }
.btn.outline:hover { background: var(--line2); }
.btn.ghost { color: var(--gray-300); }
.btn.ghost:hover { background: var(--hover); color: #fff; }
.btn.danger { background: rgb(255 100 103 / .1); color: var(--red-300); box-shadow: inset 0 0 0 1px rgb(255 100 103 / .2); }
.btn.sm { height: 30px; padding: 0 10px; font-size: 13px; }
.btn.icon { width: 36px; padding: 0; }
.btn.icon .ic20 { margin-left: 0; }
.btn.menu-btn, .btn.search-btn { display: none; }
.btn.textbtn { padding: 0 4px; font-weight: 500; color: #fff; }
.btn.textbtn:hover { background: var(--hover); }
.btn.textbtn .cur { color: var(--gray-400); font-weight: 500; }
.link { color: var(--indigo-400); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { color: var(--indigo-300); }
.alink:hover { text-decoration: underline; }

/* Menus */
.menu-wrap { position: relative; display: inline-block; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 200px; background: var(--gray-800); border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--line2), 0 0 0 1px rgb(0 0 0 / .3); padding: 8px 0; }
.menu.left { left: 0; right: auto; }
.menu[hidden] { display: none; }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 6px 12px; text-align: left; color: #fff; white-space: nowrap; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); outline-offset: -2px; }
.menu .ic20 { color: var(--gray-400); }
.menu button[aria-checked="true"] .ic20 { color: var(--indigo-400); }
.menu button.danger-item { color: var(--red-300); }
.menu-h { padding: 4px 12px; font-size: 12px; line-height: 20px; font-weight: 600; color: var(--gray-400); }
.menu hr { border: 0; height: 1px; background: var(--line); margin: 4px 0; }
.spacer20 { display: inline-block; width: 20px; height: 20px; flex: none; }

/* Page header */
.ph { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 24px var(--gutter); border-bottom: 1px solid var(--line); }
.ph-t { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.ph h1 { font-size: 16px; line-height: 28px; font-weight: 600; }
.cnt { font-size: 12px; line-height: 24px; color: var(--gray-400); font-weight: 400; }
.ph-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--gray-400); font-weight: 600; font-size: 13px; padding: 12px var(--gutter) 0; }
.back:hover { color: #fff; }
.desc { padding: 16px var(--gutter) 0; color: var(--gray-400); max-width: 820px; }

/* Sections */
.section { padding: 32px var(--gutter) 8px; }
.section + .section { border-top: 1px solid var(--line2); }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.sec-h h2 { font-size: 16px; line-height: 28px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
.sec-h h2 .ic20 { align-self: center; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; }
.cols2 > .section { border-top: 1px solid var(--line2); }
.cols2 > .section + .section { border-left: 1px solid var(--line); }

/* Tabs */
.tabs { display: flex; gap: 24px; overflow-x: auto; border-bottom: 1px solid var(--line2); padding: 0 var(--gutter); }
.tab { margin-bottom: -1px; border-bottom: 2px solid transparent; padding: 14px 4px; font-weight: 600; white-space: nowrap; color: var(--gray-400); display: inline-flex; align-items: center; gap: 8px; }
.tab:hover { color: #fff; border-color: rgb(255 255 255 / .2); }
.tab[aria-current="page"], .tab[aria-pressed="true"], .tab[aria-selected="true"] { color: #fff; border-color: var(--indigo-400); }
.tab:focus-visible { outline-offset: -2px; }
.tcount { border-radius: 99px; background: var(--hover); padding: 1px 8px; font-size: 12px; line-height: 18px; font-weight: 500; color: var(--gray-300); }
.subbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px var(--gutter); border-bottom: 1px solid var(--line); }
.seg { display: inline-flex; gap: 2px; padding: 2px; border-radius: var(--radius-md); background: var(--hover); box-shadow: inset 0 0 0 1px var(--line); }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 2px 10px; border-radius: 4px; font-size: 13px; font-weight: 600; color: var(--gray-400); }
.seg button:hover { color: #fff; }
.seg button[aria-pressed="true"] { background: var(--line2); color: #fff; }
.seg.icons button { padding: 4px 8px; }
.seg-label { font-size: 12px; color: var(--gray-400); font-weight: 600; }

/* Pills */
.pill { display: inline-flex; flex: none; align-items: center; gap: 6px; border-radius: 99px; padding: 4px 8px; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; box-shadow: inset 0 0 0 1px; }
.pill.chip { border-radius: var(--radius-md); }
.t-indigo { background: rgb(124 134 255 / .1); color: var(--indigo-300); box-shadow: inset 0 0 0 1px rgb(124 134 255 / .3); }
.t-gray { background: rgb(153 161 175 / .1); color: var(--gray-300); box-shadow: inset 0 0 0 1px rgb(153 161 175 / .2); }
.t-outline { background: transparent; color: var(--gray-400); box-shadow: inset 0 0 0 1px rgb(153 161 175 / .25); }
.t-green { background: rgb(0 201 80 / .1); color: var(--green-400); box-shadow: inset 0 0 0 1px rgb(0 201 80 / .2); }
.t-amber { background: rgb(255 185 0 / .1); color: var(--amber-200); box-shadow: inset 0 0 0 1px rgb(255 185 0 / .3); }
.t-red { background: rgb(255 100 103 / .1); color: var(--red-300); box-shadow: inset 0 0 0 1px rgb(255 100 103 / .2); }
.t-sky { background: rgb(0 188 255 / .1); color: var(--sky-300); box-shadow: inset 0 0 0 1px rgb(0 188 255 / .2); }
.pin { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
/* Long text with an icon (a goal line): wraps instead of pushing the page sideways at 390 px */
.pin.wrap { align-items: flex-start; white-space: normal; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.pin.wrap .ic14 { margin-top: 3px; }
.health { display: inline-flex; align-items: flex-start; gap: 6px; font-size: 13px; line-height: 20px; }
.health .ic16 { margin-top: 2px; }

/* Avatars and presence dots (Eden's presence table: never colour alone) */
.av { position: relative; display: inline-flex; flex: none; align-items: center; justify-content: center; border-radius: 99px; background: var(--gray-800); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line2); }
/* Avatars are always circles: fixed width and height that flex never stretches or shrinks */
.av24 { width: 24px; height: 24px; min-width: 24px; min-height: 24px; font-size: 10px; } .av32 { width: 32px; height: 32px; min-width: 32px; min-height: 32px; font-size: 12px; }
.av40 { width: 40px; height: 40px; min-width: 40px; min-height: 40px; font-size: 14px; }
.av { aspect-ratio: 1 / 1; align-self: center; }
.av > .ic { flex: none; }
.av.empty { color: var(--gray-400); }
.avdot { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 99px; box-shadow: 0 0 0 2px var(--gray-800); }
.av24 .avdot { width: 8px; height: 8px; }
.av40 .avdot { width: 12px; height: 12px; }
.p-needs { background: var(--amber-400); }
.p-withyou { background: var(--indigo-400); }
/* §7 Working pulse: on a pseudo-element, so it never replaces the dot's own ring; stopped under reduced motion */
.p-working { background: var(--indigo-400); }
.p-working::after { content: ""; position: absolute; inset: 0; border-radius: inherit; animation: soft-pulse 2s ease-in-out infinite; }
.p-paused { background: linear-gradient(90deg, transparent 24%, var(--gray-300) 24% 42%, transparent 42% 58%, var(--gray-300) 58% 76%, transparent 76%) var(--gray-700); }
.p-available { background: var(--green-400); }
.p-asleep { background: var(--gray-400); }
.p-offline { background: var(--gray-800); box-shadow: 0 0 0 2px var(--gray-800), inset 0 0 0 2px var(--gray-400); }
@keyframes soft-pulse { 0%,100% { box-shadow: 0 0 0 0 rgb(124 134 255 / .45); } 50% { box-shadow: 0 0 0 5px rgb(124 134 255 / 0); } }
.avstack { display: flex; }
.avstack .av { margin-left: -6px; box-shadow: 0 0 0 2px var(--gray-800); }
.avstack .av:first-child { margin-left: 0; }
.avstack .more { font-size: 12px; color: var(--gray-400); margin-left: 6px; align-self: center; }

/* Rows */
.rows > li { position: relative; display: flex; align-items: center; gap: 16px; padding: 16px var(--gutter); border-bottom: 1px solid var(--line); }
.rows > li:last-child { border-bottom: 0; }
.rows > li.linked:hover { background: rgb(255 255 255 / .025); }
.rows .grow { flex: 1; min-width: 0; }
.rt { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; flex-wrap: wrap; }
.rt .sec { font-weight: 400; color: var(--gray-400); }
.stretch::after { content: ""; position: absolute; inset: 0; }
.stretch:focus-visible { outline: none; }
.stretch:focus-visible::after { outline: 2px solid var(--indigo-400); outline-offset: -2px; }
.rows .z { position: relative; z-index: 2; }
.meta { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; line-height: 20px; color: var(--gray-400); }
.meta a { position: relative; z-index: 2; }
.meta a:hover { color: #fff; text-decoration: underline; }
.rowline { margin-top: 2px; font-size: 13px; line-height: 20px; color: var(--gray-300); }
.rowline a { position: relative; z-index: 2; }
.rowline a:hover { color: #fff; text-decoration: underline; }
.sep { width: 2px; height: 2px; border-radius: 99px; background: var(--gray-400); flex: none; }
.chev { color: var(--gray-400); }
.empty-row { padding: 48px var(--gutter); text-align: center; color: var(--gray-400); }
.grp-h { padding: 8px var(--gutter); font-size: 12px; font-weight: 600; color: var(--gray-400); background: rgb(0 0 0 / .1); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); }
.more-row { padding: 12px var(--gutter) 16px; }

/* Cards (Home only, D8): neutral outline, the pill is the signal (H1) */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.card.linked:hover { background: rgb(255 255 255 / .025); }
.card h3 { font-size: 14px; font-weight: 600; }
.card .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card .top .grow { flex: 1; min-width: 0; font-size: 13px; }
.card.done h3, .card.done .why { color: var(--gray-400); }
.why { color: var(--gray-300); font-size: 13px; line-height: 20px; }
.rec { display: flex; gap: 8px; font-size: 13px; line-height: 20px; color: var(--gray-300); }
.rec .ic16 { margin-top: 2px; color: var(--gray-400); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
/* §9: a handled item's outcome is a plain gray line, no second icon */
.handled { font-size: 14px; line-height: 24px; color: var(--gray-400); }
/* D37: project Team tab, team chips then members */
.tchips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px var(--gutter); border-bottom: 1px solid var(--line); }
.tchip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 10px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--line2); background: var(--hover); font-size: 13px; font-weight: 600; }
.tchip a:hover { text-decoration: underline; }
.tchip .rm { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 4px; color: var(--gray-400); }
.tchip .rm:hover { background: var(--line2); color: #fff; }
.tchip .rm:focus-visible { outline-offset: 2px; }
.btn.xs { height: 28px; padding: 0 8px; font-size: 12px; }
/* Switch (Your preferences) */
.pref { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; max-width: 640px; }
.pref .lbl { font-weight: 500; }
.switch { position: relative; flex: none; width: 44px; height: 24px; border-radius: 99px; background: var(--gray-700); box-shadow: inset 0 0 0 1px var(--gray-500); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 99px; background: #fff; transition: transform .1s; }
.switch[aria-checked="true"] { background: var(--indigo-500); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(20px); }
/* Unavailable page (§21): route-error layout, logo above, one sentence, no button */
.unavail { padding: 96px var(--gutter); text-align: center; }
.unavail h1 { margin-top: 16px; font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -.02em; }
.unavail p { margin-top: 24px; color: var(--gray-400); }
.reply { display: flex; flex-direction: column; gap: 8px; }
textarea, input.field, select.field { width: 100%; background: var(--hover); color: #fff; border: 0; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--gray-500); padding: 6px 12px; font: inherit; }
textarea:focus-visible, input.field:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--indigo-400); }
/* I2: selects show the indigo ring in WebKit too */
select:focus-visible, select.field:focus-visible { outline: 2px solid var(--indigo-400); outline-offset: 2px; box-shadow: inset 0 0 0 1px var(--gray-500); }
select.field { width: auto; padding-right: 28px; height: 32px; padding-top: 0; padding-bottom: 0; }
select.field option { background: var(--gray-800); }
textarea::placeholder, input.field::placeholder { color: var(--gray-400); }
.progress { height: 6px; border-radius: 99px; background: var(--line2); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--indigo-400); border-radius: 99px; }
.progress.done > span { background: var(--gray-500); }
.prog-line { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--gray-400); }
.prog-line .progress { flex: 1; }
.ph-prog { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 12px; line-height: 20px; color: var(--gray-400); }
.ph-prog .prog-line { flex: 0 1 360px; min-width: 200px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--gray-400); }
.stats b { color: #fff; font-weight: 600; font-size: 14px; }

/* Empty, loading and error states (H4) */
.empty { padding: 64px var(--gutter); text-align: center; }
.av.empty { padding: 0; } /* the Unassigned avatar shares the class name; keep it a circle */
.empty .ic48 { color: var(--gray-400); }
.empty h3 { margin-top: 8px; font-weight: 600; }
.empty p { margin: 4px auto 0; max-width: 380px; color: var(--gray-400); }
.empty.small { padding: 24px 0 32px; }
.skel { display: flex; flex-direction: column; gap: 18px; padding: 8px 0 24px; }
.skel-row { display: flex; align-items: center; gap: 12px; }
.skel-b { height: 14px; border-radius: 4px; background: rgb(255 255 255 / .07); animation: skel 1.6s ease-in-out infinite; }
.skel-c { width: 32px; height: 32px; border-radius: 99px; flex: none; background: rgb(255 255 255 / .07); animation: skel 1.6s ease-in-out infinite; }
@keyframes skel { 50% { opacity: .45; } }

/* Callout */
.callout { display: flex; gap: 12px; border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); background: rgb(255 255 255 / .03); padding: 12px 16px; color: var(--gray-300); }
.callout .ic20 { color: var(--gray-400); margin-top: 2px; flex: none; }
.callout .btn { margin-top: 8px; }

/* Feed */
.feed > li { padding: 16px var(--gutter); border-bottom: 1px solid var(--line); }
.feed > li:last-child { border-bottom: 0; }
.feed .l1 { display: flex; align-items: center; gap: 12px; }
.feed .l1 .actor { font-weight: 600; flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feed .l1 time { font-size: 12px; color: var(--gray-400); flex: none; }
.feed .l2 { margin-top: 6px; color: var(--gray-400); padding-left: 36px; }
.feed .l2 a { color: var(--gray-300); } .feed .l2 a:hover { color: #fff; text-decoration: underline; }
.feed .kind { font-size: 12px; font-weight: 500; color: var(--gray-400); display: inline-flex; align-items: center; gap: 4px; }
.runlog[hidden] { display: none; }
.runlog { margin: 10px 0 0 36px; border-left: 2px solid var(--line2); padding: 4px 0 4px 16px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--gray-300); }
.runlog li { display: flex; gap: 12px; }
.runlog time { color: var(--gray-400); font-variant-numeric: tabular-nums; width: 44px; flex: none; }
.runbtn { margin: 8px 0 0 36px; }
.compact .feed > li, .compact .rows > li { padding-left: 0; padding-right: 0; }

/* Inbox */
.split { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; min-height: calc(100vh - 200px); }
.split .list { border-right: 1px solid var(--line); }
.ibx { display: block; padding: 14px var(--gutter); border-bottom: 1px solid var(--line); position: relative; }
.ibx:hover { background: rgb(255 255 255 / .025); }
.ibx[aria-current="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--indigo-400); }
.ibx:focus-visible { outline-offset: -2px; }
.ibx .l1 { display: flex; align-items: center; gap: 10px; }
.ibx .l1 .who { font-weight: 600; flex: 1; min-width: 0; }
.ibx .l1 time { font-size: 12px; color: var(--gray-400); }
.ibx .what { margin-top: 6px; color: var(--gray-300); }
.ibx.done .what { color: var(--gray-400); }
.detail { padding: 24px var(--gutter); display: flex; flex-direction: column; gap: 20px; max-width: 760px; min-width: 0; }
.detail h2 { font-size: 16px; line-height: 28px; font-weight: 600; }
.dl { display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px; font-size: 13px; }
.dl dt { color: var(--gray-400); }
.dl dd { color: var(--gray-300); min-width: 0; overflow-wrap: anywhere; }
.dl dd a { color: var(--indigo-400); } .dl dd a:hover { color: var(--indigo-300); }
.blk h3 { font-size: 12px; font-weight: 600; color: var(--gray-400); margin-bottom: 4px; }

/* Board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 16px; padding: 16px var(--gutter) 32px; overflow-x: auto; }
.bcol { background: rgb(0 0 0 / .1); border-radius: var(--radius-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 160px; }
.bcol h3 { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
.bcard { border-radius: var(--radius-md); background: var(--gray-800); box-shadow: inset 0 0 0 1px var(--line2); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 20px; }
.bcard .t { font-weight: 600; }
.bcard .m { display: flex; align-items: center; gap: 6px; color: var(--gray-400); font-size: 12px; flex-wrap: wrap; }

/* Chat */
.chat { display: grid; grid-template-columns: 240px 1fr; height: calc(100vh - 64px - 38px); }
.chat.withthread { grid-template-columns: 240px 1fr 340px; }
.chlist { border-right: 1px solid var(--line); background: rgb(0 0 0 / .1); overflow-y: auto; padding: 16px 12px; }
.chlist h2 { font-size: 12px; font-weight: 600; color: var(--gray-400); padding: 8px 8px 4px; }
.chlist a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-md); color: var(--gray-400); font-weight: 500; }
.chlist a:hover { background: var(--hover); color: #fff; }
.chlist a[aria-current="page"] { background: var(--hover); color: #fff; }

.chmain { display: flex; flex-direction: column; min-width: 0; }
.chhead { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.chhead h1 { font-size: 16px; font-weight: 600; }
.msgs { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 18px; }
.msg { display: flex; gap: 12px; }
.msg .body { min-width: 0; flex: 1; }
.msg .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.msg .hd b { font-weight: 600; }
.msg .hd span { font-size: 12px; color: var(--gray-400); }
.msg .tx { color: var(--gray-300); }
.thr { margin-top: 4px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--indigo-400); }
.thr:hover { color: var(--indigo-300); }
.ask { margin-top: 8px; border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.ask .q { font-weight: 600; }
.compose { border-top: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 8px; }
.compose input { flex: 1; }
.readnote { display: flex; align-items: center; gap: 8px; margin: 12px 24px 0; padding: 8px 12px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--line2); background: rgb(255 255 255 / .03); color: var(--gray-300); font-size: 13px; }
.readnote .ic16 { flex: none; }
.readfoot { border-top: 1px solid var(--line); padding: 14px 24px; color: var(--gray-400); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.thread { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }

/* Teams / org chart */
.tree, .tree ul { list-style: none; }
.tree ul { margin-left: 22px; padding-left: 26px; border-left: 1px solid var(--line2); }
.tree li { position: relative; padding: 6px 0; }
.tree ul > li::before { content: ""; position: absolute; left: -26px; top: 30px; width: 22px; border-top: 1px solid var(--line2); }
.node { display: inline-flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); min-width: 280px; max-width: 100%; }
.node > span { min-width: 0; }
.node:hover { background: var(--hover); }
.node .nm { font-weight: 600; }
.node .rl { display: block; font-size: 12px; line-height: 18px; color: var(--gray-400); }
.node.owner { background: rgb(255 255 255 / .03); }
.owner-wrap { padding: 24px var(--gutter) 8px; }
/* Owner card: not a link (there is no owner profile in draft 3), so no hover */
.ocard { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); background: rgb(255 255 255 / .03); max-width: 640px; }
.ocard .nm { font-weight: 600; }
.ocard .rl { display: block; font-size: 12px; line-height: 18px; color: var(--gray-400); }

/* Profile (M4: 40 px avatar, 16 px name with the role beside it) */
.prof { display: flex; gap: 16px; align-items: flex-start; padding: 24px var(--gutter); background: rgb(0 0 0 / .1); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.prof .grow { flex: 1; min-width: 240px; }
.prof h1 { font-size: 16px; line-height: 28px; font-weight: 600; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.prof h1 .role { font-size: 14px; font-weight: 400; color: var(--gray-400); }
.prof .meta { margin-top: 2px; }
.prof .now { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--gray-300); }
.grid2 { display: grid; grid-template-columns: 1fr 340px; gap: 0; }
.grid2 > aside { border-left: 1px solid var(--line); padding: 24px; min-width: 0; }
.setup h2 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
.setup .dl { grid-template-columns: 110px 1fr; }
.journal { max-width: 820px; display: flex; flex-direction: column; gap: 16px; }
.journal article { border-left: 2px solid var(--line2); padding-left: 16px; }
.journal h3 { font-size: 13px; font-weight: 600; color: var(--gray-300); }
.journal p, .journal li { color: var(--gray-300); font-size: 13px; line-height: 20px; }
.journal ul { list-style: disc; padding-left: 18px; margin-top: 4px; }

/* Settings */
.settings { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 102px); }
.settings > div { min-width: 0; }
.subnav { border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 2px; }
.subnav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-md); color: var(--gray-400); font-weight: 600; white-space: nowrap; }
.subnav a:hover { background: var(--hover); color: #fff; }
.subnav a[aria-current="page"] { background: var(--hover); color: #fff; }
.subnav .note { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--gray-400); }
table.tbl { width: 100%; border-collapse: collapse; text-align: left; }
.tbl th { font-weight: 600; font-size: 13px; padding: 8px 12px; border-bottom: 1px solid var(--line2); }
.tbl td { padding: 14px 12px; border-bottom: 1px solid var(--line); color: var(--gray-300); font-size: 13px; }
.tbl th:first-child, .tbl td:first-child { padding-left: var(--gutter); }
.tbl td a.nm { color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
.tbl td a.nm:hover { text-decoration: underline; }
.only-sm { display: none; }
.form { max-width: 640px; display: flex; flex-direction: column; gap: 20px; padding: 24px var(--gutter); }
.form label { display: block; font-weight: 500; margin-bottom: 6px; }
.form .help { margin-top: 6px; font-size: 12px; color: var(--gray-400); }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 90; background: rgb(16 24 40 / .8); }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; width: min(680px, 100%); background: var(--gray-800); box-shadow: inset 1px 0 0 var(--line2); display: flex; flex-direction: column; }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--line); }
.sheet header h2 { font-size: 16px; font-weight: 600; }
.sheet .body { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.sheet h3 { font-size: 14px; font-weight: 600; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 13px; }
.sheet th, .sheet td { text-align: left; vertical-align: top; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
.sheet td { color: var(--gray-300); }
.sheet th { color: #fff; }
.toasts { position: fixed; right: 24px; bottom: 24px; z-index: 120; display: flex; flex-direction: column; gap: 8px; }
.toast { display: flex; gap: 12px; align-items: flex-start; max-width: 380px; border-radius: var(--radius-lg); background: var(--gray-800); box-shadow: inset 0 0 0 1px var(--line2), 0 0 0 1px rgb(0 0 0 / .3); padding: 14px 16px; }
.toast .ic { color: var(--indigo-400); }
.toast p { font-weight: 500; }
/* §13 Dialog: centred, max 448 px (512 px for forms) */
.sheet.dialog { top: 50%; left: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); width: min(448px, calc(100% - 32px)); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); padding: 24px; gap: 0; }
.dialog h2 { font-size: 16px; line-height: 28px; font-weight: 600; }
.dialog .dsc { margin-top: 8px; color: var(--gray-400); }
.dialog .dfoot { margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
.dialog fieldset { border: 0; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.dialog label.opt { display: flex; align-items: center; gap: 10px; }

/* Narrow widths (§20): sidebar from 960, rail 640-959, top bar + drawer below 640 */
@media (max-width: 1279px) { .cols2, .grid2 { grid-template-columns: 1fr; } .cols2 > .section + .section { border-left: 0; } .grid2 > aside { border-left: 0; border-top: 1px solid var(--line); } .chat.withthread { grid-template-columns: 220px 1fr; } .chat.withthread .thread { position: fixed; right: 0; top: 0; bottom: 0; width: min(360px, 100%); z-index: 80; background: var(--gray-800); } }
@media (max-width: 959px) {
  :root { --gutter: 24px; }
  .settings { align-content: start; } /* one column: keep the sub-nav bar its natural height */
  /* I1: below 960 an Inbox item opens as its own view, with a way back to the list */
  /* the own view is rendered by pageInbox (no Inbox header or tabs); the list fills the page */
  .split, .settings { grid-template-columns: 1fr; }
  .split .list { border-right: 0; }
  .split .detail { display: none; }
  /* Settings: the §12 underline bar instead of a chip group */
  .subnav { flex-direction: row; gap: 24px; overflow-x: auto; padding: 0 var(--gutter); border-right: 0; border-bottom: 1px solid var(--line2); }
  .subnav a { flex: none; border-radius: 0; padding: 14px 4px; margin-bottom: -1px; border-bottom: 2px solid transparent; white-space: nowrap; }
  .subnav a:hover { background: none; border-bottom-color: rgb(255 255 255 / .2); }
  .subnav a[aria-current="page"] { background: none; border-bottom-color: var(--indigo-400); }
  .subnav a:focus-visible { outline-offset: -2px; }
  .chat, .chat.withthread { grid-template-columns: 1fr; height: auto; }
  .chlist { border-right: 0; }
}
@media (min-width: 640px) and (max-width: 959px) {
  /* overflow visible so the account menu can open beside the rail; the item list still scrolls on its own */
  .sidebar { width: 64px; padding: 0 8px; gap: 12px; overflow: visible; }
  .content { padding-left: 64px; }
  .logo { justify-content: center; margin: 8px auto 0; width: 48px; height: 48px; padding: 0; }
  .logo .name { display: none; }
  .nav-label, .subwrap { display: none; }
  /* §3, §20: the footer collapses to the account-menu button and the office indicator, no text */
  .foot { margin: 0 -8px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; }
  .foot .menu-wrap { display: block; }
  .foot .acct { width: 48px; height: 48px; padding: 0; justify-content: center; gap: 0; border-radius: var(--radius-md); }
  .foot .acct .acct-txt, .foot .acct .acct-chev, .foot .office-full { display: none; }
  .foot a.office-link { width: 48px; height: 48px; padding: 0; justify-content: center; border-radius: var(--radius-md); }
  .foot .office-rail { display: inline-flex; color: var(--gray-400); }
  .foot a.office-link:hover .office-rail { color: #fff; }
  .menu.up { left: 4px; min-width: 220px; }
  .nav > ul { gap: 12px; }
  .nav-list { margin: 0; align-items: center; }
  .nav-item { position: relative; width: 48px; height: 48px; justify-content: center; padding: 0; }
  .nav-item .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .nav-item .badge { position: absolute; top: 2px; right: 0; }
}
@media (max-width: 639px) {
  :root { --gutter: 16px; }
  .sidebar { transform: translateX(-100%); transition: transform .15s; }
  body.drawer .sidebar { transform: none; }
  body.drawer .scrim { display: block; }
  .content { padding-left: 0; }
  .topbar { height: 56px; gap: 8px; }
  .btn.menu-btn, .btn.search-btn { display: inline-flex; }
  .search { display: none; }
  /* §4: the open narrow search covers the whole bar, opaque, with a trailing 44 px close button; no "/" hint on phones */
  body.searching .search { display: grid; grid-template-columns: 1fr auto; position: absolute; inset: 0; height: 100%; max-width: none; border-radius: 0; z-index: 10; background: var(--gray-800); }
  body.searching .search > .ic20, body.searching .search input { grid-column: 1; }
  .search kbd { display: none; }
  body.searching .search .sclose { display: inline-flex; grid-column: 2; align-self: center; width: 44px; height: 44px; margin-right: 4px; }
  .new-lbl, .new-btn .new-chev { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  /* §20: New ▾ becomes a 44 px icon button */
  .btn.new-btn { width: 44px; height: 44px; min-height: 44px; padding: 0; }
  .btn.new-btn .ic20 { margin-left: 0; }
  .tchip .rm { width: 44px; height: 44px; }
  .btn.xs { min-height: 44px; }
  .hide-sm { display: none; }
  .only-sm { display: block; } .only-wide { display: none; }
  .node { min-width: 0; }
  /* Org chart indent 20 px a level below 640 (§12) */
  .tree ul { margin-left: 8px; padding-left: 12px; }
  .tree ul > li::before { left: -12px; width: 8px; }
  /* 44 px targets (§10, §20), the List | Board toggle included */
  .btn, .btn.sm { height: auto; min-height: 44px; }
  .btn.icon { width: 44px; height: 44px; }
  .tab { min-height: 44px; padding: 10px 4px; }
  .seg button, .seg.icons button { min-height: 44px; min-width: 44px; }

/* ---------------------------------------------------------------- inbox items */
function sourceOf(it) {
  if (it.src) return it.src;
  return it.task ? { href: `#/projects/${it.proj}/work`, label: "Open " + it.task } : { href: `#/chat/${P[it.proj].channel}`, label: "Open #" + CH[P[it.proj].channel].name };
}
/* Inline actions call the same operation as the source screen; where none exists, the card offers Open.
   On Home cards every button is outline (H2); the Inbox detail holds the one primary. */
function itemActions(it, where) {
  /* §9: the Handled pill already says it's handled, so the outcome is a plain gray line with no second icon */
  if (it.handled) return `<p class="handled" id="handled-${esc(it.id)}">${esc(it.outcome)}</p>`;
  const card = where === "card", first = card ? "outline" : "primary";
  const open = card ? `<a class="btn outline sm" href="#/inbox/${it.id}">${ic("open", "ic16")}Open</a>` : (() => { const s = sourceOf(it); return `<a class="btn ghost sm" href="${s.href}">${ic("open", "ic16")}${esc(s.label)}</a>`; })();
  if (S.replying === it.id) {
    /* Reply, and Request changes on a "Review requested" item, open an inline field; Send works only with text in it */
    const changes = S.replyMode === "changes", who = esc(M[it.from].name);
    const lbl = changes ? `What should ${who} change?` : `Reply to ${who}`;
    return `<div class="reply"><label class="sr-only" for="r-${it.id}">${lbl}</label><textarea id="r-${it.id}" rows="2" placeholder="${lbl}…"></textarea>
      <div class="actions"><button class="btn ${first} sm" type="button" data-act="send-reply" data-id="${it.id}">${ic("send", "ic16")}${changes ? "Send changes" : "Send reply"}</button><button class="btn ghost sm" type="button" data-act="cancel-reply" data-id="${it.id}">Cancel</button></div></div>`;
  }
  const b = [];
  const btn = (style, act, v, icon, label) => `<button class="btn ${style} sm" type="button" data-act="${act}" data-id="${it.id}"${v ? ` data-v="${esc(v)}"` : ""}>${icon ? ic(icon, "ic16") : ""}${esc(label)}</button>`;
  if (it.acts) it.acts.forEach(([label, outcome, icon, mode], i) => b.push(mode === "changes" ? btn(i ? "outline" : first, "reply", "changes", icon, label) : btn(i ? "outline" : first, "handle", outcome, icon, label)));
  else if (it.kind === "approval") { b.push(btn(first, "handle", "Approved", "check", "Approve")); b.push(btn("outline", "handle", "Denied", "deny", "Deny")); }
  else if (it.kind === "question") b.push(btn(first, "reply", "", "reply", "Reply"));
  else if (it.kind === "decision") it.opts.forEach((o, i) => b.push(btn(i ? "outline" : first, "handle", "Chose: " + o, null, o)));
  else if (it.kind === "problem") { if (it.resume) b.push(btn(first, "handle", "Goal resumed", "play", "Resume")); if (it.assign) b.push(btn(first, "assign", "", "user-plus", "Assign…")); if (it.dismiss) b.push(btn("outline", "handle", "Dismissed", "x", "Dismiss")); }

/* ---------------------------------------------------------------- feed */
const ATYPE = { work: { label: "Work", icon: "clipboard" }, conversation: { label: "Conversation", icon: "chat" }, decision: { label: "Decision", icon: "flag" }, org: { label: "Org change", icon: "user-group" }, run: { label: "Run", icon: "terminal" } };

function workRow(w) {

function board(items, kind) {

/* ---------------------------------------------------------------- pages */
function pageHome() {

function pageInbox(sel) {

  const cnt = (k) => base.filter((i) => !i.handled && (k === "all" || i.kind === k)).length;
  const tabs = [["all", "All", cnt("all")], ...Object.keys(KIND).map((k) => [k, KIND[k].plural, cnt(k)]), ["handled", "Handled", base.filter((i) => i.handled).length]];
  const item = IN.find((i) => i.id === sel) || null;

  const groups = ["Today", "Earlier"].map((g) => {

    return `<h2 class="grp-h">${g}</h2>${its.map((i) => `<a class="ibx${i.handled ? " done" : ""}" href="#/inbox/${i.id}" ${item && item.id === i.id ? 'aria-current="true"' : ""}>

      <span class="what" style="display:block">${esc(i.what)}</span>

  }).join("");
  /* Decision i (§13): below 960 px an item opens as its own view: no Inbox header or tabs, a back link "Inbox", the "what" line is the h1 */
  if (item && narrow()) return back("#/inbox", "Inbox") + `<section class="detail" aria-label="Inbox item">${inboxDetail(item, true)}</section>`;

  ["Approvals", "Hire requests, run approvals, permission requests, fixes to verify, reviews requested, hand-offs to you", "Approve, Deny (Approve fix, Reopen for a fix to verify; Approve, Request changes for a review requested; Accept for a hand-off), Open", "When answered, here or anywhere (a hand-off when accepted, here or in Chat)"],
  ["Questions", "An agent asks you something, or a question about a work item", "Reply, Open", "When answered"],
  ["Decisions", "Escalations with options and the agent's recommendation", "Choose an option, Open", "When you choose"],
  ["Problems", "Work blocked on you, goal paused, run error or crash, budget reached, critical bug, unplaced agent", "Open; Resume when a goal is paused; Assign… for a critical bug; Dismiss for errors and crashes; Dismiss for this month for a budget", "When resolved (a critical bug when assigned to anyone or closed; an unplaced agent when placed); errors, crashes and budgets can be dismissed"]
];
function openChanges(trigger) {
  sheetReturn = trigger;
  document.getElementById("overlay-root").innerHTML = `<div class="overlay" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-title">
    <header><h2 id="sh-title">What changed</h2><button class="btn ghost icon" type="button" data-act="close-sheet" aria-label="Close">${ic("x", "ic20")}</button></header>
    <div class="body"><p class="muted">Information architecture v2 organizes the app like a company: what needs you first, then projects and work, then teams, then settings. Here is where each screen of today's app goes.</p>
    <table><thead><tr><th scope="col">Today</th><th scope="col">In v2</th></tr></thead><tbody>${CHANGES.map(([a, b]) => `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`).join("")}</tbody></table>
    <h3>Inbox kinds</h3>
    <table><thead><tr><th scope="col">Kind</th><th scope="col">Includes</th><th scope="col">Actions</th><th scope="col">Clears</th></tr></thead><tbody>${INBOX_KINDS.map((r) => `<tr>${r.map((c) => `<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>
    <p class="callout" style="font-size:13px">${ic("info", "ic20")}<span>Inline actions call the same operation as the source screen; where none exists, the card offers Open.</span></p>
    <div class="callout">${ic("info", "ic20")}<span>One presence vocabulary, highest first: Needs you, With you, Working, Paused, Available, Asleep, Offline, Status unknown. Needs you comes from open Inbox items. With "Data: v1.0 today", only Paused and Needs you show in lists; an unknown status shows nothing there, and only a member's profile says "Status unknown". People have no presence. Runs, live status and notes and memory say they aren't available yet.</span></div>
    <div class="callout">${ic("user", "ic20")}<span>The owner isn't a member of any team and has no profile page. You appear as the owner card on Teams and Org chart, in "Reports to You", and in the sidebar footer, which opens your account menu.</span></div>
    <div><button class="btn primary" type="button" data-act="close-sheet">Got it</button></div></div></div>`;
  document.querySelector(".sheet button").focus();
}
/* §13 Dialog: focus moves in, Escape or Cancel closes and returns focus to the trigger */
function openDialog(trigger, title, desc, body, foot) {
  sheetReturn = trigger;
  document.getElementById("overlay-root").innerHTML = `<div class="overlay" data-act="close-sheet"></div><div class="sheet dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t"${desc ? ' aria-describedby="dlg-d"' : ""}>
    <h2 id="dlg-t">${esc(title)}</h2>${desc ? `<p class="dsc" id="dlg-d">${esc(desc)}</p>` : ""}${body}<div class="dfoot">${foot}</div></div>`;
  const f = document.querySelector(".sheet input:checked, .sheet select, .sheet button"); if (f) f.focus();
}
const cancelBtn = '<button class="btn outline" type="button" data-act="close-sheet">Cancel</button>';
/* AC-IA17-4, D30: Set health… (On track · At risk · Off track · Not set) */
function openHealth(pid, trigger) {
  const pr = P[pid], cur = pr.health || "none";
  const opts = [["On track", "On track"], ["At risk", "At risk"], ["Off track", "Off track"], ["none", "Not set"]];
  openDialog(trigger, `Set health for ${pr.name}`, "", `<fieldset><legend class="sr-only">Health</legend>${opts.map(([v, l]) => `<label class="opt"><input type="radio" name="health" value="${esc(v)}" ${v === cur ? "checked" : ""}>${esc(l)}</label>`).join("")}</fieldset>`,
    cancelBtn + `<button class="btn primary" type="button" data-act="health-save" data-id="${pid}">Set health</button>`);
}
/* D37: removing the last team asks first */
function openConfirmRemove(pid, t, trigger) {
  openDialog(trigger, `Remove ${TEAMS[t].name} from ${P[pid].name}?`, `${P[pid].name} will have no team.`, "",
    cancelBtn + `<button class="btn danger" type="button" data-act="team-rm-confirm" data-id="${pid}" data-v="${t}">Remove ${esc(TEAMS[t].name)}</button>`);
}
function openAddTeam(pid, trigger) {
  const free = Object.keys(TEAMS).filter((t) => !P[pid].teams.includes(t));
  const verb = P[pid].teams.length ? "Add" : "Assign";
  openDialog(trigger, `${verb} a team to ${P[pid].name}`, "", `<div style="margin-top:16px"><label for="add-team" style="display:block;font-weight:500;margin-bottom:6px">Team</label><select class="field" id="add-team" style="width:100%">${free.map((t) => `<option value="${t}">${esc(TEAMS[t].name)}</option>`).join("")}</select></div>`,
    cancelBtn + `<button class="btn primary" type="button" data-act="team-add-save" data-id="${pid}">${verb} team</button>`);
}
/* Critical bug (D26): a simple picker that assigns the bug; Cancel or Escape returns focus to Assign… */
function openAssign(itemId, trigger) {
  const it = IN.find((i) => i.id === itemId); if (!it) return;
  const opts = memberIds();
  openDialog(trigger, `Assign ${it.task}`, "It leaves your Inbox once someone is assigned.", `<div style="margin-top:16px"><label for="assign-to" style="display:block;font-weight:500;margin-bottom:6px">Assign to</label><select class="field" id="assign-to" style="width:100%">${opts.map((k) => `<option value="${k}" ${k === "rowan" ? "selected" : ""}>${esc(M[k].name)} · ${esc(M[k].role)}</option>`).join("")}</select></div>`,
    cancelBtn + `<button class="btn primary" type="button" data-act="assign-save" data-id="${esc(itemId)}">Assign</button>`);
}
function closeSheet() { document.getElementById("overlay-root").innerHTML = ""; if (sheetReturn) sheetReturn.focus(); }
document.addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const sh = document.querySelector(".sheet"); if (!sh) return;
  const f = sh.querySelectorAll("button, a[href], input, select, textarea"); if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

if (!location.hash) history.replaceState(null, "", "#/home");
render(true);
</script>
</body>
</html>
