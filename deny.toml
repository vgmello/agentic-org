[graph]
targets = ["aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.93
private = { ignore = true }
allow = [
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
    "WTFPL",
    "blessing",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
