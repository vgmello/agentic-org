  .foot .acct { width: 48px; height: 48px; padding: 0; justify-content: center; gap: 0; border-radius: var(--radius-md); }
  .foot .acct .acct-txt, .foot .acct .acct-chev, .foot .office-full { display: none; }
  .foot a.office-link { width: 48px; height: 48px; padding: 0; justify-content: center; border-radius: var(--radius-md); }
  .foot .office-rail { display: inline-flex; color: var(--gray-400); }
  .foot a.office-link:hover .office-rail { color: #fff; }
  .menu.up { left: 4px; min-width: 220px; }
  .nav > ul { gap: 12px; }
  .nav-list { margin: 0; align-items: center; }
  .nav-item { position: relative; width: 48px; height: 48px; justify-content: center; padding: 0; }
  .nav-item .lbl { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .nav-item .badge { position: absolute; top: 2px; right: 0; }
}
@media (max-width: 639px) {
  :root { --gutter: 16px; }
  .sidebar { transform: translateX(-100%); transition: transform .15s; }
  body.drawer .sidebar { transform: none; }
  body.drawer .scrim { display: block; }
  .content { padding-left: 0; }
  .topbar { height: 52px; padding: 0 16px 0 60px; }
  .cmdk-shell { width: 100%; }
  .cmdk-trigger kbd { display: none; }
  .btn.menu-btn { display: inline-flex; }
  .search { display: none; }
  body.searching .search { display: grid; grid-template-columns: 1fr auto; position: absolute; inset: 0; width: 100%; height: 100%; max-width: none; border-radius: 0; z-index: 10; background: #091324; }
  body.searching .sres { left: 0; right: 0; min-width: 0; }
  body.searching .search > .ic20, body.searching .search input { grid-column: 1; }
  .search kbd { display: none; }
  body.searching .search .sclose { display: inline-flex; grid-column: 2; align-self: center; width: 44px; height: 44px; margin-right: 4px; }
  .new-lbl, .new-btn .new-chev { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .btn.new-btn { width: 44px; height: 44px; min-height: 44px; padding: 0; }
  .btn.new-btn .ic20 { margin-left: 0; }
  .tchip .rm { width: 44px; height: 44px; }
  .btn.xs { min-height: 44px; }
  .hide-sm { display: none; }
  .only-sm { display: block; } .only-wide { display: none; }
  .node { min-width: 0; }
  .tree ul { margin-left: 8px; padding-left: 12px; }
  .tree ul > li::before { left: -12px; width: 8px; }
  .btn, .btn.sm { height: auto; min-height: 44px; }
  .btn.icon { width: 44px; height: 44px; }
  .tab { min-height: 44px; padding: 10px 4px; }
  .seg { min-height: 44px; }
  .seg button, .seg.icons button { min-height: 38px; min-width: 44px; }
  .nav-item, .menu button, .back, .link, .chlist a, .sopt, .btn.textbtn { min-height: 44px; }
  input.field, select.field, textarea { min-height: 44px; font-size: 16px; }
  select.field { height: auto; }
  .c-chip-btn, .c-work-box summary { min-height: 44px; padding-top: 8px; padding-bottom: 8px; }
  .c-form { flex-direction: column; }
  .dl { grid-template-columns: 1fr; gap: 2px 0; } .dl dd { margin-bottom: 8px; }
  .proto-banner { padding: 8px var(--gutter); }
}
.scrim { display: none; position: fixed; inset: 0; z-index: 45; background: rgb(16 24 40 / .8); }
@media (prefers-reduced-motion: reduce) {
  .p-working::after, .skel-b, .skel-c, .c-dot, .c-caret-blink, .h4-live-dot::after, .h4-decision.win-burst { animation: none; }
  .sidebar, .h4-kpi, .h4-decision, .h4-proj, .h4-now-item, .h4-cta, .h4-cta-fill, .h4-cta-sheen, .h4-cta-ico, .h4-cta-lbl,
  .hb-pillar, .hb-card, .hb-spot, .hb-dot-btn, .hb-dot-btn::after, .hb-tseg, .cmdk-shell, .cmdk-opt { transition: none !important; }
}

/* ── v4 Home: Elevated Hierarchy, Relationship Grouping & Frosted Glass ── */
.h4, .hb {
  --h4-surface: rgba(13, 24, 42, .50);
  --h4-surface-hi: rgba(19, 34, 58, .62);
  --h4-well: rgba(8, 15, 28, .44);
  --h4-border: rgba(186, 222, 255, .10);
  --h4-border-hi: rgba(186, 222, 255, .19);
  --h4-glass-blur: blur(22px) saturate(160%);
  --h4-glass-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 0 0 1px var(--h4-border), 0 10px 30px -12px rgba(0, 0, 0, .52);
  --h4-glass-shadow-hi: inset 0 1px 0 rgba(255, 255, 255, .18), inset 0 0 0 1px var(--h4-border-hi), 0 16px 38px -12px rgba(0, 0, 0, .58);
  --h4-ink: #F8FAFC;
  --h4-body: #CBD5E1;
  --h4-muted: #94A3B8;
  --h4-dim: #74849B;
  --h4-accent: #6366F1;
  --h4-accent-soft: rgba(99, 102, 241, .14);
  --h4-amber: #FBBF24;
  --h4-emerald: #34D399;
  --h4-rose: #FB7185;
  padding: 24px var(--gutter) 56px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 26px;
}

/* Header + Compact Single-Row Pulse Strip */
.h4-hero { display: flex; flex-direction: column; gap: 14px; }
.h4-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.h4-head-left { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.h4-head h1 { font-size: 1.5rem; line-height: 1.2; font-weight: 600; letter-spacing: -.025em; color: var(--h4-ink); }
.h4-sub { font-size: 0.84375rem; line-height: 1.4; color: var(--h4-muted); }

/* Compact Frosted Overview Chips (Step 0: 2-second orientation) */
.h4-pulse-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.h4-stat-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 7px 13px; border-radius: 10px;
  background: var(--h4-surface);
  backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(186, 222, 255, .12), inset 0 0 0 1px var(--h4-border);
  font-size: 0.8125rem; line-height: 1.25rem; color: var(--h4-body);
  transition: background-color .15s ease, box-shadow .15s ease, transform .15s ease;
}
.h4-stat-chip:hover { background: var(--h4-surface-hi); box-shadow: inset 0 1px 0 rgba(186, 222, 255, .20), inset 0 0 0 1px var(--h4-border-hi); color: var(--h4-ink); transform: translateY(-1px); }
.h4-stat-chip.is-warn { background: linear-gradient(135deg, rgba(251, 191, 36, .12) 0%, rgba(13, 24, 42, .52) 68%); box-shadow: inset 0 1px 0 rgba(253, 230, 138, .22), inset 0 0 0 1px rgba(251, 191, 36, .30); }
.h4-stat-chip strong { color: var(--h4-ink); font-weight: 650; font-variant-numeric: tabular-nums; }
.h4-stat-chip .sep { color: var(--h4-dim); }
.h4-stat-chip .warn-txt { color: #FDE68A; font-weight: 500; }

/* Order-of-Operations Section Steps */
.h4-flow { display: flex; flex-direction: column; gap: 26px; }
.h4-step { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.h4-step-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.h4-step-title { display: inline-flex; align-items: center; gap: 10px; }
.h4-step-num {
  width: 22px; height: 22px; border-radius: 999px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(186, 222, 255, .10); box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .20);
  font-size: 0.72rem; font-weight: 700; color: var(--h4-body); font-variant-numeric: tabular-nums;
}
.h4-step-num.urgent { background: rgba(251, 191, 36, .16); box-shadow: inset 0 0 0 1px rgba(251, 191, 36, .38); color: #FDE68A; }
.h4-step-title h2 { font-size: 0.96875rem; line-height: 1.4rem; font-weight: 600; letter-spacing: -.01em; color: var(--h4-ink); }
.h4-step-hint { font-size: 0.78125rem; color: var(--h4-muted); }

/* Inline Context Accordion inside Step 1 Urgent Cards */
.h4-ctx-toggle {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 8px; margin-left: -8px; border-radius: 6px;
  font-size: 0.78125rem; font-weight: 500; color: var(--h4-muted);
  transition: color .14s ease, background-color .14s ease;
}
.h4-ctx-toggle:hover { color: var(--h4-ink); background: rgba(255, 255, 255, .06); }
.h4-ctx-toggle .h4-chev { transition: transform .18s ease; }
.h4-ctx-toggle[aria-expanded="true"] .h4-chev { transform: rotate(90deg); }
.h4-ctx-body {
  padding: 10px 12px; border-radius: 8px;
  background: var(--h4-well);
  box-shadow: inset 0 0 0 1px var(--h4-border);
  font-size: 0.8125rem; line-height: 1.55; color: var(--h4-body);
}

/* Step 2: Folded Accordion Rows for Non-Urgent Input */
.h4-acc-list { display: flex; flex-direction: column; gap: 8px; }
.h4-acc-item {
  position: relative; border-radius: 12px; overflow: hidden;
  background: var(--h4-surface);
  backdrop-filter: var(--h4-glass-blur); -webkit-backdrop-filter: var(--h4-glass-blur);
  box-shadow: var(--h4-glass-shadow);
  transition: background-color .15s ease, box-shadow .15s ease;
}
.h4-acc-item:hover { background: var(--h4-surface-hi); box-shadow: var(--h4-glass-shadow-hi); }
.h4-acc-item.done { opacity: .72; background: var(--h4-well); }
.h4-acc-trigger {
  width: 100%; display: flex; align-items: center; gap: 10px;
  padding: 12px 16px; text-align: left;
  transition: background-color .14s ease;
}
.h4-acc-trigger:focus-visible { outline: 2px solid var(--indigo-400); outline-offset: -2px; border-radius: 12px; }
.h4-acc-trigger .h4-chev { color: var(--h4-muted); flex: none; transition: transform .18s ease, color .14s ease; }
.h4-acc-trigger[aria-expanded="true"] .h4-chev { transform: rotate(90deg); color: var(--h4-ink); }
.h4-acc-title { font-size: 0.875rem; font-weight: 600; color: var(--h4-ink); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.h4-acc-meta { display: inline-flex; align-items: center; gap: 8px; flex: none; font-size: 0.75rem; color: var(--h4-muted); }
.h4-acc-body {
  padding: 0 16px 14px 42px;
  display: flex; flex-direction: column; gap: 12px;
  border-top: 1px solid rgba(186, 222, 255, .07);
  padding-top: 12px;
}

/* Step 3: Compact Project Card with Folded Details Accordion */
.h4-proj-acc-btn {
  width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 7px 10px; border-radius: 8px;
  background: var(--h4-well); box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .08);
  font-size: 0.75rem; font-weight: 500; color: var(--h4-muted);
  transition: color .14s ease, background-color .14s ease;
}
.h4-proj-acc-btn:hover { color: var(--h4-ink); background: rgba(186, 222, 255, .08); }
.h4-proj-acc-btn .h4-chev { transition: transform .18s ease; }
.h4-proj-acc-btn[aria-expanded="true"] .h4-chev { transform: rotate(90deg); }
.h4-proj-details { display: flex; flex-direction: column; gap: 10px; padding-top: 2px; }
.h4-proj-goal { font-size: 0.78125rem; line-height: 1.45; color: var(--h4-body); }

/* Step 1 Urgent Grid: 2-up side-by-side on wide screens, 1-col below 1180px */
.h4-urgent-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.h4-urgent-grid:has(> :only-child) { grid-template-columns: minmax(0, 1fr); }

/* Step 4: Collapsible Organization Pulse Accordions */
.h4-pulse-accs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
.h4-sec-acc {
  border-radius: 12px; overflow: hidden;
  background: var(--h4-surface);
  backdrop-filter: var(--h4-glass-blur); -webkit-backdrop-filter: var(--h4-glass-blur);
  box-shadow: var(--h4-glass-shadow);
}
.h4-sec-acc-bar {
  display: flex; align-items: center; gap: 10px;
  padding: 2px 14px 2px 4px;
}
.h4-sec-acc-btn {
  flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px;
  padding: 11px 12px; text-align: left; border-radius: 10px;
}
.h4-sec-acc-btn:hover { background: rgba(255, 255, 255, .04); }
.h4-sec-acc-btn:focus-visible { outline: 2px solid var(--indigo-400); outline-offset: -2px; }
.h4-sec-acc-btn .h4-chev { color: var(--h4-muted); flex: none; transition: transform .18s ease; }
.h4-sec-acc-btn[aria-expanded="true"] .h4-chev { transform: rotate(90deg); color: var(--h4-ink); }
.h4-sec-acc-label { display: inline-flex; align-items: center; gap: 8px; font-size: 0.875rem; font-weight: 600; color: var(--h4-ink); flex: none; }
.h4-sec-acc-preview { font-size: 0.8125rem; color: var(--h4-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }
.h4-sec-acc-body { padding: 12px 16px 14px; border-top: 1px solid var(--h4-border); }
.h4-office-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; border-radius: 999px;
  background: rgba(13, 24, 42, .48);
  backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(186, 222, 255, .12), inset 0 0 0 1px var(--h4-border);
  font-size: 0.75rem; line-height: 1rem; font-weight: 500; color: var(--h4-body);
}
.h4-office-chip:hover { background: var(--h4-surface-hi); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .16), inset 0 0 0 1px var(--h4-border-hi); color: var(--h4-ink); }
.h4-live-dot { position: relative; display: inline-block; width: 8px; height: 8px; border-radius: 999px; background: #34D399; flex: none; }
.h4-live-dot::after { content: ""; position: absolute; inset: -3px; border-radius: 999px; border: 1.5px solid rgba(52, 211, 153, .55); animation: h4-pulse 2.2s ease-out infinite; }
@keyframes h4-pulse { 0% { transform: scale(.8); opacity: .9; } 70%, 100% { transform: scale(1.9); opacity: 0; } }

/* 3-up KPI Pulse Strip */
.h4-kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.h4-kpi {
  position: relative; display: flex; flex-direction: column; gap: 8px;
  padding: 16px 18px; border-radius: 14px;
  background: var(--h4-surface);
  backdrop-filter: var(--h4-glass-blur); -webkit-backdrop-filter: var(--h4-glass-blur);
  box-shadow: var(--h4-glass-shadow);
  transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease;
}
.h4-kpi:hover { background: var(--h4-surface-hi); box-shadow: var(--h4-glass-shadow-hi); transform: translateY(-1px); }
.h4-kpi.is-warn { background: linear-gradient(135deg, rgba(251, 191, 36, .11) 0%, rgba(13, 24, 42, .52) 60%); box-shadow: inset 0 1px 0 rgba(253, 230, 138, .22), inset 0 0 0 1px rgba(251, 191, 36, .28), 0 10px 30px -12px rgba(0, 0, 0, .52); }
.h4-kpi.is-warn:hover { background: linear-gradient(135deg, rgba(251, 191, 36, .15) 0%, rgba(19, 34, 58, .62) 60%); box-shadow: inset 0 1px 0 rgba(253, 230, 138, .3), inset 0 0 0 1px rgba(251, 191, 36, .44), 0 16px 38px -12px rgba(0, 0, 0, .58); }
.h4-kpi-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 0.75rem; line-height: 1rem; font-weight: 600; color: var(--h4-muted); letter-spacing: .01em; }
.h4-kpi-val { display: flex; align-items: baseline; gap: 10px; }
.h4-kpi-num { font-size: 1.75rem; line-height: 1.1; font-weight: 650; letter-spacing: -.03em; color: var(--h4-ink); font-variant-numeric: tabular-nums; }
.h4-kpi-tag { font-size: 0.75rem; line-height: 1rem; font-weight: 500; color: var(--h4-amber); }
.h4-kpi-foot { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; font-size: 0.75rem; line-height: 1.125rem; color: var(--h4-muted); }
.h4-dot-lbl { display: inline-flex; align-items: center; gap: 5px; }
.h4-dot { width: 6px; height: 6px; border-radius: 999px; flex: none; }
.h4-dot.ok { background: var(--h4-emerald); }
.h4-dot.warn { background: var(--h4-amber); }
.h4-dot.bad { background: var(--h4-rose); }

/* Primary 2-Column Workspace Layout */
.h4-grid { display: grid; grid-template-columns: minmax(0, 1.85fr) minmax(310px, 1fr); gap: 28px; align-items: start; }
.h4-main { display: flex; flex-direction: column; gap: 32px; min-width: 0; }
.h4-rail { display: flex; flex-direction: column; gap: 20px; min-width: 0; position: sticky; top: 84px; }

/* Section Headers */
.h4-sec { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.h4-sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.h4-sec-title { display: inline-flex; align-items: center; gap: 8px; }
.h4-sec-title h2 { font-size: 1rem; line-height: 1.5rem; font-weight: 600; letter-spacing: -.01em; color: var(--h4-ink); }
.h4-count { display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 20px; padding: 0 7px; border-radius: 999px; background: rgba(148, 163, 184, .14); font-size: 0.75rem; font-weight: 600; color: var(--h4-body); font-variant-numeric: tabular-nums; }
.h4-count.warn { background: rgba(251, 191, 36, .16); color: #FDE68A; box-shadow: inset 0 0 0 1px rgba(251, 191, 36, .28); }

/* Grouped Decision Queue */
.h4-groups { display: flex; flex-direction: column; gap: 20px; }
.h4-group { display: flex; flex-direction: column; gap: 10px; }
.h4-group-h { display: flex; align-items: center; gap: 8px; font-size: 0.6875rem; line-height: 1rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--h4-muted); padding-left: 2px; }
.h4-group-h.urgent { color: #FCD34D; }
.h4-group-rule { flex: 1; height: 1px; background: var(--h4-border); }
.h4-stack { display: flex; flex-direction: column; gap: 10px; }

/* Elevated Decision Card */
.h4-decision {
  position: relative; display: flex; flex-direction: column; gap: 12px;
  padding: 16px 18px 14px 20px; border-radius: 14px;
  background: var(--h4-surface);
  backdrop-filter: var(--h4-glass-blur); -webkit-backdrop-filter: var(--h4-glass-blur);
  box-shadow: var(--h4-glass-shadow);
  transition: box-shadow .16s ease, background-color .16s ease;
  overflow: hidden;
}
.h4-decision::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: rgba(129, 140, 248, .65);
}
.h4-decision.urgent::before { background: linear-gradient(180deg, #FBBF24 0%, #F59E0B 100%); }
.h4-decision.done { opacity: .72; background: var(--h4-well); }
.h4-decision.done::before { background: rgba(52, 211, 153, .65); }
.h4-decision:hover:not(.done) { background: var(--h4-surface-hi); box-shadow: var(--h4-glass-shadow-hi); }

.h4-d-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.h4-d-who { display: inline-flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; font-size: 0.8125rem; line-height: 1.25rem; }
.h4-d-who .who-name { font-weight: 600; color: var(--h4-ink); }
.h4-kind-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 8px; border-radius: 5px;
  background: rgba(148, 163, 184, .11);
  font-size: 0.75rem; line-height: 1.125rem; font-weight: 500; color: var(--h4-body);
}
.h4-d-time { font-size: 0.75rem; color: var(--h4-dim); }
.h4-exp-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  background: rgba(251, 191, 36, .13);
  box-shadow: inset 0 0 0 1px rgba(251, 191, 36, .34);
  font-size: 0.75rem; line-height: 1rem; font-weight: 600; color: #FDE68A;
}

.h4-d-body { display: flex; flex-direction: column; gap: 6px; }
.h4-d-body h3 { font-size: 0.96875rem; line-height: 1.38; font-weight: 600; letter-spacing: -.012em; color: var(--h4-ink); }
.h4-d-why { font-size: 0.84375rem; line-height: 1.55; color: var(--h4-body); max-width: 68ch; }

/* Recommendation Inset Callout */
.h4-rec {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 12px; border-radius: 0 6px 6px 0;
  background: rgba(99, 102, 241, .065);
  box-shadow: inset 2px 0 0 rgba(129, 140, 248, .75);
  font-size: 0.8125rem; line-height: 1.45; color: #CBD5E1;
}
.h4-rec .ic { color: var(--indigo-300); margin-top: 2px; }

/* Card Footer: Origin Left, Prioritized Actions Right */
.h4-d-foot {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding-top: 12px; border-top: 1px solid var(--h4-border);
}
.h4-origin { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.75rem; line-height: 1.125rem; color: var(--h4-muted); }
.h4-origin a { color: var(--h4-body); font-weight: 500; }
.h4-origin a:hover { color: var(--h4-ink); text-decoration: underline; }
.h4-task-chip { padding: 1px 6px; border-radius: 4px; background: rgba(148, 163, 184, .11); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.72rem; color: var(--h4-body); }
.h4-d-foot .actions { margin-top: 0; gap: 8px; align-items: center; }
.h4-d-foot .btn.primary { background: #4F46E5; box-shadow: inset 0 1px 0 rgba(255,255,255,.18), 0 1px 2px rgba(0,0,0,.3); }
.h4-d-foot .btn.primary:hover { background: #5B57F5; }
.h4-d-foot .btn.outline { background: rgba(255,255,255,.03); box-shadow: inset 0 0 0 1px rgba(148, 163, 184, .28); }
.h4-d-foot .btn.outline:hover { background: rgba(255,255,255,.08); box-shadow: inset 0 0 0 1px rgba(148, 163, 184, .45); }
.h4-d-foot .btn.ghost { color: var(--h4-muted); padding: 0 8px; }
.h4-d-foot .btn.ghost:hover { color: var(--h4-ink); background: rgba(255,255,255,.06); }
.h4-d-foot .reply { flex: 1 1 100%; }

/* Delight CTA: Liquid win-fill sweep + glass sheen + kinetic rolling text */
.h4-cta,
.btn.primary.h4-cta {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  padding: 0 14px;
  background: linear-gradient(135deg, #0369A1 0%, #0284C7 100%);
  color: #FFFFFF;
  box-shadow: inset 0 1px 0 rgba(224, 242, 254, .28), inset 0 0 0 1px rgba(125, 211, 252, .32), 0 2px 6px rgba(0, 0, 0, .34);
  transition: transform .2s cubic-bezier(.22, 1, .36, 1), box-shadow .24s ease;
}
.h4-cta-fill {
  position: absolute; inset: 0; z-index: 0; pointer-events: none;
  background: linear-gradient(135deg, #047857 0%, #05875E 55%, #0F766E 100%);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform .32s cubic-bezier(.22, 1, .36, 1);
}
.h4-cta[data-cta-tone="reply"] .h4-cta-fill {
  background: linear-gradient(135deg, #075985 0%, #0284C7 55%, #0EA5E9 100%);
}
.h4-cta[data-cta-tone="ocean"] .h4-cta-fill {
  background: linear-gradient(135deg, #0369A1 0%, #0284C7 55%, #0EA5E9 100%);
}
.h4-cta.hb-cta-glass {
  height: 36px; padding: 0 15px; border-radius: 10px;
  background: rgba(56, 189, 248, .13);
  backdrop-filter: blur(12px) saturate(145%); -webkit-backdrop-filter: blur(12px) saturate(145%);
  box-shadow: inset 0 1px 0 rgba(186, 230, 253, .22), inset 0 0 0 1px rgba(125, 211, 252, .30), 0 8px 22px -10px rgba(0, 0, 0, .50);
  color: #E0F2FE; font-size: 0.8125rem; font-weight: 600;
}
.h4-cta.hb-cta-glass .h4-cta-lbl .ic { color: #7DD3FC; transition: color .18s ease; }
.h4-cta.hb-cta-glass:hover,
.h4-cta.hb-cta-glass:focus-visible {
  color: #FFFFFF;
  box-shadow: inset 0 1px 0 rgba(224, 242, 254, .34), inset 0 0 0 1px rgba(125, 211, 252, .58), 0 10px 26px -6px rgba(14, 165, 233, .46);
}
.h4-cta.hb-cta-glass:hover .h4-cta-lbl .ic,
.h4-cta.hb-cta-glass:focus-visible .h4-cta-lbl .ic { color: #FFFFFF; }
.h4-cta-sheen {
  position: absolute; top: -20%; bottom: -20%; left: 0; width: 42%; z-index: 1; pointer-events: none;
  background: linear-gradient(90deg, transparent 0%, rgba(255, 255, 255, .28) 50%, transparent 100%);
  transform: translateX(-160%) skewX(-22deg);
  transition: transform 0s;
}
.h4-cta-inner {
  position: relative; z-index: 2;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  line-height: 1.25rem;
  height: 1.25rem;
}
.h4-cta-ico {
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform .28s cubic-bezier(.34, 1.56, .64, 1);
}
.h4-cta-lbl {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  white-space: nowrap;
}

.h4-cta:hover,
.h4-cta:focus-visible,
.btn.primary.h4-cta:hover,
.btn.primary.h4-cta:focus-visible {
  background: linear-gradient(135deg, #0369A1 0%, #0284C7 100%);
  transform: translateY(-1.5px);
  box-shadow: inset 0 1px 0 rgba(167, 243, 208, .42), 0 8px 22px -5px rgba(16, 185, 129, .55);
}
.h4-cta[data-cta-tone="reply"]:hover,
.h4-cta[data-cta-tone="reply"]:focus-visible {
  box-shadow: inset 0 1px 0 rgba(224, 242, 254, .42), 0 8px 22px -5px rgba(14, 165, 233, .52);
}
.h4-cta.hb-cta-glass:hover,
.h4-cta.hb-cta-glass:focus-visible {
  background: rgba(56, 189, 248, .13);
  color: #FFFFFF;
  box-shadow: inset 0 1px 0 rgba(224, 242, 254, .34), inset 0 0 0 1px rgba(125, 211, 252, .58), 0 10px 26px -6px rgba(14, 165, 233, .46);
}
.h4-cta:hover .h4-cta-fill,
.h4-cta:focus-visible .h4-cta-fill {
  transform: scaleX(1);
}
.h4-cta:hover .h4-cta-sheen {
  transform: translateX(340%) skewX(-22deg);
  transition: transform .62s cubic-bezier(.22, 1, .36, 1) .06s;
}
.h4-cta:hover .h4-cta-ico,
.h4-cta:focus-visible .h4-cta-ico {
  transform: scale(1.16) rotate(-5deg);
}
.h4-cta:active {
  transform: translateY(0) scale(.98);
  transition-duration: .08s;
}

/* Satisfying completion win burst on handled card */
.h4-handled-win {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(16, 185, 129, .14);
  box-shadow: inset 0 0 0 1px rgba(52, 211, 153, .36);
  font-size: 0.78125rem; font-weight: 600; color: #6EE7B7;
}
@keyframes h4-win-glow {
  0% { box-shadow: inset 0 0 0 1px rgba(52, 211, 153, .75), 0 0 0 0 rgba(16, 185, 129, .45); }
  55% { box-shadow: inset 0 0 0 1px rgba(52, 211, 153, .45), 0 0 0 8px rgba(16, 185, 129, 0); }
  100% { box-shadow: inset 0 1px 0 rgba(255, 255, 255, .045), inset 0 0 0 1px var(--h4-border), 0 1px 3px rgba(0, 0, 0, .24); }
}
.h4-decision.win-burst { animation: h4-win-glow .75s cubic-bezier(.22, 1, .36, 1) both; }

.h4-more-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 16px; border-radius: 12px;
  background: var(--h4-well);
  backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .08), inset 0 0 0 1px var(--h4-border);
  font-size: 0.8125rem; font-weight: 500; color: var(--h4-body);
  transition: background-color .15s ease, box-shadow .15s ease;
}
.h4-more-bar:hover { background: var(--h4-surface-hi); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .14), inset 0 0 0 1px var(--h4-border-hi); color: var(--h4-ink); }

/* Projects Portfolio Grid */
.h4-projs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
.h4-proj {
  position: relative; display: flex; flex-direction: column; gap: 14px;
  padding: 16px; border-radius: 14px;
  background: var(--h4-surface);
  backdrop-filter: var(--h4-glass-blur); -webkit-backdrop-filter: var(--h4-glass-blur);
  box-shadow: var(--h4-glass-shadow);
  transition: transform .16s ease, box-shadow .16s ease, background-color .16s ease;
}
.h4-proj:hover { background: var(--h4-surface-hi); box-shadow: var(--h4-glass-shadow-hi); transform: translateY(-1px); }
.h4-proj-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.h4-proj-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.h4-proj-mark {
  width: 28px; height: 28px; border-radius: 7px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(99, 102, 241, .14); box-shadow: inset 0 0 0 1px rgba(129, 140, 248, .28);
  font-size: 0.75rem; font-weight: 700; color: var(--indigo-300);
}
.h4-proj-name { font-size: 0.90625rem; line-height: 1.3; font-weight: 600; color: var(--h4-ink); }
.h4-proj-prog { display: flex; flex-direction: column; gap: 6px; }
.h4-proj-prog-hd { display: flex; align-items: baseline; justify-content: space-between; font-size: 0.75rem; line-height: 1rem; color: var(--h4-muted); font-variant-numeric: tabular-nums; }
.h4-proj-prog-hd strong { color: var(--h4-ink); font-weight: 600; }
.h4-bar { height: 6px; border-radius: 999px; background: rgba(148, 163, 184, .14); overflow: hidden; }
.h4-bar > span { display: block; height: 100%; border-radius: 999px; background: var(--indigo-400); }
.h4-bar.ok > span { background: #34D399; }
.h4-bar.warn > span { background: #FBBF24; }
.h4-bar.bad > span { background: #FB7185; }
.h4-proj-stats { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 0.75rem; line-height: 1.125rem; color: var(--h4-muted); font-variant-numeric: tabular-nums; }
.h4-proj-stats b { color: var(--h4-ink); font-weight: 600; }
.h4-proj-stats .is-blocked { color: #FDA4AF; }
.h4-proj-stats .is-blocked b { color: #FDA4AF; }
.h4-proj-foot {
  margin-top: auto; padding-top: 12px; border-top: 1px solid var(--h4-border);
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  font-size: 0.75rem; color: var(--h4-muted);
}

/* Right Rail: Live Org Pulse Panels */
.h4-panel {
  display: flex; flex-direction: column;
  border-radius: 14px;
  background: var(--h4-surface);
  backdrop-filter: var(--h4-glass-blur); -webkit-backdrop-filter: var(--h4-glass-blur);
  box-shadow: var(--h4-glass-shadow);
  overflow: hidden;
}
.h4-panel-h {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 16px; border-bottom: 1px solid var(--h4-border);
  background: rgba(255, 255, 255, .025);
}
.h4-panel-h h2 { display: inline-flex; align-items: center; gap: 8px; font-size: 0.875rem; line-height: 1.25rem; font-weight: 600; color: var(--h4-ink); }
.h4-panel-body { padding: 12px 16px 14px; }

/* Happening Now List inside Rail */
.h4-now-list { display: flex; flex-direction: column; gap: 8px; }
.h4-now-item {
  position: relative; display: flex; align-items: center; gap: 12px;
  padding: 10px 12px; border-radius: 10px;
  background: var(--h4-well);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06), inset 0 0 0 1px var(--h4-border);
  transition: background-color .15s ease, box-shadow .15s ease;
}
.h4-now-item:hover { background: var(--h4-surface-hi); box-shadow: inset 0 1px 0 rgba(255, 255, 255, .12), inset 0 0 0 1px var(--h4-border-hi); }
.h4-now-meta { min-width: 0; flex: 1; }
.h4-now-top { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.h4-now-name { font-weight: 600; font-size: 0.875rem; color: var(--h4-ink); }
.h4-now-role { font-size: 0.75rem; color: var(--h4-muted); }
.h4-now-status { margin-top: 2px; font-size: 0.75rem; line-height: 1.125rem; color: #A5B4FC; }

/* Timeline Activity Feed inside Rail */
.h4-timeline { display: flex; flex-direction: column; }
.h4-tl-item { position: relative; display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 10px; padding: 10px 0; }
.h4-tl-item:first-child { padding-top: 2px; }
.h4-tl-item:last-child { padding-bottom: 2px; }
.h4-tl-item:not(:last-child)::before {
  content: ""; position: absolute; left: 11.5px; top: 38px; bottom: -6px; width: 1px;
  background: rgba(148, 163, 184, .16);
}
.h4-tl-av { position: relative; z-index: 1; padding-top: 1px; }
.h4-tl-main { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.h4-tl-hd { display: flex; align-items: center; gap: 6px; font-size: 0.8125rem; line-height: 1.25rem; }
.h4-tl-hd .actor { font-weight: 600; color: var(--h4-ink); }
.h4-tl-kind { display: inline-flex; align-items: center; gap: 4px; padding: 1px 6px; border-radius: 4px; background: rgba(148, 163, 184, .1); font-size: 0.6875rem; font-weight: 500; color: var(--h4-muted); }
.h4-tl-hd time { margin-left: auto; font-size: 0.75rem; color: var(--h4-dim); white-space: nowrap; }
.h4-tl-tx { font-size: 0.8125rem; line-height: 1.45; color: var(--h4-body); }
.h4-tl-tx a { color: var(--h4-muted); font-weight: 500; }
.h4-tl-tx a:hover { color: var(--h4-ink); text-decoration: underline; }
.h4-tl-sum { font-size: 0.75rem; line-height: 1.35; color: var(--h4-dim); }
.h4-tl-main .runbtn { padding-left: 0; margin-top: 2px; }
.h4-tl-main .runlog { margin: 4px 0 2px; }

.h4-empty-box {
  padding: 28px 20px; border-radius: 14px; text-align: center;
  background: var(--h4-surface);
  backdrop-filter: var(--h4-glass-blur); -webkit-backdrop-filter: var(--h4-glass-blur);
  box-shadow: var(--h4-glass-shadow);
}
.h4-empty-box .ic48 { color: var(--h4-muted); }
.h4-empty-box h3 { margin-top: 8px; font-size: 0.9375rem; font-weight: 600; color: var(--h4-ink); }
.h4-empty-box p { margin: 4px auto 0; max-width: 380px; font-size: 0.8125rem; color: var(--h4-muted); }
.h4-empty-box .btn { margin-top: 14px; }
.h4-rail-empty { font-size: 0.8125rem; color: var(--h4-muted); padding: 4px 0; }
.h4-callout { margin: 0; background: rgba(251, 191, 36, .09); backdrop-filter: blur(18px) saturate(150%); -webkit-backdrop-filter: blur(18px) saturate(150%); box-shadow: inset 0 1px 0 rgba(253, 230, 138, .18), inset 0 0 0 1px rgba(251, 191, 36, .3); }

/* Frosted glass elevation for shared layered surfaces across the app */
.card, .bcard, .c-entry, .k-doc {
  background: rgba(13, 24, 42, .48);
  backdrop-filter: blur(18px) saturate(150%);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(186, 222, 255, .10), inset 0 0 0 1px rgba(186, 222, 255, .09);
}
.agent-rail, .chlist, .prof, .subnav, .split .list {
  background: rgba(9, 17, 30, .42);
  backdrop-filter: blur(18px) saturate(145%);
  -webkit-backdrop-filter: blur(18px) saturate(145%);
}
select.field, input.field, textarea {
  background: rgba(14, 22, 41, .52);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .07), inset 0 0 0 1px rgba(255, 255, 255, .16);
}
select.field option { background: #0E1629; color: #F8FAFC; }

/* ── v4 Executive Briefing + Spotlight Queue Home ─────────────────────── */
.hb {
  --hb-surface: rgba(10, 19, 35, .28);
  --hb-surface-hi: rgba(15, 28, 50, .38);
  --hb-well: rgba(7, 14, 26, .24);
  --hb-border: rgba(186, 222, 255, .11);
  --hb-border-hi: rgba(186, 222, 255, .22);
  --hb-blur: blur(0.9px) saturate(145%);
  --hb-shadow: inset 0 1px 0 rgba(186, 222, 255, .12), inset 0 0 0 1px var(--hb-border), 0 14px 36px -14px rgba(0, 0, 0, .55);
  --hb-shadow-hi: inset 0 1px 0 rgba(186, 222, 255, .19), inset 0 0 0 1px var(--hb-border-hi), 0 18px 42px -14px rgba(0, 0, 0, .62);
  --hb-ink: #F8FAFC;
  --hb-body: #D6E1EE;
  --hb-muted: #A3B5CC;
  --hb-dim: #8599B2;
  --hb-emerald: #34D399;
  --hb-amber: #FBBF24;
  --hb-rose: #FB7185;
  padding: 18px var(--gutter) 48px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 26px;
}

/* Zone 1: Calm Executive Briefing Header */
.hb-hero { display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
.hb-brief { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.hb-eyebrow {
  display: inline-flex; align-items: center; flex-wrap: wrap; gap: 8px;
  font-size: 0.72rem; line-height: 1rem; font-weight: 650;
  letter-spacing: .07em; text-transform: uppercase; color: #7C91AE;
}
.hb-eyebrow-meta { display: inline-flex; align-items: center; gap: 8px; font-weight: 500; letter-spacing: .03em; text-transform: none; color: #74849B; }
.hb-eyebrow-meta a { color: #8BA1BE; transition: color .14s ease; }
.hb-eyebrow-meta a:hover { color: #E2E8F0; }
.hb-eyebrow-meta .warn-dot { color: #FDA4AF; }
.hb-title {
  font-size: clamp(1.375rem, 2.2vw, 1.875rem);
  line-height: 1.22; font-weight: 600; letter-spacing: -.03em; color: var(--hb-ink);
}
.hb-title em { font-style: normal; color: #FDE68A; }
.hb-title em.calm { color: #7DD3FC; }
.hb-title em.ok { color: #6EE7B7; }
.hb-pills { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.hb-pill-link {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 6px 12px; border-radius: 999px;
  background: rgba(13, 24, 42, .44);
  backdrop-filter: blur(16px) saturate(150%); -webkit-backdrop-filter: blur(16px) saturate(150%);
  box-shadow: inset 0 1px 0 rgba(186, 222, 255, .10), inset 0 0 0 1px var(--hb-border);
  font-size: 0.78125rem; font-weight: 500; color: var(--hb-body);
  transition: background-color .15s ease, box-shadow .15s ease, color .15s ease;
}
.hb-pill-link:hover { background: var(--hb-surface-hi); box-shadow: inset 0 1px 0 rgba(186, 222, 255, .18), inset 0 0 0 1px var(--hb-border-hi); color: var(--hb-ink); }
.hb-pill-link b { color: var(--hb-ink); font-weight: 650; font-variant-numeric: tabular-nums; }

/* Zone 1b: 3 Executive CEO Pillar Scorecards (Financials · Team · Projects) */
.hb-pillars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.hb-pillar {
  position: relative; display: flex; flex-direction: column; gap: 13px;
  padding: 16px 18px 14px; border-radius: 16px;
  background: var(--hb-surface);
  backdrop-filter: var(--hb-blur); -webkit-backdrop-filter: var(--hb-blur);
  box-shadow: var(--hb-shadow);
  transition: background-color .16s ease, box-shadow .16s ease;
}
.hb-pillar:hover { background: var(--hb-surface-hi); box-shadow: var(--hb-shadow-hi); }
.hb-pillar-hd {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.hb-pillar-name {
  display: inline-flex; align-items: center; gap: 7px;
  font-size: 0.7rem; line-height: 1rem; font-weight: 650;
  letter-spacing: .11em; text-transform: uppercase; color: #C5D8EC;
}
.hb-pillar-name:hover { color: var(--hb-ink); }
.hb-pillar-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: 999px;
  font-size: 0.7rem; line-height: 1.15; font-weight: 600;
  background: rgba(186, 222, 255, .07); color: var(--hb-muted);
  box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .14);
  white-space: nowrap;
  transition: filter .14s ease, transform .14s ease, box-shadow .14s ease;
}
a.hb-pillar-pill:hover { filter: brightness(1.14); transform: translateY(-0.5px); }
.hb-pillar-pill.warn { background: rgba(251, 191, 36, .12); color: #FDE68A; box-shadow: inset 0 0 0 1px rgba(251, 191, 36, .28); }
.hb-pillar-pill.bad { background: rgba(251, 113, 133, .12); color: #FDA4AF; box-shadow: inset 0 0 0 1px rgba(251, 113, 133, .28); }
.hb-pillar-pill.ok { background: rgba(52, 211, 153, .12); color: #6EE7B7; box-shadow: inset 0 0 0 1px rgba(52, 211, 153, .28); }
.hb-pillar-pill.sky { background: rgba(56, 189, 248, .13); color: #BAE6FD; box-shadow: inset 0 0 0 1px rgba(125, 211, 252, .30); }

.hb-pillar-hero { display: flex; flex-direction: column; gap: 7px; border-radius: 10px; padding: 4px 6px; margin: -4px -6px; transition: background-color .14s ease; }
a.hb-pillar-hero:hover { background: rgba(186, 222, 255, .05); }
.hb-pillar-valrow { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.hb-pillar-primary { display: inline-flex; align-items: baseline; gap: 7px; min-width: 0; }
.hb-pillar-num {
  font-size: 1.625rem; line-height: 1.1; font-weight: 650;
  letter-spacing: -.03em; color: var(--hb-ink); font-variant-numeric: tabular-nums;
}
.hb-pillar-unit { font-size: 0.8125rem; font-weight: 500; color: var(--hb-muted); white-space: nowrap; }
.hb-pillar-right { font-size: 0.75rem; font-weight: 600; color: var(--hb-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.hb-pillar-right.ok { color: #6EE7B7; }
.hb-pillar-right.warn { color: #FDE68A; }

.hb-pillar-bar {
  display: flex; align-items: stretch; gap: 2px;
  height: 5px; border-radius: 999px; overflow: hidden;
  background: rgba(186, 222, 255, .12);
}
.hb-pillar-bar > span { display: block; height: 100%; border-radius: 999px; }
.hb-pillar-bar .seg-spend { background: linear-gradient(90deg, #38BDF8 0%, #FBBF24 100%); }
.hb-pillar-bar .seg-auto { background: linear-gradient(90deg, #38BDF8 0%, #7DD3FC 100%); }
.hb-pillar-bar .seg-human { background: rgba(251, 191, 36, .75); }
.hb-pillar-bar .seg-pass { background: linear-gradient(90deg, #10B981 0%, #34D399 100%); }
.hb-pillar-bar .seg-rework { background: rgba(148, 163, 184, .32); }

.hb-pillar-sub {
  display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;
  padding-top: 11px; border-top: 1px solid rgba(186, 222, 255, .09);
}
.hb-pillar-sub.is-team { grid-template-columns: minmax(0, 1.24fr) minmax(0, 1fr); gap: 10px; }
.hb-sub-item {
  display: flex; flex-direction: column; gap: 2px; min-width: 0;
  border-radius: 8px; padding: 2px 4px; margin: -2px -4px;
  transition: background-color .14s ease;
}
a.hb-sub-item:hover { background: rgba(186, 222, 255, .06); }
.hb-sub-lbl { font-size: 0.71875rem; font-weight: 500; color: var(--hb-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-sub-val {
  display: inline-flex; align-items: baseline; gap: 6px;
  font-size: 0.9375rem; line-height: 1.25; font-weight: 650; color: var(--hb-ink);
  font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.hb-sub-val.is-offices { gap: 5px; font-size: 0.875rem; }
.hb-sub-ok { color: #6EE7B7; }
.hb-sub-bad { color: #FDA4AF; }
.hb-sub-sep { color: var(--hb-dim); font-weight: 500; }
.hb-sub-meta { font-size: 0.71875rem; font-weight: 600; color: var(--hb-muted); }
.hb-sub-meta.ok { color: #6EE7B7; }
.hb-sub-meta.warn { color: #FDE68A; }
.hb-sub-meta.bad { color: #FDA4AF; }

/* Zone 2: Balanced 2-Column Hero Stage (Spotlight + Autonomous Catch-up & AI Ask) */
.hb-stage { display: grid; grid-template-columns: minmax(0, 1.42fr) minmax(350px, 1fr); gap: 20px; align-items: stretch; }
.hb-stage.is-single { grid-template-columns: 1fr; }

/* Left: Focused Decision Spotlight Card */
.hb-spot {
  position: relative; display: flex; flex-direction: column; gap: 15px;
  padding: 22px 24px 20px; border-radius: 18px;
  background: var(--hb-surface);
  backdrop-filter: var(--hb-blur); -webkit-backdrop-filter: var(--hb-blur);
  box-shadow: var(--hb-shadow);
  min-height: 280px;
  overflow: hidden;
  transition: box-shadow .28s ease;
}
.hb-spot.is-centered { max-width: 640px; width: 100%; margin: 12px auto 0; }
.hb-spot.is-empty-hero { min-height: 248px; }
.hb-spot.is-pulse { box-shadow: inset 0 1px 0 rgba(186, 222, 255, .28), inset 0 0 0 1.5px rgba(56, 189, 248, .55), 0 18px 46px -12px rgba(14, 165, 233, .36); }
.hb-spot::before {
  content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px;
  background: linear-gradient(90deg, rgba(125, 211, 252, .7) 0%, rgba(56, 189, 248, .25) 55%, transparent 100%);
}
.hb-spot.is-urgent::before {
  background: linear-gradient(90deg, #FBBF24 0%, rgba(251, 191, 36, .35) 55%, transparent 100%);
}
.hb-spot.is-done::before {
  background: linear-gradient(90deg, #34D399 0%, rgba(52, 211, 153, .3) 55%, transparent 100%);
}
.hb-spot.is-error::before {
  background: linear-gradient(90deg, #FB7185 0%, rgba(251, 113, 133, .28) 55%, transparent 100%);
}
.hb-spot-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hb-spot-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: 999px;
  background: rgba(56, 189, 248, .12);
  box-shadow: inset 0 0 0 1px rgba(125, 211, 252, .26);
  font-size: 0.75rem; line-height: 1rem; font-weight: 600; color: #BAE6FD;
}
.hb-spot-badge.urgent {
  background: rgba(251, 191, 36, .14);
  box-shadow: inset 0 0 0 1px rgba(251, 191, 36, .36);
  color: #FDE68A;
}
.hb-spot-nav { display: inline-flex; align-items: center; gap: 10px; }
.hb-dots { display: inline-flex; align-items: center; gap: 0; }
.hb-dot-btn {
  width: 24px; height: 24px; padding: 0; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  background: transparent;
  transition: width .2s cubic-bezier(.22, 1, .36, 1);
}
.hb-dot-btn::after {
  content: ""; display: block; width: 8px; height: 8px; border-radius: 999px;
  background: rgba(186, 222, 255, .24);
  transition: width .2s cubic-bezier(.22, 1, .36, 1), background-color .16s ease;
}
.hb-dot-btn:hover::after { background: rgba(186, 222, 255, .52); }
.hb-dot-btn.is-urgent:not(.is-cleared)::after { background: rgba(251, 191, 36, .68); }
.hb-dot-btn.is-cur { width: 32px; }
.hb-dot-btn.is-cur::after { width: 22px; background: #7DD3FC; }
.hb-dot-btn.is-cur.is-urgent::after { background: #FBBF24; }
.hb-dot-btn.is-cleared::after { background: rgba(52, 211, 153, .70); }
.hb-step-ctr { font-size: 0.75rem; font-weight: 600; color: var(--hb-muted); font-variant-numeric: tabular-nums; }
.hb-nav-arrows { display: inline-flex; align-items: center; gap: 4px; }
.hb-arrow-btn {
  width: 28px; height: 28px; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(186, 222, 255, .06);
  box-shadow: inset 0 0 0 1px var(--hb-border);
  color: var(--hb-body);
  transition: background-color .14s ease, color .14s ease, box-shadow .14s ease;
}
.hb-arrow-btn:hover:not(:disabled) { background: rgba(186, 222, 255, .14); box-shadow: inset 0 0 0 1px var(--hb-border-hi); color: var(--hb-ink); }
.hb-arrow-btn:disabled { opacity: .35; cursor: not-allowed; }

.hb-spot-main { display: flex; flex-direction: column; gap: 14px; flex: 1; }
.hb-spot-who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 0.8125rem; color: var(--hb-muted); }
.hb-spot-who .who { font-weight: 600; color: var(--hb-ink); }
.hb-spot-who a:hover { color: var(--hb-ink); text-decoration: underline; }
.hb-spot-title {
  font-size: clamp(1.125rem, 1.6vw, 1.375rem);
  line-height: 1.3; font-weight: 600; letter-spacing: -.02em; color: var(--hb-ink);
  max-width: 48ch;
}
.hb-spot-rec {
  display: flex; align-items: flex-start; gap: 9px;
  padding: 10px 14px; border-radius: 10px;
  background: rgba(56, 189, 248, .08);
  box-shadow: inset 0 0 0 1px rgba(125, 211, 252, .16), inset 3px 0 0 rgba(125, 211, 252, .7);
  font-size: 0.875rem; line-height: 1.5; color: #E2E8F0;
}
.hb-spot-rec .ic { color: #7DD3FC; margin-top: 2px; flex: none; }
.hb-spot-meta {
  display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
  padding: 11px 4px; border-radius: 12px;
  background: rgba(8, 18, 34, .34);
  box-shadow: inset 0 1px 0 rgba(186, 222, 255, .09), inset 0 0 0 1px rgba(186, 222, 255, .10);
}
.hb-spot-cell {
  display: flex; align-items: center; gap: 10px; min-width: 0;
  padding: 0 12px;
}
.hb-spot-cell + .hb-spot-cell { border-left: 1px solid rgba(186, 222, 255, .10); }
.hb-spot-well {
  width: 32px; height: 32px; border-radius: 999px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(56, 189, 248, .12);
  box-shadow: inset 0 0 0 1px rgba(125, 211, 252, .22);
  color: #7DD3FC;
}
.hb-spot-well.ok { background: rgba(52, 211, 153, .12); box-shadow: inset 0 0 0 1px rgba(52, 211, 153, .26); color: #34D399; }
.hb-spot-well.warn { background: rgba(251, 191, 36, .12); box-shadow: inset 0 0 0 1px rgba(251, 191, 36, .28); color: #FBBF24; }
.hb-spot-well.muted { background: rgba(148, 163, 184, .10); box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .16); color: #CBD5E1; }
.hb-spot-cell-txt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.hb-spot-cell-val { font-size: 0.8125rem; line-height: 1.25; font-weight: 600; color: #F1F5F9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-spot-cell-sub { font-size: 0.71875rem; line-height: 1.25; font-weight: 450; color: #94A3B8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 720px) {
  .hb-spot-meta { grid-template-columns: 1fr; gap: 10px; padding: 12px; }
  .hb-spot-cell { padding: 0; }
  .hb-spot-cell + .hb-spot-cell { border-left: 0; border-top: 1px solid rgba(186, 222, 255, .10); padding-top: 10px; }
}
.hb-spot-ctx-row { display: flex; align-items: center; gap: 10px; }
.hb-spot-next {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 8px 11px; border-radius: 9px;
  background: rgba(7, 14, 26, .26);
  box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .09);
  font-size: 0.78125rem; color: var(--hb-muted); text-align: left;
  transition: background-color .14s ease, box-shadow .14s ease, color .14s ease;
}
.hb-spot-next:hover { background: rgba(16, 31, 55, .42); box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .20); color: var(--hb-ink); }
.hb-spot-next-l { display: inline-flex; align-items: center; gap: 7px; min-width: 0; }
.hb-spot-next-lbl { font-size: 0.6875rem; font-weight: 650; letter-spacing: .06em; text-transform: uppercase; color: var(--hb-dim); flex: none; }
.hb-spot-next-txt { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--hb-body); }
.hb-spot-next:hover .hb-spot-next-txt { color: var(--hb-ink); }
.hb-spot-next-r { display: inline-flex; align-items: center; gap: 8px; flex: none; }
.hb-spot-next-exp {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2px 7px; border-radius: 999px;
  background: rgba(251, 191, 36, .12); box-shadow: inset 0 0 0 1px rgba(251, 191, 36, .28);
  font-size: 0.6875rem; font-weight: 600; color: #FDE68A; white-space: nowrap;
}
.hb-spot-next-exp .ic { width: 11px; height: 11px; color: #FBBF24; }
.hb-spot-next .ic { flex: none; color: var(--hb-dim); }
.hb-spot-foot {
  margin-top: auto;
  padding-top: 14px;
  border-top: 1px solid var(--hb-border);
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.hb-spot-foot .actions { margin-top: 0; gap: 8px; align-items: center; }
.hb-spot-foot .btn.outline { background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .24); }
.hb-spot-foot .btn.outline:hover { background: rgba(255,255,255,.09); box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .42); }
.hb-spot-foot .btn.ghost { color: var(--hb-muted); padding: 0 8px; }
.hb-spot-foot .btn.ghost:hover { color: var(--hb-ink); background: rgba(255,255,255,.06); }
.hb-spot-foot .reply { flex: 1 1 100%; }
.hb-skip-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 10px; border-radius: 8px;
  font-size: 0.8125rem; font-weight: 500; color: var(--hb-muted);
  transition: background-color .14s ease, color .14s ease;
}
.hb-skip-btn:hover { background: rgba(186, 222, 255, .08); color: var(--hb-ink); }

.hb-cleared {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; gap: 10px; flex: 1; padding: 28px 16px;
}
.hb-cleared-ring {
  width: 52px; height: 52px; border-radius: 999px;
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(52, 211, 153, .14); box-shadow: inset 0 0 0 1px rgba(52, 211, 153, .36);
  color: #6EE7B7;
}
.hb-cleared-ring.is-error {
  background: rgba(251, 113, 133, .13); box-shadow: inset 0 0 0 1px rgba(251, 113, 133, .38);
  color: #FDA4AF;
}
.hb-cleared-ring.is-muted {
  background: rgba(148, 179, 214, .12); box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .24);
  color: #94A3B8;
}
.h4-live-dot.is-error { background: #FB7185; }
.h4-live-dot.is-error::after { border-color: rgba(251, 113, 133, .55); }
.hb-cleared h2 { font-size: 1.125rem; font-weight: 600; color: var(--hb-ink); }
.hb-cleared p { font-size: 0.875rem; color: var(--hb-muted); max-width: 40ch; }
.hb-err-meta {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 11px; border-radius: 999px; margin-top: 2px;
  background: rgba(186, 222, 255, .06); box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .12);
  font-size: 0.75rem; font-weight: 500; color: var(--hb-muted);
}
.hb-err-meta .ic { width: 13px; height: 13px; color: #7DD3FC; }
.hb-cleared-acts { display: flex; align-items: center; gap: 10px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }

/* Right: Autonomous Catch-up Digest + Interactive Org AI Ask Panel */
.hb-catchup {
  display: flex; flex-direction: column; gap: 14px;
  padding: 20px 22px 18px; border-radius: 18px;
  background: radial-gradient(circle at 90% 8%, rgba(56, 189, 248, .12) 0%, transparent 56%), var(--hb-surface);
  backdrop-filter: var(--hb-blur); -webkit-backdrop-filter: var(--hb-blur);
  box-shadow: var(--hb-shadow);
  min-width: 0;
}
.hb-cu-hd { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hb-cu-title { display: inline-flex; align-items: center; gap: 7px; font-size: 0.9375rem; font-weight: 600; color: var(--hb-ink); }
.hb-cu-title .ic { color: #7DD3FC; }
.hb-cu-window {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: 999px;
  background: rgba(186, 222, 255, .07); box-shadow: inset 0 0 0 1px var(--hb-border);
  font-size: 0.72rem; font-weight: 500; color: var(--hb-muted);
}

.hb-digest { display: flex; flex-direction: column; gap: 10px; flex: 1; justify-content: space-between; }
.hb-dig-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 12px 13px; border-radius: 10px;
  background: var(--hb-well);
  box-shadow: inset 0 1px 0 rgba(186, 226, 255, .10), inset 0 0 0 1px rgba(186, 226, 255, .10);
  font-size: 0.8125rem; line-height: 1.42; color: var(--hb-body);

}
a.hb-dig-item:hover { background: var(--hb-surface-hi); box-shadow: inset 0 1px 0 rgba(186, 226, 255, .20), inset 0 0 0 1px var(--hb-border-hi); }
.hb-dig-ico { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; margin-top: 2px; flex: none; }
.hb-dig-item b { color: var(--hb-ink); font-weight: 600; }
.hb-dig-item .muted { color: var(--hb-muted); }

/* Spacious Catch-up Digest Footer & Timestamps */
.hb-dig-body { flex: 1; min-width: 0; }
.hb-dig-time { font-size: 0.7rem; font-weight: 500; color: var(--hb-dim); white-space: nowrap; flex: none; margin-top: 2px; font-variant-numeric: tabular-nums; }
.hb-cu-foot {

}
.hb-cu-link {

  font-size: 0.78125rem; font-weight: 500; color: var(--hb-muted);
  transition: color .14s ease;
}
.hb-cu-link:hover { color: var(--hb-ink); }

/* Zone 3: Clean Bento Portfolio Row */
.hb-proj-sec { display: flex; flex-direction: column; gap: 14px; }
.hb-proj-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hb-proj-head-l { display: flex; align-items: baseline; gap: 10px; }
.hb-proj-head h2 { font-size: 0.96875rem; font-weight: 600; letter-spacing: -.01em; color: var(--hb-ink); }
.hb-proj-head span { font-size: 0.8125rem; color: var(--hb-muted); }
.hb-proj-head .link { color: #7DD3FC; }
.hb-proj-head .link:hover { color: #BAE6FD; }
.hb-bento { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.hb-card {
  position: relative; display: flex; flex-direction: column; gap: 14px;
  padding: 18px 20px; border-radius: 16px; cursor: pointer;
  background: var(--hb-surface);

}
.hb-card:hover { background: var(--hb-surface-hi); box-shadow: var(--hb-shadow-hi); transform: translateY(-2px); }
.hb-card-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.hb-card-id { display: inline-flex; align-items: baseline; gap: 8px; min-width: 0; }
.hb-card-name { font-size: 0.96875rem; font-weight: 600; letter-spacing: -.01em; color: var(--hb-ink); }
a.hb-card-name:hover { color: #BAE6FD; }
.hb-rel-tag {
  font-size: 0.6875rem; font-weight: 600; font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  padding: 1px 6px; border-radius: 5px;
  background: rgba(186, 222, 255, .07); color: #94A3B8;
  box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .13);
}
.hb-card-prog { display: flex; flex-direction: column; gap: 7px; }
.hb-card-prog-row { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 0.78125rem; color: var(--hb-muted); font-variant-numeric: tabular-nums; }
.hb-card-prog-row strong { font-size: 0.875rem; font-weight: 650; color: var(--hb-ink); }
.hb-card-prog-row .blk { color: #FDA4AF; font-weight: 500; }
.hb-pace { font-size: 0.71875rem; font-weight: 600; }
.hb-pace.ok { color: #6EE7B7; }
.hb-pace.warn { color: #FDE68A; }
.hb-pace.bad { color: #FDA4AF; }
.hb-blocker {

  padding: 9px 11px; border-radius: 10px;

}

}

}

  background: rgba(56, 189, 248, .07);
  box-shadow: inset 0 0 0 1px rgba(125, 211, 252, .20);

}
.nav-all-projs { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(186, 222, 255, .07); }
.hb-blocker-txt { display: flex; align-items: flex-start; gap: 7px; min-width: 0; }
.hb-blocker-txt .ic { flex: none; margin-top: 2px; }
.hb-unblock-btn {
  display: inline-flex; align-items: center; gap: 2px; flex: none;
  padding: 2px 8px; border-radius: 6px;

}
.hb-unblock-btn:hover { background: rgba(56, 189, 248, .22); box-shadow: inset 0 0 0 1px rgba(125, 211, 252, .45); color: #FFFFFF; }
.hb-card-foot {
  margin-top: auto; padding-top: 12px; border-top: 1px solid var(--hb-border);

  font-size: 0.75rem; color: var(--hb-muted);
}
.hb-card-lead { display: inline-flex; align-items: center; gap: 4px; color: var(--hb-muted); }
a.hb-card-lead:hover { color: var(--hb-ink); }
.hb-card-lead .ic { opacity: .5; transition: transform .16s ease, opacity .16s ease; }
.hb-card:hover .hb-card-lead .ic { opacity: 1; transform: translateX(2px); color: #7DD3FC; }

/* Zone 3b: Compact 14-Day Release Horizon Strip */
.hb-horizon {
  display: flex; flex-direction: column; gap: 11px;
  padding: 15px 18px; border-radius: 16px;

.hb-hor-title {

}
.hb-hor-sub { font-size: 0.75rem; color: var(--hb-dim); }
.hb-hor-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.hb-hor-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px; border-radius: 11px;
  background: rgba(8, 16, 30, .22);

}

.hb-hor-l { display: flex; align-items: center; gap: 10px; min-width: 0; }
.hb-hor-date {

}

.hb-hor-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hb-hor-name { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8125rem; font-weight: 600; color: var(--hb-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.hb-hor-name .hb-rel-tag { flex: none; }
.hb-hor-note { font-size: 0.72rem; color: var(--hb-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Zone 4: Where Task Time Goes (Segmented Bottleneck Bar) */
.hb-time {
  display: flex; flex-direction: column; gap: 12px;
  padding: 18px 20px 16px; border-radius: 16px;
  background: var(--hb-surface);
  backdrop-filter: var(--hb-blur); -webkit-backdrop-filter: var(--hb-blur);
  box-shadow: var(--hb-shadow);
}
.hb-time-hd { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.hb-time-title {
  font-size: 0.96875rem; line-height: 1.3; font-weight: 600;
  letter-spacing: -.01em; color: var(--hb-ink);
}
.hb-time-unit { font-size: 0.78125rem; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--hb-dim); }
.hb-time-bar {
  display: flex; align-items: stretch; gap: 3px; height: 10px;
  border-radius: 999px; overflow: hidden;
  background: rgba(8, 15, 28, .55);
}
.hb-tseg {
  display: block; height: 100%; border-radius: 999px;
  transition: opacity .16s ease, filter .16s ease;
}
.hb-time-bar:hover .hb-tseg { opacity: .55; }
.hb-time-bar .hb-tseg:hover { opacity: 1; filter: brightness(1.12); }
.hb-tseg.agents { background: linear-gradient(90deg, #38BDF8 0%, #7DD3FC 100%); }
.hb-tseg.ci { background: linear-gradient(90deg, #10B981 0%, #34D399 100%); }
.hb-tseg.humans { background: linear-gradient(90deg, #EAB308 0%, #F5C76B 100%); }
.hb-tseg.queued { background: linear-gradient(90deg, #7C3AED 0%, #A78BFA 100%); box-shadow: inset 0 1px 0 rgba(221, 214, 254, .32); }

.hb-time-legend { display: flex; align-items: baseline; flex-wrap: wrap; gap: 8px 22px; }
.hb-tleg {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 0.8125rem; color: var(--hb-muted);
  transition: color .14s ease;
}

.hb-tleg-dot { width: 8px; height: 8px; border-radius: 999px; flex: none; }

.hb-tleg.queued .hb-tleg-dot { background: #A78BFA; }

.hb-tleg strong { font-size: 0.9375rem; font-weight: 650; font-variant-numeric: tabular-nums; }
.hb-tleg .hrs { font-size: 0.75rem; color: var(--hb-dim); font-variant-numeric: tabular-nums; }
.hb-tleg.agents strong { color: #7DD3FC; }
.hb-tleg.ci strong { color: #6EE7B7; }
.hb-tleg.humans strong { color: #F5C76B; }
.hb-tleg.queued strong { color: #C4B5FD; }

.hb-skel-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.hb-skel-card { padding: 18px; border-radius: 16px; background: var(--hb-surface); box-shadow: var(--hb-shadow); display: flex; flex-direction: column; gap: 12px; }
.hb-time-foot {
  display: flex; align-items: center; justify-content: space-between;
  gap: 8px 18px; flex-wrap: wrap;
}
.hb-time-note { font-size: 0.8125rem; line-height: 1.45; color: var(--hb-muted); }
.hb-time-acts { display: inline-flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.hb-inline-act {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 0.78125rem; font-weight: 600; color: #7DD3FC; white-space: nowrap;
  transition: color .14s ease;
}

.hb-time-auto {
  font-size: 0.75rem; line-height: 1.4; color: var(--hb-dim);
  font-variant-numeric: tabular-nums;
}

/* ── Theme 2: Frosted Ocean Light (data-theme="light") ────────────────── */
html[data-theme="light"] {
  color-scheme: light;
  --gray-950: #F4F9FD; --gray-900: #EAF2FA; --gray-800: #FFFFFF; --gray-700: #D6E3F0;
  --gray-500: #5B738F; --gray-400: #425A75; --gray-300: #1E324B; --white: #0B172A;
  --indigo-500: #0284C7; --indigo-400: #0369A1; --indigo-300: #0369A1;
  --amber-400: #D97706; --amber-300: #D97706; --amber-200: #B45309;
  --green-500: #059669; --green-400: #047857;
  --red-400: #E11D48; --red-300: #BE123C;
  --sky-400: #0284C7; --sky-300: #0369A1;
  --line: rgba(14, 65, 118, .10); --line2: rgba(14, 65, 118, .18);
  --hover: rgba(14, 65, 118, .06); --sidebar: rgba(244, 249, 255, .58);
}
html[data-theme="light"], html[data-theme="light"] body { background: #E9F1FA; color: #0B172A; }
html[data-theme="light"] body::before {
  background:
    radial-gradient(rgba(15, 45, 82, .16) 1px, transparent 1px) 0 0 / 28px 28px,
    radial-gradient(ellipse 68% 58% at 84% 14%, rgba(56, 189, 248, .30) 0%, rgba(14, 165, 233, .12) 42%, transparent 72%),
    radial-gradient(ellipse 64% 56% at 16% 18%, rgba(59, 130, 246, .22) 0%, rgba(37, 99, 235, .08) 44%, transparent 74%),
    radial-gradient(ellipse 58% 52% at 54% 88%, rgba(14, 165, 233, .22) 0%, rgba(6, 182, 212, .08) 46%, transparent 74%),
    linear-gradient(160deg, #E8F1FA 0%, #F1F6FC 50%, #E6EFF9 100%);
}
html[data-theme="light"] body::after {
  display: block;
  background: linear-gradient(180deg, rgba(56, 189, 248, .12) 0%, transparent 100%);
}
html[data-theme="light"] .sidebar {
  background: rgba(244, 249, 255, .58);
  backdrop-filter: blur(24px) saturate(160%); -webkit-backdrop-filter: blur(24px) saturate(160%);
  box-shadow: inset -1px 0 0 rgba(14, 65, 118, .12);

      : `<p class="empty-row">${q.trim() ? `Nothing matches “${esc(q.trim())}”.` : "Type in Search to find projects, work and members."}</p>`);
}

const TAU = Math.PI * 2;
const HALF_PI = Math.PI / 2;
const GOLDEN_ANGLE = Math.PI * (3 - Math.sqrt(5));
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const clamp01 = (v) => clamp(v, 0, 1);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const fmtTok = (t) => t < 1000 ? String(Math.round(t)) : `${(t / 1000).toFixed(1).replace(/\.0$/, "")}k`;

function createSeededRandom(seed) {
  let s = seed;
  return () => { s = (s * 1664525 + 1013904223) % 4294967296; return s / 4294967296; };
}

const prefersReducedMotion = () => !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);

class NeuralOrb {
  constructor(canvas) {
    this.canvas = canvas;
    this.ctx = canvas.getContext("2d");
    this.state = "idle";
    this.fov = 2.85;
    this.fieldPhase = 0;
    this.breathPhase = 0;
    this.energy = 0.22;
    this.targetEnergy = 0.22;
    this.thinking = 0;
    this.targetThinking = 0;
    this.stream = 0;
    this.targetStream = 0;
    this.firing = 0;
    this.contextFill = 0.54;
    this.targetContext = 0.54;
    this.ax = { x: 1, y: 0, z: 0 };
    this.ay = { x: 0, y: 1, z: 0 };
    this.az = { x: 0, y: 0, z: 1 };
    this.focusTheta = -0.35;
    this.focusPhi = HALF_PI;
    this.ripples = [];
    this.nodes = this._buildNodes();
    this.pts = this.nodes.map(() => ({ sx: 0, sy: 0, wz: 0, sr: 0, act: 0, core: false }));
    this._raf = null;
    this.resize();
    this._draw(0.016);
  }
  _buildNodes() {
    const rand = createSeededRandom(7919);
    const out = [];
    const layers = [
      { count: 400, mult: 1, jitter: 0.14, yJit: 0.045, shell: () => 1.0, dot: [0.017, 0.005], core: false },
      { count: 90, mult: 1.37, jitter: 0.2, yJit: 0.08, shell: () => 0.48 + rand() * 0.14, dot: [0.014, 0.004], core: true }
    ];
    for (const L of layers) {
      for (let i = 0; i < L.count; i++) {
        const y0 = 1 - (i / (L.count - 1)) * 2;
        const sr = Math.sqrt(Math.max(0, 1 - y0 * y0));
        const th = GOLDEN_ANGLE * i * L.mult + (rand() - 0.5) * L.jitter;
        const y = y0 + (rand() - 0.5) * L.yJit;
        const nx = Math.cos(th) * sr, nz = Math.sin(th) * sr;
        const len = Math.hypot(nx, y, nz) || 1;
        out.push({ nx: nx / len, ny: y / len, nz: nz / len, shell: L.shell(), dot: L.dot[0] + rand() * L.dot[1], core: L.core, phase: rand() * TAU, act: 0 });
      }

  }
  setState(st) {

      idle: { e: 0.22, t: 0, s: 0 },
      paused: { e: 0.08, t: 0, s: 0 },
      thinking: { e: 0.58, t: 1, s: 0 },
      working: { e: 0.74, t: 0.6, s: 0.35 },
      streaming: { e: 0.9, t: 0.2, s: 1 },
      compacting: { e: 0.52, t: 1, s: 0 }

    }
  }
  pulse(intensity = 1) {

    const ph = HALF_PI + (Math.random() - 0.5) * 2.2;
    this._ripple(Math.sin(ph) * Math.sin(th), Math.cos(ph), -Math.abs(Math.sin(ph) * Math.cos(th)) * 0.85 - 0.15, Math.min(1.3, intensity), 1.85, 0.48);
  }
  onToken(ch = "") {

    this.focusPhi = HALF_PI + Math.sin(this.fieldPhase * 1.35 + this.focusTheta * 0.65) * 1.22;
    const sp = Math.sin(this.focusPhi);
    const fx = sp * Math.sin(this.focusTheta), fy = Math.cos(this.focusPhi), fz = -Math.abs(sp * Math.cos(this.focusTheta)) * 0.88 - 0.12;

  }
  _ripple(fx, fy, fz, intensity, speed, width) {
    const l = Math.hypot(fx, fy, fz) || 1;
    this.ripples.push({ fx: fx / l, fy: fy / l, fz: fz / l, r: 0.02, age: 0, speed, intensity, width });

  resize() {
    if (!this.canvas) return;
    const parent = this.canvas.parentElement;
    const rect = parent ? parent.getBoundingClientRect() : { width: 200, height: 200 };
    const w = Math.max(160, Math.round(rect.width || 200));
    const h = Math.max(160, Math.round(rect.height || 200));
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    if (this.canvas.width !== Math.round(w * dpr) || this.canvas.height !== Math.round(h * dpr)) {

    }
    let last = performance.now();
    const tick = (now) => {
      if (!document.body.contains(this.canvas)) { this.stop(); return; }
      const dt = clamp((now - last) / 1000, 0.001, 0.05);

  _step(dt) {
    const k = 1 - Math.exp(-dt * 4.2);

    this.thinking += (this.targetThinking - this.thinking) * k;
    this.stream += (this.targetStream - this.stream) * k;
    this.contextFill += (this.targetContext - this.contextFill) * k;
    this.firing *= Math.exp(-dt * 3.2);
    if (this.state === "streaming") this.targetEnergy = Math.max(0.58, this.targetEnergy - dt * 0.55);
    this.fieldPhase += dt * (0.62 + this.thinking * 0.42 + this.stream * 0.78);
    this.breathPhase += dt * (1.35 + this.thinking * 0.65 + this.stream * 0.55);

    const spin = dt * (0.24 + this.thinking * 0.14 + this.stream * 0.24);
    const nod = dt * Math.sin(this.breathPhase * 0.32) * 0.06;
    const cx = Math.cos(nod), sx = Math.sin(nod), cy = Math.cos(spin), sy = Math.sin(spin);
    const rot = (v) => {
      const y = v.y * cx - v.z * sx, z = v.y * sx + v.z * cx, x = v.x;
      v.x = x * cy + z * sy; v.y = y; v.z = -x * sy + z * cy;
    };
    rot(this.ax); rot(this.ay);
    const norm = (v) => { const l = Math.hypot(v.x, v.y, v.z) || 1; v.x /= l; v.y /= l; v.z /= l; };
    norm(this.ax);
    const dot = this.ax.x * this.ay.x + this.ax.y * this.ay.y + this.ax.z * this.ay.z;
    this.ay.x -= dot * this.ax.x; this.ay.y -= dot * this.ax.y; this.ay.z -= dot * this.ax.z;
    norm(this.ay);
    this.az.x = this.ax.y * this.ay.z - this.ax.z * this.ay.y;
    this.az.y = this.ax.z * this.ay.x - this.ax.x * this.ay.z;
    this.az.z = this.ax.x * this.ay.y - this.ax.y * this.ay.x;

      const rp = this.ripples[i];
      rp.age += dt; rp.r += rp.speed * dt; rp.intensity *= Math.pow(0.34, dt);

  _draw(dt) {
    const { ctx, w, h, ax: X, ay: Y, az: Z, fieldPhase, breathPhase, fov } = this;
    const cx = w * 0.5, cy = h * 0.5, radius = Math.min(w, h) * 0.42;
    const fill = this.contextFill;
    const warmth = fill > 0.75 ? clamp01((fill - 0.75) / 0.25) : 0;
    const mix = (a, b, t) => Math.round(a + (b - a) * t);

    ctx.clearRect(0, 0, w, h);

    // Volumetric outer aura & rim
    const grad = ctx.createRadialGradient(cx - radius * 0.22, cy - radius * 0.24, radius * 0.12, cx, cy, radius * 1.24);
    grad.addColorStop(0, `rgba(${mix(56, 249, warmth)},${mix(189, 115, warmth)},${mix(248, 22, warmth)},${(0.18 + this.energy * 0.14).toFixed(3)})`);
    grad.addColorStop(0.58, `rgba(${mix(37, 234, warmth)},${mix(99, 88, warmth)},${mix(235, 12, warmth)},${(0.11 + this.energy * 0.08).toFixed(3)})`);
    grad.addColorStop(1, "rgba(30, 41, 57, 0)");
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(cx, cy, radius * 1.24, 0, TAU); ctx.fill();

    ctx.strokeStyle = `rgba(${mix(56, 251, warmth)},${mix(189, 146, warmth)},${mix(248, 60, warmth)},${(0.18 + this.energy * 0.12).toFixed(3)})`;
    ctx.lineWidth = 1.25;
    ctx.beginPath(); ctx.arc(cx, cy, radius * 1.02, 0, TAU); ctx.stroke();

    const fieldGain = 0.28 + this.energy * 0.58;
    const morphAmp = (0.008 + this.thinking * 0.015 + this.firing * 0.048) * 0.35;
    const settle = 1 - Math.pow(0.75, dt * 60);
    const coreExp = 0.24 + fill * 0.68;
    const coreGlow = 0.16 + fill * 0.44;
    const coreDotScale = 0.82 + fill * 0.42;

    for (let i = 0; i < this.nodes.length; i++) {
      const n = this.nodes[i];
      const rx = n.nx * X.x + n.ny * Y.x + n.nz * Z.x;
      const ry = n.nx * X.y + n.ny * Y.y + n.nz * Z.y;
      const rz = n.nx * X.z + n.ny * Y.z + n.nz * Z.z;

      const w2 = Math.cos(ry * 2.8 - rz * 2.3 + fieldPhase * 0.85 + Math.sin(rz * 2.2 + rx * 1.7 - fieldPhase * 0.55));

      let crest = 0;

        const off = Math.abs(ang - rp.r);

      const wx = rx * rad, wy = ry * rad, wz = rz * rad;

      pt.sy = cy + wy * radius * persp;
      pt.wz = wz;
