<html lang="en" class="dark">
<head>

<title>Agentic Org</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='8' fill='%230284c7'/%3E%3Cpath d='M10 22 16 9l6 13M12.5 17h7' fill='none' stroke='%23fff' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: dark;
  --gray-950: #030712; --gray-900: #101828; --gray-800: #1e2939; --gray-700: #364153;
  --gray-500: #6a7282; --gray-400: #99a1af; --gray-300: #d1d5dc; --white: #ffffff;
  --indigo-500: #615fff; --indigo-400: #7c86ff; --indigo-300: #a3b3ff;
  --amber-400: #ffb900; --amber-300: #ffd230; --amber-200: #fee685;
  --green-500: #00c950; --green-400: #05df72;
  --red-400: #ff6467; --red-300: #ffa2a2;
  --sky-400: #00bcff; --sky-300: #74d4ff;
  --line: rgb(255 255 255 / .05); --line2: rgb(255 255 255 / .1);
  --hover: rgb(255 255 255 / .05); --sidebar: rgb(0 0 0 / .1);
  --radius-md: 6px; --radius-lg: 8px;
  --gutter: 32px;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; background: #060B14; color: var(--white); }
body { position: relative; }
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background:
    radial-gradient(rgba(148, 179, 214, .11) 1px, transparent 1px) 0 0 / 28px 28px,
    radial-gradient(ellipse 68% 58% at 84% 14%, rgba(56, 189, 248, .24) 0%, rgba(14, 116, 144, .10) 42%, transparent 72%),
    radial-gradient(ellipse 64% 56% at 16% 18%, rgba(30, 100, 175, .26) 0%, rgba(14, 74, 128, .10) 44%, transparent 74%),
    radial-gradient(ellipse 58% 52% at 54% 88%, rgba(28, 110, 168, .22) 0%, rgba(14, 82, 130, .08) 46%, transparent 74%),
    linear-gradient(160deg, #060B14 0%, #0A1424 50%, #070E1A 100%);
}
body::after {
  content: "";
  position: fixed;
  inset: 0 0 auto 0;
  height: 220px;
  z-index: 0;
  pointer-events: none;
  background: linear-gradient(180deg, rgba(56, 189, 248, .07) 0%, transparent 100%);
}
body { font-family: "Inter Variable", Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: 0.875rem; line-height: 1.714; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; padding: 0; }
ul, ol { list-style: none; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--indigo-400); outline-offset: 2px; border-radius: 4px; }
h1[tabindex="-1"]:focus, h1[tabindex="-1"]:focus-visible, h2[tabindex="-1"]:focus, h2[tabindex="-1"]:focus-visible { outline: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.muted { color: var(--gray-400); }
.c-amber { color: var(--amber-200); } .c-green { color: var(--green-400); } .c-red { color: var(--red-300); }
.c-indigo { color: var(--indigo-300); } .c-gray { color: var(--gray-300); } .c-outline { color: var(--gray-400); }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .85em; color: var(--gray-300); }
code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .8em; background: var(--hover); color: var(--gray-300); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
.tnum { font-variant-numeric: tabular-nums; }

/* Icons (Lucide) */
.ic { width: 24px; height: 24px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic20 { width: 20px; height: 20px; } .ic16 { width: 16px; height: 16px; } .ic14 { width: 14px; height: 14px; stroke-width: 1.9; }
.ic48 { width: 48px; height: 48px; stroke-width: 1.5; }

/* Skip link */
.skip { position: absolute; left: 12px; top: -60px; z-index: 200; background: var(--indigo-500); color: #fff; font-weight: 600; padding: 8px 12px; border-radius: var(--radius-md); }
.skip:focus { top: 12px; }

/* Shell */
.sidebar { position: fixed; inset: 0 auto 0 0; width: 264px; z-index: 50; display: flex; flex-direction: column; gap: 14px; overflow: hidden; background: rgba(9, 17, 30, .58); backdrop-filter: blur(24px) saturate(155%); -webkit-backdrop-filter: blur(24px) saturate(155%); box-shadow: inset -1px 0 0 rgba(186, 222, 255, .10); padding: 0 18px; transition: width .22s cubic-bezier(.22, 1, .36, 1), padding .22s cubic-bezier(.22, 1, .36, 1); }
.content { position: relative; z-index: 1; height: 100%; overflow-y: auto; padding-left: 264px; display: flex; flex-direction: column; background: transparent; transition: padding-left .22s cubic-bezier(.22, 1, .36, 1); }
.content > main { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.sidebar-hd { display: flex; align-items: center; gap: 6px; min-height: 56px; flex: none; padding-top: 6px; }
.logo { display: flex; align-items: center; gap: 11px; height: 44px; flex: 1; min-width: 0; margin: 0 0 0 -6px; padding: 0 6px; border-radius: 8px; text-align: left; }
.logo:hover { background: rgba(186, 222, 255, .07); }
.logo .name { font-size: 15px; line-height: 24px; font-weight: 600; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.logo:focus-visible { outline-offset: -2px; }
.nav-collapse-btn {
  width: 30px; height: 30px; border-radius: 7px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  color: #7C91AE; transition: background-color .14s ease, color .14s ease;
}
.nav-collapse-btn:hover { background: rgba(186, 222, 255, .08); color: #F8FAFC; }
.nav-collapse-btn .ic { width: 18px; height: 18px; }
.nav { display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 16px; }
.nav > ul.nav-scroll { display: flex; flex: 1; min-height: 0; flex-direction: column; gap: 20px; overflow-x: hidden; overflow-y: auto; margin: 0 -6px; padding: 0 6px 8px; }
.nav > ul.nav-pinned { flex: none; padding-bottom: 4px; }
.nav.fold-teams .subwrap[data-fold="teams"], .nav.fold-projects .subwrap[data-fold="projects"] { display: none; }
.sidebar.tight { gap: 8px; }
.sidebar.tight .nav { gap: 8px; }
.sidebar.tight .nav > ul.nav-scroll { gap: 12px; }
.nav-label {
  padding: 0 8px;
  font-size: 0.6875rem; line-height: 1.125rem; font-weight: 650;
  letter-spacing: .07em; text-transform: uppercase;
  color: #74849B;
}
.nav-group-hd {
  display: flex; align-items: center; justify-content: space-between; gap: 4px;
  padding: 0 2px 0 8px;
}
.nav-group-title {
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
  font-size: 0.6875rem; line-height: 1.125rem; font-weight: 650;
  letter-spacing: .07em; text-transform: uppercase;
  color: #74849B;
}
.nav-group-title .ic { width: 12px; height: 12px; color: #8BA1BE; }
.nav-group-acts { display: inline-flex; align-items: center; gap: 2px; }
.nav-group-all { font-size: 0.6875rem; font-weight: 500; color: #7C91AE; padding: 2px 6px; border-radius: 5px; }
.nav-group-all:hover { color: #F8FAFC; background: rgba(186, 222, 255, .08); }
.nav-fav-row { display: flex; align-items: center; gap: 2px; }
.nav-fav-row .nav-item { flex: 1; min-width: 0; }
.nav-fav-row .nav-item .ic.tone-ok { color: #34D399; }
.nav-fav-row .nav-item .ic.tone-warn { color: #FBBF24; }
.nav-fav-row .nav-item .ic.tone-bad { color: #FB7185; }
.fav-star-btn {
  width: 24px; height: 24px; border-radius: 6px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  color: rgba(251, 191, 36, .65); opacity: 0;
  transition: opacity .14s ease, color .14s ease, background-color .14s ease;
}
.nav-fav-row:hover .fav-star-btn, .fav-star-btn:focus-visible { opacity: 1; }
.fav-star-btn:hover { color: #FDE68A; background: rgba(251, 191, 36, .12); }
.fav-star-btn .ic { width: 13px; height: 13px; fill: currentColor; }
.nav-rail-only { display: none; }
.nav-fav-empty { padding: 4px 10px; font-size: 0.75rem; color: #64748B; }
.nav-list { margin: 6px 0 0; display: flex; flex-direction: column; gap: 2px; }
.nav-list.top { margin-top: 0; }
.nav-item {
  display: flex; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 8px;
  font-size: 0.875rem; line-height: 1.35rem; font-weight: 500;
  color: #94A3B8;
  transition: background-color .14s ease, color .14s ease, box-shadow .14s ease;
}
.nav-item .ic { width: 18px; height: 18px; color: #7C91AE; flex: none; transition: color .14s ease; }
.nav-item:hover { background: rgba(186, 222, 255, .07); color: #F8FAFC; }
.nav-item:hover .ic { color: #CBD5E1; }
.nav-item[aria-current="page"], .nav-item.cur {
  background: rgba(56, 189, 248, .12); color: #F8FAFC; font-weight: 600;
  box-shadow: inset 0 1px 0 rgba(186, 222, 255, .14), inset 0 0 0 1px rgba(125, 211, 252, .22);
}
.nav-item[aria-current="page"] .ic, .nav-item.cur .ic { color: #7DD3FC; }
.nav-item:focus-visible { outline-offset: -2px; }

/* Foldable nav group row (link + subtle expand chevron) */
.nav-row { display: flex; align-items: center; gap: 2px; }
.nav-row .nav-item { flex: 1; min-width: 0; }
.nav-fold-btn {
  width: 28px; height: 28px; border-radius: 6px; flex: none;
  display: inline-flex; align-items: center; justify-content: center;
  color: #64748B; transition: background-color .14s ease, color .14s ease;
}
.nav-fold-btn:hover { background: rgba(186, 222, 255, .08); color: #E2E8F0; }
.nav-fold-btn .ic { width: 14px; height: 14px; transition: transform .18s ease; }

.nav-sub {
  margin: 3px 0 4px 18px; padding-left: 10px;
  border-left: 1px solid rgba(186, 222, 255, .10);
  display: flex; flex-direction: column; gap: 2px;
}
.nav-sub .nav-item { padding: 5px 8px; font-size: 0.8125rem; font-weight: 500; gap: 8px; }
.nav-sub .nav-item .ic { width: 15px; height: 15px; }
.nav-sub .nav-item .ic.tone-ok { color: #34D399; }
.nav-sub .nav-item .ic.tone-warn { color: #FBBF24; }
.nav-sub .nav-item .ic.tone-bad { color: #FB7185; }
.nav-sub .nav-item.more { font-size: 12px; color: #74849B; }
.nav-sublabel { padding: 4px 8px 2px; font-size: 11px; line-height: 16px; font-weight: 600; color: #64748B; }
.chip-i { display: inline-flex; width: 20px; height: 20px; flex: none; align-items: center; justify-content: center; border-radius: 6px; border: 1px solid var(--line2); background: var(--hover); font-size: 10px; font-weight: 600; color: var(--gray-400); }
.nav-item:hover .chip-i, .nav-item[aria-current="page"] .chip-i { color: #fff; border-color: rgb(255 255 255 / .2); }
.nav-sub .nav-item span.t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.badge { margin-left: auto; border-radius: 999px; background: rgba(251, 191, 36, .18); color: #FDE68A; box-shadow: inset 0 0 0 1px rgba(251, 191, 36, .38); font-size: 11px; line-height: 17px; font-weight: 650; padding: 0 7px; font-variant-numeric: tabular-nums; }
.foot { flex: none; margin: 0 -18px; border-top: 1px solid rgba(186, 222, 255, .09); }
.foot .menu-wrap { display: block; }
.foot a, .foot .acct { display: flex; width: 100%; align-items: center; gap: 12px; padding: 11px 18px; text-align: left; }
.foot a:hover, .foot .acct:hover { background: var(--hover); }
.foot a:focus-visible, .foot .acct:focus-visible { outline-offset: -2px; }
.menu.up { top: auto; bottom: calc(100% + 6px); left: 16px; right: auto; }
.foot .who { font-weight: 600; }
.foot .office { display: flex; align-items: center; gap: 6px; font-size: 12px; line-height: 20px; color: var(--gray-400); }
.foot .office .ic14 { color: var(--green-400); }
.foot .office-link.is-offline .office { color: #FDA4AF; }
.foot .office-link.is-offline .office .ic14,
.foot .office-link.is-offline .office-rail .obadge .ic { color: #FB7185; }
.foot .acct .acct-chev { margin-left: auto; color: var(--gray-400); }
.foot .office-rail { display: none; position: relative; }
.foot .office-rail .obadge { position: absolute; right: -3px; bottom: -3px; width: 12px; height: 12px; border-radius: 99px; background: #1b2533; display: inline-flex; align-items: center; justify-content: center; }
.foot .office-rail .obadge .ic { width: 12px; height: 12px; stroke-width: 2; color: var(--green-400); }

.proto-banner { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 8px var(--gutter); background: rgba(8, 15, 28, .54); backdrop-filter: blur(20px) saturate(150%); -webkit-backdrop-filter: blur(20px) saturate(150%); border-bottom: 1px solid rgba(186, 222, 255, .09); font-size: 13px; color: var(--gray-300); flex-shrink: 0; }
.proto-banner .grow { flex: 1; min-width: 110px; }
.bctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.ver-ctl { display: inline-flex; align-items: center; gap: 6px; }
.ver-select { font-size: 0.8125rem; font-weight: 600; padding: 0 20px 0 8px; cursor: pointer; }
.topbar { position: sticky; top: 0; z-index: 40; display: flex; align-items: center; justify-content: center; gap: 12px; height: 68px; padding: 12px var(--gutter) 10px; background: transparent; flex-shrink: 0; }
.topbar::before { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none; background: linear-gradient(180deg, rgba(6, 13, 25, .74) 0%, rgba(6, 13, 25, .42) 72%, rgba(6, 13, 25, 0) 100%); backdrop-filter: blur(18px) saturate(145%); -webkit-backdrop-filter: blur(18px) saturate(145%); -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 76%, transparent 100%); mask-image: linear-gradient(180deg, #000 0%, #000 76%, transparent 100%); }
.topbar .menu-btn { position: absolute; left: 12px; }

/* Unified Floating Command & Org AI Bar */
.cmdk-shell {
  display: inline-flex; align-items: center;
  width: min(640px, 100%); height: 46px; padding: 5px 6px 5px 6px;
  border-radius: 14px;
  background: rgba(10, 19, 35, .36);
  backdrop-filter: blur(1.2px) saturate(145%); -webkit-backdrop-filter: blur(1.2px) saturate(145%);
  box-shadow: inset 0 1px 0 rgba(186, 222, 255, .20), inset 0 0 0 1px rgba(186, 222, 255, .16), 0 10px 30px -10px rgba(0, 0, 0, .58);
  transition: background-color .18s ease, box-shadow .18s ease, transform .18s ease;
}
.cmdk-shell:hover {
  background: rgba(14, 27, 49, .48);
  box-shadow: inset 0 1px 0 rgba(224, 242, 254, .28), inset 0 0 0 1px rgba(125, 211, 252, .36), 0 14px 34px -10px rgba(2, 6, 23, .72), 0 0 0 3px rgba(56, 189, 248, .08);
  transform: translateY(-0.5px);
}
.cmdk-trigger {
  flex: 1; min-width: 0; height: 100%;
  display: inline-flex; align-items: center; gap: 11px;
  padding: 0 10px 0 12px; border-radius: 10px;
  color: #9BB0C9; font-size: 0.875rem; font-weight: 450; letter-spacing: -.005em;
  transition: color .14s ease, background-color .14s ease;
}
.cmdk-trigger:hover { color: #F1F5F9; background: rgba(186, 222, 255, .05); }
.cmdk-trigger .ic { width: 18px; height: 18px; color: #7C91AE; flex: none; transition: color .14s ease; }
.cmdk-trigger:hover .ic { color: #7DD3FC; }
.cmdk-shell.is-offline { opacity: .82; }
.cmdk-shell.is-offline:hover { transform: none; background: rgba(10, 19, 35, .36); box-shadow: inset 0 1px 0 rgba(186, 222, 255, .20), inset 0 0 0 1px rgba(186, 222, 255, .16), 0 10px 30px -10px rgba(0, 0, 0, .58); }
.cmdk-trigger.is-offline { cursor: not-allowed; color: #74849B; }
.cmdk-trigger.is-offline:hover { color: #74849B; background: transparent; }
.cmdk-trigger.is-offline:hover .ic { color: #7C91AE; }
.cmdk-trigger.is-offline kbd { opacity: .4; }
.cmdk-ph { flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cmdk-trigger kbd {
  display: inline-flex; align-items: center; justify-content: center;
  height: 24px; padding: 0 8px; border-radius: 6px;
  background: rgba(186, 222, 255, .08);
  box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .15);
  font-family: inherit; font-size: 0.72rem; font-weight: 600; color: #94A3B8;
  flex: none;
}
.cmdk-sep { width: 1px; height: 22px; background: rgba(186, 222, 255, .13); margin: 0 6px; flex: none; }
.cmdk-ai-btn {
  height: 34px; padding: 0 14px; border-radius: 9px; flex: none;
  display: inline-flex; align-items: center; gap: 7px;
  background: linear-gradient(135deg, rgba(56, 189, 248, .24) 0%, rgba(14, 165, 233, .16) 100%);
  box-shadow: inset 0 1px 0 rgba(224, 242, 254, .28), inset 0 0 0 1px rgba(125, 211, 252, .34);
  color: #E0F2FE; font-size: 0.8125rem; font-weight: 600; letter-spacing: -.005em;
  transition: background-color .15s ease, box-shadow .15s ease, color .15s ease;
}
.cmdk-ai-btn .ic { width: 15px; height: 15px; color: #7DD3FC; flex: none; }
.cmdk-ai-btn:hover {
  background: linear-gradient(135deg, rgba(56, 189, 248, .38) 0%, rgba(14, 165, 233, .28) 100%);
  box-shadow: inset 0 1px 0 rgba(224, 242, 254, .40), inset 0 0 0 1px rgba(125, 211, 252, .56);
  color: #FFFFFF;
}
.cmdk-ai-btn.is-offline {
  background: rgba(148, 163, 184, .09);
  box-shadow: inset 0 0 0 1px rgba(148, 163, 184, .22);
  color: #7C91AE; cursor: not-allowed; opacity: .78;
}
.cmdk-ai-btn.is-offline .ic { color: #FB7185; }
.cmdk-ai-btn.is-offline:hover {
  background: rgba(148, 163, 184, .09);
  box-shadow: inset 0 0 0 1px rgba(148, 163, 184, .22);
  color: #7C91AE;
}

.cmdk-backdrop {
  position: fixed; inset: 0; z-index: 140;
  display: flex; align-items: flex-start; justify-content: center;
  padding: 9vh 16px 24px;
  background: rgba(4, 8, 18, .60);
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
.cmdk-backdrop[hidden] { display: none !important; }
.cmdk-dialog {
  width: min(650px, 100%); max-height: 78vh;
  display: flex; flex-direction: column; overflow: hidden;
  border-radius: 18px;
  background: rgba(11, 20, 38, .90);
  backdrop-filter: blur(34px) saturate(185%); -webkit-backdrop-filter: blur(34px) saturate(185%);
  box-shadow: inset 0 1px 0 rgba(186, 222, 255, .22), inset 0 0 0 1px rgba(186, 222, 255, .16), 0 32px 84px rgba(0, 0, 0, .74);
}
.cmdk-tabs {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 12px 16px 10px;
  border-bottom: 1px solid rgba(186, 222, 255, .08);
  background: rgba(8, 15, 28, .44);
}
.cmdk-tab-grp {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px; border-radius: 10px;
  background: rgba(186, 222, 255, .05);
  box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .09);
}
.cmdk-tab {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 12px; border-radius: 8px;
  font-size: 0.78125rem; font-weight: 600; color: #8BA1BE;
  transition: background-color .14s ease, color .14s ease, box-shadow .14s ease;
}
.cmdk-tab:hover { color: #E2E8F0; }
.cmdk-tab[aria-selected="true"] {
  background: rgba(56, 189, 248, .20);
  color: #F8FAFC;
  box-shadow: inset 0 0 0 1px rgba(125, 211, 252, .34);
}
.cmdk-tab[aria-selected="true"] .ic { color: #7DD3FC; }
.cmdk-in-row {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px;
  border-bottom: 1px solid rgba(186, 222, 255, .10);
}
.cmdk-in-row .ic { color: #7DD3FC; flex: none; }
.cmdk-in-row input {
  flex: 1; min-width: 0; border: 0; background: transparent;
  color: #F8FAFC; font: inherit; font-size: 1rem; line-height: 1.45;
}
.cmdk-in-row input::placeholder { color: #7C91AE; }
.cmdk-in-row input:focus-visible { outline: none; }
.cmdk-in-row input::-webkit-search-cancel-button { display: none; }
.cmdk-ask-go {
  height: 32px; padding: 0 14px; border-radius: 9px; flex: none;
  display: inline-flex; align-items: center; gap: 5px;
  background: rgba(56, 189, 248, .24); color: #E0F2FE;
  box-shadow: inset 0 0 0 1px rgba(125, 211, 252, .42);
  font-size: 0.8125rem; font-weight: 600;
  transition: background-color .14s ease, color .14s ease;
}
.cmdk-ask-go:hover:not(:disabled) { background: rgba(56, 189, 248, .36); color: #FFFFFF; }
.cmdk-ask-go:disabled { opacity: .42; cursor: default; background: rgba(148, 163, 184, .12); color: #94A3B8; box-shadow: inset 0 0 0 1px rgba(148, 163, 184, .22); }
.cmdk-ask-go[hidden] { display: none; }
.cmdk-esc {
  padding: 3px 8px; border-radius: 6px; cursor: pointer;

.cmdk-ai-list { list-style: none; display: flex; flex-direction: column; gap: 6px; margin-top: 4px; }

.cmdk-ai-chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 2px 4px 6px; }
.cmdk-ai-chip {

.cmdk-opt {

.cmdk-opt-txt { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 8px; }
.cmdk-opt-lbl { font-weight: 500; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.cmdk-opt-tag {

}

.cmdk-foot {

  padding: 9px 16px;
  border-top: 1px solid rgba(186, 222, 255, .09);
  background: rgba(7, 13, 25, .55);
  font-size: 0.72rem; color: #74849B;
}

  padding: 1px 5px; border-radius: 4px;
  background: rgba(186, 222, 255, .08); box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .14);
  font-family: inherit; font-size: 0.6875rem; color: #94A3B8;
}

/* Elegant Win-Sweep CTA in Home Briefing Header */
.hb-quick-acts { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.search {
  position: relative; display: grid; flex: 0 1 240px; width: 240px; max-width: 240px; height: 34px;
  border-radius: 999px;
  background: rgba(13, 24, 42, .38);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .10);
  transition: width .24s cubic-bezier(.22, 1, .36, 1), max-width .24s cubic-bezier(.22, 1, .36, 1), flex-basis .24s cubic-bezier(.22, 1, .36, 1), background-color .18s ease, box-shadow .18s ease;
}
.search:hover { background: rgba(17, 31, 54, .50); box-shadow: inset 0 0 0 1px rgba(186, 222, 255, .18); }
.search:focus-within {
  flex-basis: 360px; width: 360px; max-width: 360px;
  background: rgba(15, 28, 48, .72);
  box-shadow: inset 0 0 0 1.5px rgba(125, 211, 252, .55), 0 4px 20px -4px rgba(0, 0, 0, .4);
}
.search > * { grid-area: 1 / 1; }
.search input { width: 100%; background: transparent; border: 0; color: #F8FAFC; padding: 0 36px 0 34px; font: inherit; font-size: 0.8125rem; }
.search input::placeholder { color: #7C91AE; }
.search input:focus-visible { outline: none; }
.search input::-webkit-search-cancel-button { display: none; }
.search > .ic20 { width: 16px; height: 16px; margin-left: 12px; align-self: center; color: #7C91AE; pointer-events: none; }
.search kbd { justify-self: end; align-self: center; margin-right: 10px; border: 1px solid rgba(186, 222, 255, .14); border-radius: 5px; padding: 0 5px; font-family: inherit; font-size: 11px; line-height: 17px; color: #7C91AE; background: rgba(255, 255, 255, .03); }
.sres { position: absolute; top: calc(100% + 8px); right: 0; left: auto; min-width: 360px; z-index: 70; max-height: 440px; overflow-y: auto; background: rgba(12, 19, 38, .78); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border-radius: 12px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), inset 0 0 0 1px rgba(255, 255, 255, .12), 0 18px 48px rgba(0, 0, 0, .58); padding: 6px 0; }
.sres[hidden] { display: none; }
.sg { padding: 6px 12px 2px; font-size: 12px; line-height: 20px; font-weight: 600; color: var(--gray-400); }
.sopt { display: flex; align-items: center; gap: 10px; padding: 6px 12px; cursor: pointer; }
.sopt:hover, .sopt[aria-selected="true"] { background: var(--hover); }
.sopt[aria-selected="true"] { box-shadow: inset 2px 0 0 var(--indigo-400); }
.sopt > .ic20 { color: var(--gray-400); }
.sopt .grow { flex: 1; min-width: 0; }
.sopt .sl { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sopt .ss { display: block; font-size: 12px; line-height: 18px; color: var(--gray-400); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snone { padding: 10px 12px; color: var(--gray-400); }
.sopt.sall { font-weight: 600; color: var(--indigo-400); border-top: 1px solid var(--line); margin-top: 4px; }
body.nokeys .search kbd { display: none; }
.search .sclose { display: none; }
.btn.new-btn {
  height: 34px; padding: 0 12px; border-radius: 999px;
  background: rgba(99, 102, 241, .20);
  color: #EEF2FF;
  box-shadow: inset 0 1px 0 rgba(199, 210, 254, .30), inset 0 0 0 1px rgba(129, 140, 248, .45), 0 2px 10px -3px rgba(79, 70, 229, .45);
  transition: background-color .16s ease, box-shadow .16s ease, transform .14s ease;
}
.btn.new-btn:hover {
  background: rgba(99, 102, 241, .34);
  box-shadow: inset 0 1px 0 rgba(224, 231, 255, .40), inset 0 0 0 1px rgba(165, 180, 252, .65), 0 4px 16px -4px rgba(99, 102, 241, .6);
  transform: translateY(-1px);
}
.new-btn .new-chev { color: #C7D2FE; }
.topbar .spacer { flex: 1; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 2.25rem; padding: 0.375rem 0.75rem; border-radius: var(--radius-md); font-size: 0.875rem; line-height: 1.25rem; font-weight: 600; white-space: nowrap; }
.btn .ic20 { margin-left: -2px; }
.btn.primary { background: var(--indigo-500); color: #fff; }
.btn.primary:hover { background: rgb(97 95 255 / .8); }
.btn.outline { background: var(--hover); color: #fff; box-shadow: inset 0 0 0 1px var(--line2); }
.btn.outline:hover { background: var(--line2); }
.btn.ghost { color: var(--gray-300); }
.btn.ghost:hover { background: var(--hover); color: #fff; }
.btn.danger { background: rgb(255 100 103 / .1); color: var(--red-300); box-shadow: inset 0 0 0 1px rgb(255 100 103 / .2); }
.btn.sm { min-height: 1.875rem; padding: 0.25rem 0.625rem; font-size: 0.8125rem; line-height: 1.125rem; }
.btn.xs { min-height: 1.75rem; padding: 0.1875rem 0.5rem; font-size: 0.75rem; line-height: 1rem; }
.btn.icon { width: 2.25rem; min-width: 2.25rem; padding: 0; }
.btn.icon .ic20 { margin-left: 0; }
.btn.menu-btn, .btn.search-btn { display: none; }
.btn.textbtn { padding: 0 4px; font-weight: 500; color: #fff; }
.btn.textbtn:hover { background: var(--hover); }
.btn.textbtn .cur { color: var(--gray-400); font-weight: 500; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.link { color: var(--indigo-400); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
.link:hover { color: var(--indigo-300); }
.alink:hover { text-decoration: underline; }

/* Menus */
.menu-wrap { position: relative; display: inline-block; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; min-width: 200px; background: rgba(12, 19, 38, .76); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border-radius: 10px; box-shadow: inset 0 1px 0 rgba(255, 255, 255, .15), inset 0 0 0 1px rgba(255, 255, 255, .12), 0 18px 44px rgba(0, 0, 0, .58); padding: 8px 0; }
.menu.left { left: 0; right: auto; }
.menu[hidden] { display: none; }
.menu button { display: flex; width: 100%; align-items: center; gap: 10px; padding: 6px 12px; text-align: left; color: #fff; white-space: nowrap; }
.menu button:hover, .menu button:focus-visible { background: var(--hover); outline-offset: -2px; }
.menu .ic20 { color: var(--gray-400); }
.menu button[aria-checked="true"] .ic20 { color: var(--indigo-400); }
.menu button.danger-item { color: var(--red-300); }
.menu-h { padding: 4px 12px; font-size: 0.75rem; line-height: 1.25rem; font-weight: 600; color: var(--gray-400); }
.menu hr { border: 0; height: 1px; background: var(--line); margin: 4px 0; }
.spacer20 { display: inline-block; width: 20px; height: 20px; flex: none; }

/* Page header */
.ph { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 24px; padding: 24px var(--gutter); border-bottom: 1px solid var(--line); flex-shrink: 0; }
.ph-t { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; min-width: 0; }
.ph h1 { font-size: 1rem; line-height: 1.75rem; font-weight: 600; }
.cnt { font-size: 0.75rem; line-height: 1.5rem; color: var(--gray-400); font-weight: 400; }
.ph-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.back { display: inline-flex; align-items: center; gap: 4px; color: var(--gray-400); font-weight: 600; font-size: 0.8125rem; padding: 12px var(--gutter) 0; }
.back:hover { color: #fff; }
.desc { padding: 16px var(--gutter) 0; color: var(--gray-400); max-width: 820px; }

/* Sections */
.section { padding: 32px var(--gutter) 8px; }
.section + .section { border-top: 1px solid var(--line2); }
.sec-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.sec-h h2 { font-size: 1rem; line-height: 1.75rem; font-weight: 600; display: flex; align-items: baseline; gap: 8px; }
.sec-h h2 .ic20 { align-self: center; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; }
.cols2 > .section { border-top: 1px solid var(--line2); }
.cols2 > .section + .section { border-left: 1px solid var(--line); }

/* Tabs */
.tabs { display: flex; gap: 24px; overflow-x: auto; overflow-y: hidden; box-shadow: inset 0 -1px 0 var(--line2); padding: 0 var(--gutter); flex-shrink: 0; }
.tab { box-shadow: inset 0 -2px 0 transparent; padding: 0.875rem 0.25rem; font-weight: 600; white-space: nowrap; color: var(--gray-400); display: inline-flex; align-items: center; gap: 8px; }
.tab:hover { color: #fff; box-shadow: inset 0 -2px 0 rgb(255 255 255 / .2); }
.tab[aria-current="page"], .tab[aria-pressed="true"], .tab[aria-selected="true"] { color: #fff; box-shadow: inset 0 -2px 0 var(--indigo-400); }
.tab:focus-visible { outline-offset: -2px; }
.tcount { border-radius: 99px; background: var(--hover); padding: 1px 8px; font-size: 0.75rem; line-height: 1.125rem; font-weight: 500; color: var(--gray-300); }
.subbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 12px var(--gutter); border-bottom: 1px solid var(--line); flex-shrink: 0; }
.seg { display: inline-flex; align-items: stretch; gap: 2px; min-height: 2.25rem; padding: 3px; border-radius: var(--radius-md); background: rgba(15, 23, 42, .45); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .10); }
.seg button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 0 10px; border-radius: 4px; font-size: 0.8125rem; line-height: 1.25rem; font-weight: 600; color: var(--gray-400); }
.seg button:hover { color: #fff; }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--line2); color: #fff; }
.seg.icons button { padding: 4px 8px; }
.seg-label { font-size: 0.75rem; color: var(--gray-400); font-weight: 600; }

/* Pills */
.pill { display: inline-flex; flex: none; align-items: center; gap: 6px; border-radius: 99px; padding: 4px 8px; font-size: 12px; line-height: 16px; font-weight: 500; white-space: nowrap; box-shadow: inset 0 0 0 1px; }
.pill.chip { border-radius: var(--radius-md); }
.t-indigo { background: rgb(124 134 255 / .1); color: var(--indigo-300); box-shadow: inset 0 0 0 1px rgb(124 134 255 / .3); }
.t-gray { background: rgb(153 161 175 / .1); color: var(--gray-300); box-shadow: inset 0 0 0 1px rgb(153 161 175 / .2); }
.t-outline { background: transparent; color: var(--gray-400); box-shadow: inset 0 0 0 1px rgb(153 161 175 / .25); }
.t-green { background: rgb(0 201 80 / .1); color: var(--green-400); box-shadow: inset 0 0 0 1px rgb(0 201 80 / .2); }
.t-amber { background: rgb(255 185 0 / .1); color: var(--amber-200); box-shadow: inset 0 0 0 1px rgb(255 185 0 / .3); }
.t-red { background: rgb(255 100 103 / .1); color: var(--red-300); box-shadow: inset 0 0 0 1px rgb(255 100 103 / .2); }
.t-sky { background: rgb(0 188 255 / .1); color: var(--sky-300); box-shadow: inset 0 0 0 1px rgb(0 188 255 / .2); }
.pin { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.pin.wrap { align-items: flex-start; white-space: normal; min-width: 0; max-width: 100%; overflow-wrap: anywhere; }
.pin.wrap .ic14 { margin-top: 3px; }
.health { display: inline-flex; align-items: flex-start; gap: 6px; font-size: 13px; line-height: 20px; }
.health .ic16 { margin-top: 2px; }

/* Avatars and presence dots */
.av { position: relative; display: inline-flex; flex: none; align-items: center; justify-content: center; border-radius: 99px; background: var(--gray-800); font-weight: 600; box-shadow: inset 0 0 0 1px var(--line2); aspect-ratio: 1 / 1; align-self: center; }
.av24 { width: 24px; height: 24px; min-width: 24px; min-height: 24px; font-size: 9px; font-weight: 650; letter-spacing: -0.02em; }
.av32 { width: 32px; height: 32px; min-width: 32px; min-height: 32px; font-size: 12px; }
.av40 { width: 40px; height: 40px; min-width: 40px; min-height: 40px; font-size: 14px; }
.av > .ic { flex: none; }
.av.empty { color: var(--gray-400); padding: 0; }
.avdot { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 99px; box-shadow: 0 0 0 2px var(--gray-800); }
.av24 .avdot { width: 8px; height: 8px; }
.av40 .avdot { width: 12px; height: 12px; }
.p-needs { background: var(--amber-400); }
.p-withyou { background: var(--indigo-400); }
.p-working { background: var(--indigo-400); }
.p-working::after { content: ""; position: absolute; inset: 0; border-radius: inherit; animation: soft-pulse 2s ease-in-out infinite; }
.p-paused { background: linear-gradient(90deg, transparent 24%, var(--gray-300) 24% 42%, transparent 42% 58%, var(--gray-300) 58% 76%, transparent 76%) var(--gray-700); }
.p-available { background: var(--green-400); }
.p-asleep { background: var(--gray-400); }
.p-offline { background: var(--gray-800); box-shadow: 0 0 0 2px var(--gray-800), inset 0 0 0 2px var(--gray-400); }
@keyframes soft-pulse { 0%,100% { box-shadow: 0 0 0 0 rgb(124 134 255 / .45); } 50% { box-shadow: 0 0 0 5px rgb(124 134 255 / 0); } }
.avstack { display: flex; }
.avstack .av { margin-left: -6px; box-shadow: 0 0 0 2px var(--gray-800); }
.avstack .av:first-child { margin-left: 0; }
.avstack .more { font-size: 12px; color: var(--gray-400); margin-left: 6px; align-self: center; }

/* Rows */
.rows > li { position: relative; display: flex; align-items: center; gap: 16px; padding: 16px var(--gutter); border-bottom: 1px solid var(--line); }
.rows > li:last-child { border-bottom: 0; }
.rows > li.linked:hover { background: rgb(255 255 255 / .025); }
.rows .grow { flex: 1; min-width: 0; }
.rt { display: flex; align-items: center; gap: 8px; font-weight: 600; min-width: 0; flex-wrap: wrap; }
.rt .sec { font-weight: 400; color: var(--gray-400); }
.stretch::after { content: ""; position: absolute; inset: 0; }
.stretch:focus-visible { outline: none; }
.stretch:focus-visible::after { outline: 2px solid var(--indigo-400); outline-offset: -2px; }
.rows .z { position: relative; z-index: 2; }
.meta { margin-top: 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12px; line-height: 20px; color: var(--gray-400); }
.meta a { position: relative; z-index: 2; }
.meta a:hover { color: #fff; text-decoration: underline; }
.rowline { margin-top: 2px; font-size: 13px; line-height: 20px; color: var(--gray-300); }
.rowline a { position: relative; z-index: 2; }
.rowline a:hover { color: #fff; text-decoration: underline; }
.sep { width: 2px; height: 2px; border-radius: 99px; background: var(--gray-400); flex: none; }
.chev { color: var(--gray-400); }
.empty-row { padding: 48px var(--gutter); text-align: center; color: var(--gray-400); }
.grp-h { padding: 8px var(--gutter); font-size: 12px; font-weight: 600; color: var(--gray-400); background: rgb(0 0 0 / .1); border-bottom: 1px solid var(--line); border-top: 1px solid var(--line); }
.more-row { padding: 12px var(--gutter) 16px; }

/* Cards */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.card { border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); padding: 16px; display: flex; flex-direction: column; gap: 10px; position: relative; }
.card.linked:hover { background: rgb(255 255 255 / .025); }
.card h3 { font-size: 14px; font-weight: 600; }
.card .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.card .top .grow { flex: 1; min-width: 0; font-size: 13px; }
.card.done h3, .card.done .why { color: var(--gray-400); }
.why { color: var(--gray-300); font-size: 13px; line-height: 20px; }
.rec { display: flex; gap: 8px; font-size: 13px; line-height: 20px; color: var(--gray-300); }
.rec .ic16 { margin-top: 2px; color: var(--gray-400); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.handled { font-size: 14px; line-height: 24px; color: var(--gray-400); }

/* Project team chips */
.tchips { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 16px var(--gutter); border-bottom: 1px solid var(--line); }
.tchip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 10px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--line2); background: var(--hover); font-size: 13px; font-weight: 600; }
.tchip a:hover { text-decoration: underline; }
.tchip .rm { display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 4px; color: var(--gray-400); }
.tchip .rm:hover { background: var(--line2); color: #fff; }
.tchip .rm:focus-visible { outline-offset: 2px; }

/* Switch */
.pref { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; max-width: 640px; }
.pref .lbl { font-weight: 500; }
.switch { position: relative; flex: none; width: 44px; height: 24px; border-radius: 99px; background: var(--gray-700); box-shadow: inset 0 0 0 1px var(--gray-500); }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 99px; background: #fff; transition: transform .1s; }
.switch[aria-checked="true"] { background: var(--indigo-500); box-shadow: none; }
.switch[aria-checked="true"]::after { transform: translateX(20px); }

/* Unavailable page */
.unavail { padding: 96px var(--gutter); text-align: center; }
.unavail h1 { margin-top: 16px; font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -.02em; }
.unavail p { margin-top: 24px; color: var(--gray-400); }
.reply { display: flex; flex-direction: column; gap: 8px; }
textarea, input.field, select.field { width: 100%; background: var(--hover); color: #fff; border: 0; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--gray-500); padding: 6px 12px; font: inherit; font-size: 0.875rem; line-height: 1.5rem; }
input.field, select.field { min-height: 2.25rem; }
textarea:focus-visible, input.field:focus-visible { outline: none; box-shadow: inset 0 0 0 2px var(--indigo-400); }
select:focus-visible, select.field:focus-visible { outline: 2px solid var(--indigo-400); outline-offset: 2px; box-shadow: inset 0 0 0 1px var(--gray-500); }
select.field { width: auto; padding-right: 28px; height: 2.25rem; padding-top: 0; padding-bottom: 0; }
select.field option { background: var(--gray-800); }
textarea::placeholder, input.field::placeholder { color: var(--gray-400); }
.progress { height: 6px; border-radius: 99px; background: var(--line2); overflow: hidden; }
.progress > span { display: block; height: 100%; background: var(--indigo-400); border-radius: 99px; }
.progress.done > span { background: var(--gray-500); }
.prog-line { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--gray-400); }
.prog-line .progress { flex: 1; }
.ph-prog { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 16px; font-size: 12px; line-height: 20px; color: var(--gray-400); }
.ph-prog .prog-line { flex: 0 1 360px; min-width: 200px; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--gray-400); }
.stats b { color: #fff; font-weight: 600; font-size: 14px; }

/* Empty, loading */
.empty { padding: 64px var(--gutter); text-align: center; }
.empty .ic48 { color: var(--gray-400); }
.empty h3 { margin-top: 8px; font-weight: 600; }
.empty p { margin: 4px auto 0; max-width: 380px; color: var(--gray-400); }
.empty.small { padding: 24px 0 32px; }
.skel { display: flex; flex-direction: column; gap: 18px; padding: 8px 0 24px; }
.skel-row { display: flex; align-items: center; gap: 12px; }
.skel-b { height: 14px; border-radius: 4px; background: rgb(255 255 255 / .07); animation: skel 1.6s ease-in-out infinite; }
.skel-c { width: 32px; height: 32px; border-radius: 99px; flex: none; background: rgb(255 255 255 / .07); animation: skel 1.6s ease-in-out infinite; }
@keyframes skel { 50% { opacity: .45; } }

/* Callout */
.callout { display: flex; gap: 12px; border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); background: rgb(255 255 255 / .03); padding: 12px 16px; color: var(--gray-300); }
.callout .ic20 { color: var(--gray-400); margin-top: 2px; flex: none; }
.callout .btn { margin-top: 8px; }

/* Feed */
.feed > li { padding: 16px var(--gutter); border-bottom: 1px solid var(--line); }
.feed > li:last-child { border-bottom: 0; }
.feed .l1 { display: flex; align-items: center; gap: 12px; }
.feed .l1 .actor { font-weight: 600; flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.feed .l1 time { font-size: 12px; color: var(--gray-400); flex: none; }
.feed .l2 { margin-top: 6px; color: var(--gray-400); padding-left: 36px; }
.feed .l2 a { color: var(--gray-300); } .feed .l2 a:hover { color: #fff; text-decoration: underline; }
.feed .kind { font-size: 12px; font-weight: 500; color: var(--gray-400); display: inline-flex; align-items: center; gap: 4px; }
.runlog[hidden] { display: none; }
.runlog { margin: 10px 0 0 36px; border-left: 2px solid var(--line2); padding: 4px 0 4px 16px; display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--gray-300); }
.runlog li { display: flex; gap: 12px; }
.runlog time { color: var(--gray-400); font-variant-numeric: tabular-nums; width: 44px; flex: none; }
.runbtn { margin: 8px 0 0 36px; }
.compact .feed > li, .compact .rows > li { padding-left: 0; padding-right: 0; }

/* Inbox */
.split { display: grid; grid-template-columns: minmax(320px, 440px) 1fr; min-height: calc(100vh - 200px); }
.split .list { border-right: 1px solid var(--line); }
.ibx { display: block; padding: 14px var(--gutter); border-bottom: 1px solid var(--line); position: relative; }
.ibx:hover { background: rgb(255 255 255 / .025); }
.ibx[aria-current="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--indigo-400); }
.ibx:focus-visible { outline-offset: -2px; }
.ibx .l1 { display: flex; align-items: center; gap: 10px; }
.ibx .l1 .who { font-weight: 600; flex: 1; min-width: 0; }
.ibx .l1 time { font-size: 12px; color: var(--gray-400); }
.ibx .what { margin-top: 6px; color: var(--gray-300); }
.ibx.done .what { color: var(--gray-400); }
.detail { padding: 24px var(--gutter); display: flex; flex-direction: column; gap: 20px; max-width: 760px; min-width: 0; }
.detail h2 { font-size: 16px; line-height: 28px; font-weight: 600; }
.dl { display: grid; grid-template-columns: 140px 1fr; gap: 8px 16px; font-size: 13px; }
.dl dt { color: var(--gray-400); }
.dl dd { color: var(--gray-300); min-width: 0; overflow-wrap: anywhere; }
.dl dd a { color: var(--indigo-400); } .dl dd a:hover { color: var(--indigo-300); }
.blk h3 { font-size: 12px; font-weight: 600; color: var(--gray-400); margin-bottom: 4px; }

/* Board */
.board { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(240px, 1fr); gap: 16px; padding: 16px var(--gutter) 32px; overflow-x: auto; }
.bcol { background: rgb(0 0 0 / .1); border-radius: var(--radius-lg); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 160px; }
.bcol h3 { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; }
.bcard { border-radius: var(--radius-md); background: var(--gray-800); box-shadow: inset 0 0 0 1px var(--line2); padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 13px; line-height: 20px; }
.bcard .t { font-weight: 600; }
.bcard .m { display: flex; align-items: center; gap: 6px; color: var(--gray-400); font-size: 12px; flex-wrap: wrap; }

/* Chat */
.chat { display: grid; grid-template-columns: 240px 1fr; height: calc(100vh - 64px - 38px); }
.chat.withthread { grid-template-columns: 240px 1fr 340px; }
.chlist { border-right: 1px solid var(--line); background: rgb(0 0 0 / .1); overflow-y: auto; padding: 16px 12px; }
.chlist h2 { font-size: 12px; font-weight: 600; color: var(--gray-400); padding: 8px 8px 4px; }
.chlist a { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-md); color: var(--gray-400); font-weight: 500; }
.chlist a:hover { background: var(--hover); color: #fff; }
.chlist a[aria-current="page"] { background: var(--hover); color: #fff; }

.chmain { display: flex; flex-direction: column; min-width: 0; }
.chhead { display: flex; align-items: center; gap: 12px; padding: 14px 24px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.chhead h1 { font-size: 16px; font-weight: 600; }
.msgs { flex: 1; overflow-y: auto; padding: 16px 24px; display: flex; flex-direction: column; gap: 18px; }
.msg { display: flex; gap: 12px; }
.msg .body { min-width: 0; flex: 1; }
.msg .hd { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.msg .hd b { font-weight: 600; }
.msg .hd span { font-size: 12px; color: var(--gray-400); }
.msg .tx { color: var(--gray-300); }
.thr { margin-top: 4px; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--indigo-400); }
.thr:hover { color: var(--indigo-300); }
.ask { margin-top: 8px; border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; max-width: 560px; }
.ask .q { font-weight: 600; }
.compose { border-top: 1px solid var(--line); padding: 12px 24px; display: flex; gap: 8px; }
.compose input { flex: 1; }
.readnote { display: flex; align-items: center; gap: 8px; margin: 12px 24px 0; padding: 8px 12px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 1px var(--line2); background: rgb(255 255 255 / .03); color: var(--gray-300); font-size: 13px; }
.readnote .ic16 { flex: none; }
.readfoot { border-top: 1px solid var(--line); padding: 14px 24px; color: var(--gray-400); font-size: 13px; display: flex; align-items: center; gap: 8px; }
.thread { border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }

/* Teams / org chart */
.tree, .tree ul { list-style: none; }
.tree ul { margin-left: 22px; padding-left: 26px; border-left: 1px solid var(--line2); }
.tree li { position: relative; padding: 6px 0; }
.tree ul > li::before { content: ""; position: absolute; left: -26px; top: 30px; width: 22px; border-top: 1px solid var(--line2); }
.node { display: inline-flex; align-items: center; gap: 12px; padding: 8px 14px 8px 8px; border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); min-width: 280px; max-width: 100%; }
.node > span { min-width: 0; }
.node:hover { background: var(--hover); }
.node .nm { font-weight: 600; }
.node .rl { display: block; font-size: 12px; line-height: 18px; color: var(--gray-400); }
.node.owner { background: rgb(255 255 255 / .03); }
.owner-wrap { padding: 24px var(--gutter) 8px; }
.ocard { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); background: rgb(255 255 255 / .03); max-width: 640px; }
.ocard .nm { font-weight: 600; }
.ocard .rl { display: block; font-size: 12px; line-height: 18px; color: var(--gray-400); }

/* Profile */
.prof { display: flex; gap: 16px; align-items: flex-start; padding: 24px var(--gutter); background: rgb(0 0 0 / .1); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.prof .grow { flex: 1; min-width: 240px; }
.prof h1 { font-size: 1rem; line-height: 1.75rem; font-weight: 600; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.prof h1 .role { font-size: 0.875rem; font-weight: 400; color: var(--gray-400); }
.prof .meta { margin-top: 2px; }
.prof .now { margin-top: 10px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; color: var(--gray-300); }
.grid2 { display: grid; grid-template-columns: 1fr 340px; gap: 0; }
.grid2 > aside { border-left: 1px solid var(--line); padding: 24px; min-width: 0; }
.setup h2 { font-size: 0.875rem; font-weight: 600; margin-bottom: 12px; }
.setup .dl { grid-template-columns: 110px 1fr; }
.journal { max-width: 820px; display: flex; flex-direction: column; gap: 16px; }
.journal article { border-left: 2px solid var(--line2); padding-left: 16px; }
.journal h2, .journal h3 { font-size: 0.875rem; line-height: 1.375rem; font-weight: 600; color: var(--gray-300); }
.journal p, .journal li { color: var(--gray-300); font-size: 0.8125rem; line-height: 1.375rem; }
.journal ul { list-style: disc; padding-left: 18px; margin-top: 4px; }

/* Settings */
.settings { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 102px); }
.settings > div { min-width: 0; }
.subnav { border-right: 1px solid var(--line); padding: 24px 16px; display: flex; flex-direction: column; gap: 2px; }
.subnav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: var(--radius-md); color: var(--gray-400); font-weight: 600; white-space: nowrap; }
.subnav a:hover { background: var(--hover); color: #fff; }
.subnav a[aria-current="page"] { background: var(--hover); color: #fff; }
.subnav .note { margin-left: auto; font-size: 0.75rem; font-weight: 500; color: var(--gray-400); }
table.tbl { width: 100%; border-collapse: collapse; text-align: left; }
.tbl th { font-weight: 600; font-size: 0.8125rem; padding: 8px 12px; border-bottom: 1px solid var(--line2); }
.tbl td { padding: 14px 12px; border-bottom: 1px solid var(--line); color: var(--gray-300); font-size: 0.8125rem; }
.tbl th:first-child, .tbl td:first-child { padding-left: var(--gutter); }
.tbl td a.nm { color: #fff; font-weight: 600; display: inline-flex; align-items: center; gap: 10px; }
.tbl td a.nm:hover { text-decoration: underline; }
.only-sm { display: none; }
.form { max-width: 640px; display: flex; flex-direction: column; gap: 20px; padding: 24px var(--gutter); }
.form label { display: block; font-weight: 500; margin-bottom: 6px; }
.form .help { margin-top: 6px; font-size: 0.75rem; color: var(--gray-400); }
.form-danger-row { margin-top: 4px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }

/* ── Agent Profile + Orb + Context + Sessions ─────────────────────────── */
.agent-shell { display: grid; grid-template-columns: minmax(0, 1fr) 340px; flex: 1 1 auto; min-height: 0; }
.agent-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.agent-rail { background: rgb(0 0 0 / .08); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-width: 0; }

.orb-section { display: flex; flex-direction: column; align-items: center; padding: 20px 20px 18px; border-bottom: 1px solid var(--line); background: radial-gradient(circle at 50% 44%, rgba(97, 95, 255, 0.13), transparent 70%); }
.orb-stage { position: relative; width: 200px; height: 200px; flex-shrink: 0; }
#c-orb-canvas { display: block; width: 100%; height: 100%; pointer-events: none; user-select: none; }
.telemetry-strip { display: inline-flex; align-items: center; gap: 8px; margin-top: 8px; padding: 4px 12px; border-radius: 999px; background: var(--hover); box-shadow: inset 0 0 0 1px var(--line2); font-size: 0.75rem; line-height: 1.125rem; max-width: 100%; }
.c-dot { width: 7px; height: 7px; border-radius: 99px; background: var(--indigo-400); flex-shrink: 0; animation: soft-pulse 2.2s ease-in-out infinite; }
[data-cstate="thinking"] .c-dot, [data-cstate="working"] .c-dot { background: var(--sky-400); }
[data-cstate="streaming"] .c-dot { background: var(--green-400); animation: none; }
[data-cstate="compacting"] .c-dot { background: var(--amber-400); }
[data-cstate="paused"] .c-dot, [data-cstate="unplaced"] .c-dot, [data-cstate="offline"] .c-dot, [data-cstate="asleep"] .c-dot, [data-cstate="unavailable"] .c-dot { background: var(--gray-400); animation: none; }
.c-state-txt { font-weight: 600; color: #fff; text-transform: capitalize; }
.c-detail-txt { color: var(--gray-300); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.c-rail-sec { padding: 16px 20px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; }
.c-rail-sec:last-child { border-bottom: 0; }
.c-sec-hd { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.c-lbl { font-size: 0.75rem; line-height: 1.125rem; font-weight: 600; color: var(--gray-400); }
.c-now-title { font-size: 0.875rem; font-weight: 600; color: #fff; line-height: 1.25rem; }
.c-now-title.idle { color: var(--gray-400); font-weight: 400; }
.c-now-sub { font-size: 0.75rem; line-height: 1.125rem; color: var(--gray-400); margin-top: 2px; }
.c-queue { padding-top: 10px; border-top: 1px solid var(--line); }
.c-queue-list { margin-top: 6px; display: flex; flex-direction: column; gap: 6px; font-size: 0.75rem; line-height: 1.125rem; }
.c-queue-list li { display: flex; gap: 8px; align-items: baseline; }
.c-queue-who { font-weight: 600; color: var(--gray-300); flex-shrink: 0; }
.c-queue-tx { color: var(--gray-400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.c-ctx-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.c-ctx-big { font-size: 1.375rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; color: #fff; }
.c-meter { position: relative; height: 6px; border-radius: 99px; background: var(--line2); }
.c-meter-fill { height: 100%; border-radius: 99px; background: var(--sky-400); transition: width .4s ease, background-color .25s ease; }
.c-meter[data-warn="true"] .c-meter-fill { background: var(--amber-400); }
.c-meter-mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: rgb(255 255 255 / .55); }
.c-chart { position: relative; padding: 8px 10px 6px; border-radius: var(--radius-md); background: rgb(0 0 0 / .16); box-shadow: inset 0 0 0 1px var(--line); }
.c-chart svg { display: block; width: 100%; height: 78px; overflow: visible; }
.c-chart figcaption { display: flex; align-items: center; gap: 6px; margin-top: 4px; font-size: 0.75rem; line-height: 1.125rem; color: var(--gray-400); }
.c-key-line { width: 12px; border-top: 1.5px dashed var(--amber-400); }
.c-bd-row { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(36px, 1fr) auto; align-items: center; gap: 8px; font-size: 0.75rem; line-height: 1.25; }
.c-bd-bar { height: 5px; border-radius: 99px; background: var(--line2); overflow: hidden; }
.c-bd-bar i { display: block; height: 100%; background: var(--sky-400); border-radius: 99px; transition: width .4s ease; }

/* Sessions (Console) inside Agent Profile */
.c-feed-pane { padding: 20px var(--gutter) 28px; display: flex; flex-direction: column; gap: 14px; }
.c-entry { padding: 14px 16px; border-radius: var(--radius-lg); background: rgb(0 0 0 / .14); box-shadow: inset 0 0 0 1px var(--line2); display: flex; flex-direction: column; gap: 10px; }
.c-entry[data-from="you"] { background: rgb(97 95 255 / .08); box-shadow: inset 0 0 0 1px rgb(124 134 255 / .28); }
.c-entry-hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.c-entry-who { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 0.8125rem; }
.c-entry-prompt { font-weight: 500; color: #fff; }
.c-work-box { border-radius: var(--radius-md); background: rgb(0 0 0 / .2); box-shadow: inset 0 0 0 1px var(--line); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem; }
.c-work-box summary { min-height: 2.25rem; padding: 6px 10px; cursor: pointer; color: var(--gray-300); list-style: none; display: flex; align-items: center; gap: 6px; }
.c-work-box summary::-webkit-details-marker { display: none; }
.c-work-box summary::before { content: "▸"; color: var(--indigo-400); display: inline-block; transition: transform .12s; }
.c-work-box[open] summary::before { transform: rotate(90deg); }
.c-steps { padding: 4px 10px 8px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 4px; }
.c-step { display: grid; grid-template-columns: auto auto minmax(0, 1fr) auto; align-items: center; gap: 8px; }
.c-step-dot { width: 5px; height: 5px; border-radius: 99px; background: var(--sky-400); }
.c-step-tool { color: var(--sky-300); font-weight: 600; }
.c-step-arg { color: var(--gray-400); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.c-step-tok { color: var(--gray-400); font-variant-numeric: tabular-nums; }
.c-reply { color: var(--gray-300); white-space: pre-wrap; line-height: 1.6; max-width: 68ch; }
.c-caret-blink { display: inline-block; width: 7px; height: 1.1em; margin-left: 2px; vertical-align: -0.15em; background: var(--sky-400); animation: caret-blink .85s infinite; }
@keyframes caret-blink { 0%,49% { opacity: 1; } 50%,100% { opacity: 0; } }

.c-shell-wrap { padding: 20px var(--gutter) 28px; }
.c-shell-pane { display: flex; flex-direction: column; min-height: 360px; max-height: 560px; border-radius: var(--radius-lg); overflow: hidden; background: #0c121e; box-shadow: inset 0 0 0 1px var(--line2); }
.c-shell-hd { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 14px; background: rgb(255 255 255 / .03); border-bottom: 1px solid var(--line); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.75rem; color: var(--gray-400); flex-wrap: wrap; }
.c-shell-body { flex: 1 1 auto; overflow-y: auto; padding: 14px 16px 20px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.78125rem; line-height: 1.7; white-space: pre-wrap; }
.c-shell-c { color: var(--gray-400); }
.c-shell-q { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line2); color: var(--gray-300); }
.c-shell-q:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
.c-shell-cmd { color: #fff; }
.c-shell-prompt { color: var(--sky-400); font-weight: 600; }
.c-shell-out { padding-left: 16px; color: var(--gray-300); }

.c-composer { padding: 14px var(--gutter) 20px; border-top: 1px solid var(--line); background: rgb(0 0 0 / .08); }
.c-composer-in { display: flex; flex-direction: column; gap: 10px; }
.c-chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.c-chip-btn { min-height: 1.875rem; padding: 4px 10px; border-radius: var(--radius-md); background: var(--hover); box-shadow: inset 0 0 0 1px var(--line2); font-size: 0.75rem; color: var(--gray-300); text-align: left; }
.c-chip-btn:hover { background: var(--line2); color: #fff; }
.c-chip-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.c-form { display: flex; gap: 8px; }
.c-form input { flex: 1; min-width: 0; }

/* Knowledge doc preview */
.k-doc { margin-top: 10px; padding: 12px 14px; border-radius: var(--radius-md); background: rgb(0 0 0 / .16); box-shadow: inset 0 0 0 1px var(--line); color: var(--gray-300); font-size: 0.8125rem; line-height: 1.6; }
.k-doc h3, .k-doc h4 { font-size: 0.8125rem; font-weight: 600; color: #fff; margin-bottom: 6px; }
.k-doc ul { list-style: disc; padding-left: 18px; margin-top: 4px; }

/* Overlays */
.overlay { position: fixed; inset: 0; z-index: 90; background: rgba(4, 7, 16, .58); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; z-index: 100; width: min(680px, 100%); background: rgba(12, 19, 37, .74); backdrop-filter: blur(28px) saturate(175%); -webkit-backdrop-filter: blur(28px) saturate(175%); box-shadow: inset 1px 0 0 rgba(255, 255, 255, .13), -20px 0 56px rgba(0, 0, 0, .58); display: flex; flex-direction: column; }
.sheet header { display: flex; align-items: center; justify-content: space-between; padding: 20px 24px; border-bottom: 1px solid var(--line); }
.sheet header h2 { font-size: 1rem; font-weight: 600; }
.sheet .body { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
.sheet h3 { font-size: 0.875rem; font-weight: 600; }
.sheet table { width: 100%; border-collapse: collapse; font-size: 0.8125rem; }
.sheet th, .sheet td { text-align: left; vertical-align: top; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--line); }
.sheet td { color: var(--gray-300); }
.sheet th { color: #fff; }
.toasts { position: fixed; right: 24px; bottom: 24px; z-index: 120; display: flex; flex-direction: column; gap: 8px; }
.toast { display: flex; gap: 12px; align-items: center; max-width: 420px; border-radius: 11px; background: rgba(11, 20, 38, .88); backdrop-filter: blur(24px) saturate(170%); -webkit-backdrop-filter: blur(24px) saturate(170%); box-shadow: inset 0 1px 0 rgba(186, 222, 255, .18), inset 0 0 0 1px rgba(186, 222, 255, .14), 0 16px 40px rgba(0, 0, 0, .56); padding: 12px 15px; }
.toast .ic { color: #34D399; width: 18px; height: 18px; }
.toast p { font-weight: 500; font-size: 0.84375rem; color: #F1F5F9; flex: 1; }
.toast-undo { padding: 4px 10px; border-radius: 7px; font-size: 0.78125rem; font-weight: 600; color: #7DD3FC; background: rgba(56, 189, 248, .14); box-shadow: inset 0 0 0 1px rgba(125, 211, 252, .32); flex: none; transition: background-color .14s ease, color .14s ease; }
.toast-undo:hover { background: rgba(56, 189, 248, .28); color: #FFFFFF; }
.sheet.dialog { top: 50%; left: 50%; right: auto; bottom: auto; transform: translate(-50%, -50%); width: min(448px, calc(100% - 32px)); border-radius: var(--radius-lg); box-shadow: inset 0 0 0 1px var(--line2); padding: 24px; gap: 0; }
.dialog h2 { font-size: 1rem; line-height: 1.75rem; font-weight: 600; }
.dialog .dsc { margin-top: 8px; color: var(--gray-400); }
.dialog .dfoot { margin-top: 24px; display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap; }
.dialog fieldset { border: 0; margin: 16px 0 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.dialog label.opt { display: flex; align-items: center; gap: 10px; }

/* Responsive */
@media (max-width: 1279px) { .cols2, .grid2 { grid-template-columns: 1fr; } .cols2 > .section + .section { border-left: 0; } .grid2 > aside { border-left: 0; border-top: 1px solid var(--line); } .chat.withthread { grid-template-columns: 220px 1fr; } .chat.withthread .thread { position: fixed; right: 0; top: 0; bottom: 0; width: min(360px, 100%); z-index: 80; background: var(--gray-800); } }
@media (max-width: 1120px) {
  .agent-shell { grid-template-columns: 1fr; flex: none; min-height: auto; }
  .agent-main { min-height: auto; }
  .agent-rail { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 959px) {

  .split .list { border-right: 0; }
  .split .detail { display: none; }
  .subnav { flex-direction: row; gap: 24px; overflow-x: auto; overflow-y: hidden; padding: 0 var(--gutter); border-right: 0; border-bottom: 1px solid var(--line2); }
  .subnav a { flex: none; border-radius: 0; padding: 0.875rem 0.25rem; box-shadow: inset 0 -2px 0 transparent; white-space: nowrap; }
  .subnav a:hover { background: none; box-shadow: inset 0 -2px 0 rgb(255 255 255 / .2); }
  .subnav a[aria-current="page"] { background: none; box-shadow: inset 0 -2px 0 var(--indigo-400); }
  .subnav a:focus-visible { outline-offset: -2px; }

}
@media (min-width: 640px) and (max-width: 959px) {

  .logo .name { display: none; }
  .nav-label, .subwrap, .nav-fold-btn { display: none; }
  .foot { margin: 0 -8px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 8px 0; }
