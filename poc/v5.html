      for (let j = i + 1; j < linkable.length && links < 3; j++) {
        const b = linkable[j];
        const dx = b.sx - a.sx, dy = b.sy - a.sy, d2 = dx * dx + dy * dy;
        if (d2 <= 16 || d2 >= maxDSq) continue;
        const str = Math.min(1, (a.act + b.act) * 0.46) * (1 - Math.sqrt(d2) / maxD);
        ctx.strokeStyle = `rgba(${mix(125, 253, warmth)},${mix(211, 186, warmth)},${mix(252, 116, warmth)},${(str * 0.46).toFixed(3)})`;
        ctx.lineWidth = 0.75 + str * 1.1;
        ctx.beginPath(); ctx.moveTo(a.sx, a.sy); ctx.lineTo(b.sx, b.sy); ctx.stroke();
        links++;
      }
    }

    for (const p of sorted) {
      const front = clamp01((1.1 - p.wz) / 2.2);
      const act = Math.min(1, p.act);
      const r = mix(Math.round(28 + front * 44 + act * 86), 249, warmth);
      const g = mix(Math.round(92 + front * 104 + act * 52), 115, warmth);
      const b = mix(Math.round(205 + front * 48 + act * 2), 22, warmth);
      const alpha = Math.min(0.98, (p.core ? 0.26 : 0.30) + front * 0.52 + act * 0.22);

      if (act > 0.34 && front > 0.32) {
        const bloomR = p.sr * (2.3 + act * 1.15);
        const bloomA = Math.min(0.42, (act - 0.3) * front * 0.38);
        const bloom = ctx.createRadialGradient(p.sx, p.sy, p.sr * 0.15, p.sx, p.sy, bloomR);
        bloom.addColorStop(0, `rgba(${r},${g},${b},${bloomA.toFixed(3)})`);
        bloom.addColorStop(0.55, `rgba(${r},${g},${b},${(bloomA * 0.35).toFixed(3)})`);
        bloom.addColorStop(1, `rgba(${r},${g},${b},0)`);
        ctx.fillStyle = bloom;
        ctx.beginPath(); ctx.arc(p.sx, p.sy, bloomR, 0, TAU); ctx.fill();
      }

      ctx.fillStyle = `rgba(${r},${g},${b},${alpha.toFixed(3)})`;
      ctx.beginPath(); ctx.arc(p.sx, p.sy, p.sr, 0, TAU); ctx.fill();

      if (!p.core && front > 0.68 && act > 0.62) {
        ctx.fillStyle = `rgba(224,242,254,${((act - 0.58) * 0.45).toFixed(3)})`;
        ctx.beginPath(); ctx.arc(p.sx - p.sr * 0.24, p.sy - p.sr * 0.24, p.sr * 0.36, 0, TAU); ctx.fill();
      }
    }
  }
}

function agentSessionAvailability(aid) {
  const m = M[aid];
  if (!m) return { active: false, state: "unavailable", title: "Unknown agent", reason: "Agent record not found." };
  if (m.offboarded) return { active: false, state: "paused", title: "Offboarded", reason: "This agent has been offboarded. Journals, memory, and records remain read-only." };
  if (!m.setup || !m.setup.office) return { active: false, state: "unplaced", title: "Not placed in an office", reason: "Assign an office in Settings before starting a session." };
  const office = OFFICES[m.setup.office];
  if (office && office.status === "Offline") return { active: false, state: "offline", title: `${office.name} is offline`, reason: "Requests wait until the office is back online." };
  if (m.paused) return { active: false, state: "paused", title: "Paused by owner", reason: "Resume this agent before sending prompts or simulating requests." };
  if (m.live === "asleep" && !m.task) return { active: false, state: "asleep", title: "Asleep", reason: m.setup.how || "Wakes when called." };
  return { active: true, state: null, title: "", reason: "" };
}

class ConsoleSession {
  constructor(agentId) {
    this.agentId = agentId;
    const m = M[agentId];
    this.limit = 200000;
    this.compactAt = 0.95;
    const unplaced = !m.setup || !m.setup.office;
    const office = m.setup && m.setup.office ? OFFICES[m.setup.office] : null;
    const officeOffline = !!(office && office.status === "Offline");
    const dormant = unplaced || officeOffline || (m.live === "asleep" && !m.task);
    const requester = (m.mgr && m.mgr !== "you") ? m.mgr : (agentId === "ada" ? "maya" : "ada");

    if (dormant) {
      this.parts = { system: 0, summary: 0, conversation: 0, tools: 0 };
      this.stats = { requests: 0, toolCalls: 0, compactions: 0 };
      this.status = unplaced
        ? { state: "unplaced", detail: "no office assigned" }
        : officeOffline
          ? { state: "offline", detail: `${office.name} offline` }
          : { state: "asleep", detail: (m.setup && m.setup.how) || "wakes when called" };
      this.current = null;
      this.queue = [];
      this.history = [];
      this.entries = [];
      this.shellLines = [
        { cls: "c-shell-c", txt: unplaced ? `# ${m.name} is not placed in an office yet` : officeOffline ? `# ${office.name} is offline` : `# ${m.name} is asleep` }
      ];
    } else {
      this.parts = { system: 13800, summary: 7400, conversation: 9600, tools: 76400 };
      this.stats = { requests: 9, toolCalls: 17, compactions: 1 };
      this.status = { state: m.paused ? "paused" : "working", detail: m.paused ? "paused by owner" : (m.task || "awaiting requests") };
      this.current = (!m.paused && m.task) ? { id: 101, from: m.mgr || "you", kind: "task", text: m.task } : null;
      this.queue = m.paused ? [] : [
        { id: 102, from: "tomas", kind: "task", text: "Verify branch findings and update test assertions" },
        { id: 103, from: "maya", kind: "chat", text: "Confirm readiness for the v1.0 release checklist" }
      ];
      this.history = [
        { used: 13800, label: "Session start" },
        { used: 42100, label: "read_file services/core.rs" },
        { used: 78600, label: "run_tests workspace" },
        { used: 148200, label: "git_diff main..HEAD" },
        { used: 33400, label: "Auto-compaction" },
        { used: 68900, label: "search_code policy_check" },
        { used: this.used, label: "Current working context" }
      ];
      this.entries = [
        {
          id: "e1", from: requester, kind: "task", time: "18m ago",
          text: m.task || "Audit workspace contract invariants and report status",
          steps: [
            { tool: "search_code", arg: `"${m.proj || "agency"}"`, tokens: 6400 },
            { tool: "read_file", arg: `${m.setup.home}/RULES.md`, tokens: 8200 },
            { tool: "run_tests", arg: "--workspace --quiet", tokens: 12900 }
          ],
          reply: `${m.name} (${m.role}) is actively tracking ${m.proj ? P[m.proj].name : "assigned organization work"}.\n\nAll local assertions pass and the branch is synced with HQ. Ask a question below or queue a task to see live execution.`
        },
        {
          id: "e2", from: "you", kind: "chat", time: "4m ago",
          text: "Give me a quick status check before standup.",
          steps: [],
          reply: `Current focus: ${m.task || "Standing by for incoming tasks"}.\n\nNo blockers on my side—context window is healthy at ${Math.round((this.used / this.limit) * 100)}%.`
        }
      ];
      this.shellLines = [
        { cls: "c-shell-c", txt: `# session connected · ${m.name} (${m.setup.runtime} · ${m.setup.model})` },
        { cls: "c-shell-cmd", txt: `cd ~/${m.setup.home} && git status -sb` },
        { cls: "c-shell-out", txt: "## main...origin/main [ahead 1]" },
        { cls: "c-shell-cmd", txt: "rg -n \"contract_version\" crates/" },
        { cls: "c-shell-out", txt: "14 matches across 4 files" }
      ];
    }
    this.busy = false;
    this.compacting = false;
    this._aborted = false;
    this.orb = null;
    this.onChange = null;
  }
  get used() { return this.parts.system + this.parts.summary + this.parts.conversation + this.parts.tools; }
  get ratio() { return this.used / this.limit; }
  notify() { if (this.onChange) this.onChange(); }

  enqueue(from, kind, text) {
    const avail = agentSessionAvailability(this.agentId);
    if (!avail.active) return false;
    const item = { id: Date.now(), from, kind, text };
    this.queue.push(item);
    if (this.orb) this.orb.pulse(0.7);
    this.notify();
    this._drain();
    return true;
  }

  stopRun() {
    this._aborted = true;
    this.queue = [];
    this.current = null;
    this.busy = false;
    this.compacting = false;
    const streamingEntry = this.entries.find((e) => e.streaming);
    if (streamingEntry) {
      streamingEntry.streaming = false;
      streamingEntry.reply = (streamingEntry.reply ? streamingEntry.reply + "\n\n" : "") + "[Stopped by owner]";
    }
    this.shellLines.push({ cls: "c-shell-c", txt: "# run stopped by owner" });
    const avail = agentSessionAvailability(this.agentId);
    this.status = avail.active
      ? { state: "idle", detail: "stopped by owner" }
      : { state: avail.state, detail: avail.title.toLowerCase() };
    if (this.orb) this.orb.setState(avail.active ? "idle" : "paused");
    this.notify();
  }

  async compactNow() {
    const avail = agentSessionAvailability(this.agentId);
    if (!avail.active || this.busy) return false;
    this.busy = true;
    this.compacting = true;
    this._aborted = false;
    const before = this.used;
    this.status = { state: "compacting", detail: "summarizing history" };
    if (this.orb) { this.orb.setState("compacting"); this.orb.pulse(1.2); }
    this.shellLines.push({ cls: "c-shell-c", txt: `# compacting context window (${fmtTok(before)} tokens)…` });
    this.notify();
    try {
      await sleep(1200);
      if (this._aborted || !agentSessionAvailability(this.agentId).active) return false;
      this.parts.system = Math.max(this.parts.system, 13800);
      this.parts.summary = 7200;
      this.parts.conversation = 2800;
      this.parts.tools = 8600;
      this.stats.compactions++;
      this.history.push({ used: this.used, label: "Manual compaction" });
      this.shellLines.push({ cls: "c-shell-c", txt: `# context compacted · ${fmtTok(before)} → ${fmtTok(this.used)} tokens` });
      if (this.orb) { this.orb.setContext(this.ratio); this.orb.setState("idle"); }
      this.status = { state: "idle", detail: "awaiting requests" };
    } finally {
      this.compacting = false;
      this.busy = false;
      this.notify();
    }
    return true;
  }

  async _drain() {
    if (this.busy) return;
    this.busy = true;
    this._aborted = false;
    try {
      while (this.queue.length) {
        if (this._aborted || !agentSessionAvailability(this.agentId).active) break;
        const next = this.queue.shift();
        await this._run(next);
      }
    } finally {
      this.busy = false;
      this.current = null;
      const avail = agentSessionAvailability(this.agentId);
      if (!this._aborted) {
        this.status = avail.active
          ? { state: "idle", detail: "awaiting requests" }
          : { state: avail.state, detail: avail.title.toLowerCase() };
        if (this.orb) this.orb.setState(avail.active ? "idle" : "paused");
      }
      this.notify();
    }
  }

  async _run(item) {
    if (this._aborted) return;
    this.current = item;
    if (this.parts.system === 0) this.parts.system = 13800;
    const entry = { id: "e" + item.id, from: item.from, kind: item.kind, time: "just now", text: item.text, steps: [], reply: "", streaming: true };
    this.entries.push(entry);
    this.shellLines.push({ cls: "c-shell-c c-shell-q", txt: `# [ORD-${item.id % 1000}] ${item.kind} from ${M[item.from] ? M[item.from].name : item.from}: ${item.text}` });
    this.notify();

    const plan = this._plan(item.text);
    for (const st of plan.steps) {
      if (this._aborted) return;
      this.status = { state: "working", detail: st.tool };
      if (this.orb) { this.orb.setState("working"); this.orb.pulse(0.75); }
      this.shellLines.push({ cls: "c-shell-cmd", txt: st.cmd, running: true });
      this.notify();
      await sleep(750);
      this.shellLines[this.shellLines.length - 1].running = false;
      if (this._aborted) return;
      this.shellLines.push({ cls: "c-shell-out", txt: st.out });
      entry.steps.push({ tool: st.tool, arg: st.arg, tokens: st.tokens });
      this.parts.tools += st.tokens;
      this.stats.toolCalls++;
      this.history.push({ used: this.used, label: `${st.tool} ${st.arg}` });
      if (this.orb) this.orb.setContext(this.ratio);
      this.notify();
    }

    this.status = { state: "streaming", detail: "writing reply" };
    if (this.orb) this.orb.setState("streaming");
    for (const ch of plan.reply) {
      if (this._aborted) return;
      entry.reply += ch;
      if (this.orb) this.orb.onToken(ch);
      this.notify();
      await sleep(/[.!?]/.test(ch) ? 45 : 14);
    }
    entry.streaming = false;
    this.parts.conversation += Math.max(40, Math.round(plan.reply.length / 4));
    this.stats.requests++;
    this.history.push({ used: this.used, label: "Agent reply" });
    this.shellLines.push({ cls: "c-shell-c", txt: "# reply sent" });
    if (this.orb) this.orb.setContext(this.ratio);
    this.notify();
  }

  _plan(text) {
    const m = M[this.agentId];
    if (/working on|status|doing/i.test(text)) {
      return {
        steps: [
          { tool: "read_file", arg: `${m.setup.home}/backlog.json`, cmd: `cat ~/${m.setup.home}/backlog.json`, out: "2 queued items, 1 active slice", tokens: 3200 }
        ],
        reply: `Right now I am focused on ${m.task || "pending organization items"}.\n\nI just checked my local backlog: ${this.queue.length} follow-up items are queued and all tests on the working tree are green.`
      };
    }
    if (/custody|lock|lease/i.test(text)) {
      return {
        steps: [
          { tool: "search_code", arg: '"custody_lock" crates/', cmd: 'rg -n "custody_lock" crates/', out: "8 matches in crates/office-sync/src/lock.rs", tokens: 4900 },
          { tool: "run_tests", arg: "office-sync::lock", cmd: "cargo test -p office-sync lock", out: "14 passed, 0 failed (1.8s)", tokens: 7400 }
        ],
        reply: "The lease-based lock automatically expires after 15s if a satellite drops offline, preventing split-brain writes.\n\nPer-office locks avoid lease renewal overhead but require manual recovery on crash. All 14 lock tests pass."
      };
    }
    const kw = (text.match(/[A-Za-z]{4,}/g) || ["workspace"]).sort((a, b) => b.length - a.length)[0];
    return {
      steps: [
        { tool: "search_code", arg: `"${kw}"`, cmd: `rg -n "${kw}" .`, out: "6 matching references found", tokens: 4100 },
        { tool: "read_file", arg: `${m.setup.home}/journal.md`, cmd: `tail -n 20 ~/${m.setup.home}/journal.md`, out: "20 lines read", tokens: 3600 }
      ],
      reply: `Checked "${kw}" across ${m.proj ? P[m.proj].name : "the workspace"}.\n\nEverything aligns with our current milestone constraints. Let me know if you want me to open a work item or push a patch.`
    };
  }
}

const consoleSessions = {};
function getConsoleSession(agentId) {
  if (!consoleSessions[agentId]) consoleSessions[agentId] = new ConsoleSession(agentId);
  return consoleSessions[agentId];
}

let activeOrb = null;
let activeSession = null;

function stopAgentOrb() {
  if (activeOrb) {
    if (activeOrb._ro) { activeOrb._ro.disconnect(); activeOrb._ro = null; }
    activeOrb.stop();
    activeOrb = null;
  }
  if (activeSession) { activeSession.onChange = null; activeSession.orb = null; activeSession = null; }
}

      <div>
        <div id="c-now-title" class="c-now-title${curNow ? "" : " idle"}">${curNow ? esc(curNow.text) : (avail.active ? "Nothing in progress" : esc(avail.title))}</div>
        <div id="c-now-sub" class="c-now-sub">${curNow ? "Requested by " + esc(M[curNow.from] ? M[curNow.from].name : curNow.from) : (avail.active ? "Waiting for the next request" : esc(avail.reason))}</div>

        <h3 class="c-lbl" style="display:block">Up next</h3>
        <ol id="c-queue-list" class="c-queue-list"></ol>
      </div>
    </div>
    <div class="c-rail-sec">
      <div class="c-sec-hd">
        <h2 class="c-lbl">Context window</h2>

        <span class="c-ctx-big" id="c-ctx-pct">${pct}%</span>
        <span class="muted mono" id="c-ctx-tok">${fmtTok(usedVal)} / ${fmtTok(sess.limit)}</span>

      </figure>

      <div class="muted" style="font-size:0.75rem" id="c-stats"></div>

  </aside>`;
}

    const recentHtml = `<ul class="rows" role="list" style="margin:0 calc(var(--gutter) * -1)">

    sessionsRoot.innerHTML = `

          <button type="button" role="tab" id="ctab-chat" data-cview="chat" aria-selected="${S.consoleView === "chat"}" tabindex="${S.consoleView === "chat" ? 0 : -1}">Session prompt</button>
          <button type="button" role="tab" id="ctab-shell" data-cview="shell" aria-selected="${S.consoleView === "shell"}" tabindex="${S.consoleView === "shell" ? 0 : -1}">Shell</button>
        </div>
        <span style="flex:1"></span>
        <div id="c-act-filters" style="display:flex;flex-wrap:wrap;gap:8px;align-items:center" ${S.consoleView !== "activity" ? "hidden" : ""}>
          <div class="seg" id="c-scope-seg" role="group" aria-label="Filter requests">
            <button type="button" data-cscope="all" aria-pressed="${S.consoleScope === "all"}">Everyone</button>
            <button type="button" data-cscope="others" aria-pressed="${S.consoleScope === "others"}">Others only</button>
          </div>
          <div class="seg" id="c-tools-seg" role="group" aria-label="Tool calls">
            <button type="button" data-ctools="on" aria-pressed="${S.consoleTools}">Tool calls</button>
            <button type="button" data-ctools="off" aria-pressed="${!S.consoleTools}">Compact</button>
          </div>
          <button type="button" class="btn outline" id="c-sim-btn" ${avail.active ? "" : "disabled"}>${ic("play", "ic16")}Simulate request</button>
        </div>
      </div>
      <div class="c-feed-pane" id="c-feed-pane" ${S.consoleView === "shell" ? "hidden" : ""}>
        ${statusNotice}
        <div class="c-sec-hd" style="padding-bottom:2px">
          <span class="muted" style="font-size:0.75rem">${avail.active ? `Live session <span class="mono">s-0941</span> · <code>agentic-org attach ${esc(aid)}</code> · ${esc(m.setup.runtime)} (${esc(m.setup.model)})` : `Session offline · <code>agentic-org status ${esc(aid)}</code>`}</span>
        </div>
        <div id="c-feed-list" style="display:flex;flex-direction:column;gap:12px"></div>
      </div>
      <div class="c-shell-wrap" id="c-shell-pane" ${S.consoleView !== "shell" ? "hidden" : ""}>
        ${statusNotice ? `<div style="margin-bottom:14px">${statusNotice}</div>` : ""}
        <div class="c-shell-pane">
          <div class="c-shell-hd">
            <span>${esc(aid)}@${esc(m.setup.office || "unplaced")}: ~/${esc(m.setup.home)}</span>
            <div style="display:flex;gap:8px">
              <button type="button" class="btn outline xs" id="c-shell-copy">Copy log</button>

          </div>
          <form class="c-form" id="c-prompt-form">

          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:0.75rem;color:var(--gray-400)">

  const orb = new NeuralOrb(canvas);
  orb.setState(avail.active ? (sess.busy ? sess.status.state : sess.status.state) : "paused");
  orb.setContext(sess.ratio, true);
  orb.start();
  if (avail.active) orb.pulse(0.7);
  requestAnimationFrame(() => orb.resize());
  if ("ResizeObserver" in window && canvas.parentElement) {
    const ro = new ResizeObserver(() => orb.resize());
    ro.observe(canvas.parentElement);
    orb._ro = ro;
  }
  activeOrb = orb;
  sess.orb = orb;

  const renderChart = () => {
    const chartEl = document.getElementById("c-chart-svg");
    if (!chartEl) return;
    if (!sess.history.length) {
      chartEl.innerHTML = `<div style="height:78px;display:flex;align-items:center;justify-content:center;color:var(--gray-400);font-size:0.75rem">No session context yet</div>`;
      return;
    }
    const samples = sess.history;
    const W_SVG = 280, H_SVG = 78, padL = 8, padR = 40, padT = 8, padB = 8;
    const last = Math.max(1, samples.length - 1);
    const x = (i) => padL + (i / last) * (W_SVG - padL - padR);
    const y = (r) => padT + (1 - clamp01(r)) * (H_SVG - padT - padB);
    let d = `M${x(0).toFixed(1)} ${y(samples[0].used / sess.limit).toFixed(1)}`;
    for (let i = 1; i < samples.length; i++) {
      d += ` H${x(i).toFixed(1)} V${y(samples[i].used / sess.limit).toFixed(1)}`;
    }
    const endRatio = samples[samples.length - 1].used / sess.limit;
    chartEl.innerHTML = `<svg viewBox="0 0 ${W_SVG} ${H_SVG}" aria-hidden="true">
      <line x1="${padL}" x2="${W_SVG - padR}" y1="${y(0.5)}" y2="${y(0.5)}" stroke="rgba(255,255,255,.07)" stroke-width="1"/>
      <line x1="${padL}" x2="${W_SVG - padR}" y1="${y(0.95)}" y2="${y(0.95)}" stroke="#ffb900" stroke-width="1" stroke-dasharray="3 2"/>
      <path d="${d}" fill="none" stroke="#00bcff" stroke-width="1.75"/>
      <circle cx="${x(samples.length - 1)}" cy="${y(endRatio)}" r="3.5" fill="#00bcff"/>
      <text x="${x(samples.length - 1) + 6}" y="${y(endRatio) + 4}" fill="#d1d5dc" font-family="ui-monospace, monospace" font-size="12">${Math.round(endRatio * 100)}%</text>
    </svg>`;
  };

  const paintAll = () => {
    const tel = document.getElementById("c-telemetry");
    if (!tel) return;
    const curAvail = agentSessionAvailability(aid);
    const curState = sess.busy ? sess.status : (!curAvail.active ? { state: curAvail.state, detail: curAvail.title.toLowerCase() } : sess.status);
    tel.dataset.cstate = curState.state;
    document.getElementById("c-state-txt").textContent = curState.state;
    document.getElementById("c-detail-txt").textContent = curState.detail;

    const nowKind = document.getElementById("c-now-kind");
    const nowTitle = document.getElementById("c-now-title");
    const nowSub = document.getElementById("c-now-sub");
    const curNow = curAvail.active ? sess.current : null;
    nowKind.hidden = !curNow;
    if (curNow) {
      nowKind.textContent = curNow.kind;
      nowTitle.textContent = curNow.text;
      nowTitle.classList.remove("idle");
      nowSub.textContent = "Requested by " + (M[curNow.from] ? M[curNow.from].name : curNow.from);
    } else {
      nowTitle.textContent = curAvail.active ? "Nothing in progress" : curAvail.title;
      nowTitle.classList.add("idle");

    const stopBtn = document.getElementById("c-stop-btn");
    if (stopBtn) stopBtn.hidden = !(curAvail.active && (sess.busy || !!sess.current));

    const compactBtn = document.getElementById("c-compact-btn");
    if (compactBtn) {
      compactBtn.disabled = !curAvail.active || sess.busy;
      compactBtn.setAttribute("aria-busy", String(!!sess.compacting));

    }

    const qList = document.getElementById("c-queue-list");
    const qItems = sess.queue;
    qList.innerHTML = qItems.length
      ? qItems.slice(0, 3).map((q) => `<li><span class="c-queue-who">${esc(M[q.from] ? M[q.from].name : q.from)}</span><span class="c-queue-tx">${esc(q.text)}</span></li>`).join("")
      : `<li class="muted">Nothing waiting</li>`;

    const pct = Math.round(sess.ratio * 100);
    const usedVal = sess.used;
    document.getElementById("c-ctx-pct").textContent = pct + "%";
    document.getElementById("c-ctx-tok").textContent = `${fmtTok(usedVal)} / ${fmtTok(sess.limit)}`;
    const meter = document.getElementById("c-meter");
    meter.dataset.warn = String(sess.ratio >= 0.75);
    document.getElementById("c-meter-fill").style.width = pct + "%";
    renderChart();

    const bd = [
      ["System & tools", sess.parts.system],
      ["Summary", sess.parts.summary],
      ["Conversation", sess.parts.conversation],
      ["Tool results", sess.parts.tools]
    ];
    document.getElementById("c-breakdown").innerHTML = bd.map(([lbl, val]) => `<div class="c-bd-row"><span class="muted">${lbl}</span><div class="c-bd-bar"><i style="width:${Math.round((val / sess.limit) * 100)}%"></i></div><span class="tnum" style="text-align:right;color:var(--gray-300)">${fmtTok(val)}</span></div>`).join("");
    document.getElementById("c-stats").textContent = `${sess.stats.requests} requests · ${sess.stats.toolCalls} tool calls · ${plural(sess.stats.compactions, "compaction", "compactions")}`;

    const feedList = document.getElementById("c-feed-list");
    if (feedList) {
      const visible = sess.entries.filter((en) => {
        if (S.consoleView === "chat") return en.from === "you";
        if (S.consoleScope === "others") return en.from !== "you";
        return true;
      });

    case "drawer-close": document.body.classList.remove("drawer"); break;
  }
});
document.addEventListener("click", (e) => {
  if (e.target && e.target.id === "cmdk-root") { closeCmdk(true); return; }
  if (CMDK.open && e.target.closest && e.target.closest('.cmdk-ai-card a[href^="#/"]')) { closeCmdk(false); }
});
document.addEventListener("input", (e) => {
  if (e.target.id === "cmdk-input") { CMDK.q = e.target.value; CMDK.active = 0; renderCmdk(); }
});
document.addEventListener("focusin", (e) => { if (e.target.closest && !e.target.closest(".menu-wrap")) closeMenus(); });
document.addEventListener("submit", (e) => {
  if (e.target.id === "c-prompt-form" || e.target.id === "hb-ask-form") return;
  e.preventDefault();
  if (e.target.dataset.form === "send") { const inp = document.getElementById("compose"); const txt = inp.value.trim(); if (!txt) return; CH[e.target.dataset.id].msgs.push({ id: "u" + Date.now(), who: "you", time: "now", text: txt }); render(false); const c = document.getElementById("compose"); if (c) c.focus(); const ms = document.querySelector(".chmain .msgs"); if (ms) ms.scrollTop = ms.scrollHeight; }
});
document.addEventListener("keydown", (e) => {
  if ((e.metaKey || e.ctrlKey) && !e.altKey && (e.key === "k" || e.key === "K")) {
    e.preventDefault();
    if (CMDK.open) closeCmdk(true); else openCmdk();
    return;
  }
  if (CMDK.open) {
    if ((e.metaKey || e.ctrlKey) && !e.altKey && e.key === "/") {
      e.preventDefault();
      setCmdkMode(CMDK.mode === "ai" ? "cmd" : "ai");
      return;
    }
    if (e.key === "Escape") { e.preventDefault(); closeCmdk(true); return; }
    if (e.key === "Tab") {
      const dlg = document.getElementById("cmdk-dialog");
      if (dlg) {
        const focusable = [...dlg.querySelectorAll('button:not([hidden]):not([disabled]), input:not([disabled]), a[href]')];
        if (focusable.length) {
          const i = focusable.indexOf(document.activeElement);
          if (e.shiftKey && i <= 0) { e.preventDefault(); focusable[focusable.length - 1].focus(); }
          else if (!e.shiftKey && i === focusable.length - 1) { e.preventDefault(); focusable[0].focus(); }
        }
      }
      return;
    }
    if (CMDK.mode === "ai") {
      if (e.key === "Enter" && e.target.id === "cmdk-input") { e.preventDefault(); askInCmdk(CMDK.q); return; }
      return;
    }
    if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      const n = CMDK.flat.length || 1;
      if (CMDK.flat.length) CMDK.active = (CMDK.active + (e.key === "ArrowDown" ? 1 : -1) + n) % n;
      renderCmdk();
      return;
    }
    if (e.key === "Enter" && e.target.id === "cmdk-input") { e.preventDefault(); runCmdkItem(CMDK.active); return; }
    return;
  }
  const openMenu = e.target.closest && e.target.closest(".menu:not([hidden])");
  if (openMenu) {
    const items = [...openMenu.querySelectorAll('[role^="menuitem"]')], i = items.indexOf(e.target);
    const go = (n) => { e.preventDefault(); items[(n + items.length) % items.length].focus(); };
    if (e.key === "ArrowDown") return go(i + 1);
    if (e.key === "ArrowUp") return go(i - 1);
    if (e.key === "Home") return go(0);
    if (e.key === "End") return go(items.length - 1);
    if (e.key === "Escape") { e.preventDefault(); const tr = document.querySelector(`[aria-controls="${openMenu.id}"]`); closeMenus(); if (tr) tr.focus(); return; }
    if (e.key === "Tab") closeMenus();
  }
  if (e.key === "Escape" && e.target.tagName === "TEXTAREA" && /^r-/.test(e.target.id || "")) {
    const c = document.querySelector(`[data-act="cancel-reply"][data-id="${CSS.escape(e.target.id.slice(2))}"]`); if (c) { e.preventDefault(); c.click(); return; }
  }
  if (e.key === "Escape") {
    if (e.target.closest && e.target.closest(".search") && document.body.classList.contains("searching") && narrowSearch()) { e.preventDefault(); closeNarrowSearch(); return; }
    if (document.querySelector(".sheet")) closeSheet(); closeMenus(); endSearch(); document.body.classList.remove("drawer");
  }
  const tabEl = e.target.closest && e.target.closest('[role="tab"]');
  if (tabEl && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
    const list = [...tabEl.parentElement.querySelectorAll('[role="tab"]')], i = list.indexOf(tabEl);
    const n = e.key === "Home" ? 0 : e.key === "End" ? list.length - 1 : (i + (e.key === "ArrowRight" ? 1 : -1) + list.length) % list.length;
    e.preventDefault(); list[n].click(); if (document.body.contains(list[n])) list[n].focus(); return;
  }
  if (!S.singleKey || e.isComposing || e.repeat || inTextField(e.target) || overlayOpen()) return;
  const altGr = e.ctrlKey && e.altKey && !e.metaKey;
  if (e.key === "/" && !e.metaKey && (altGr || (!e.ctrlKey && !e.altKey))) { e.preventDefault(); openCmdk(); return; }
  const isN = e.key === "n" || e.key === "N" || (!/^[a-z]$/i.test(e.key) && e.code === "KeyN");
  if (isN && !e.metaKey && !e.ctrlKey && !e.altKey) {
    e.preventDefault(); toast("New task (prototype action)");
  }
});
if (window.matchMedia) { const mq = window.matchMedia("(max-width: 959px)"); const onMq = () => render(false); if (mq.addEventListener) mq.addEventListener("change", onMq); else if (mq.addListener) mq.addListener(onMq);
  const mqp = window.matchMedia("(max-width: 639px)"); if (mqp.addEventListener) mqp.addEventListener("change", applyShortcuts); else if (mqp.addListener) mqp.addListener(applyShortcuts); }
window.addEventListener("hashchange", () => { document.body.classList.remove("drawer"); S.thread = null; S.replying = null; S.replyMode = null; IN.forEach((i) => { if (i.handled) i.handledNow = false; }); render(true); });

/* ---------------------------------------------------------------- dialogs */
let sheetReturn = null;
function openDialog(trigger, title, desc, body, foot) {
  sheetReturn = trigger;
  document.getElementById("overlay-root").innerHTML = `<div class="overlay" data-act="close-sheet"></div><div class="sheet dialog" role="dialog" aria-modal="true" aria-labelledby="dlg-t"${desc ? ' aria-describedby="dlg-d"' : ""}>
    <h2 id="dlg-t">${esc(title)}</h2>${desc ? `<p class="dsc" id="dlg-d">${esc(desc)}</p>` : ""}${body}<div class="dfoot">${foot}</div></div>`;
  const f = document.querySelector(".sheet input:checked, .sheet select, .sheet button"); if (f) f.focus();
}
const cancelBtn = '<button class="btn outline" type="button" data-act="close-sheet">Cancel</button>';
function openHealth(pid, trigger) {
  const pr = P[pid], cur = pr.health || "none";
  const opts = [["On track", "On track"], ["At risk", "At risk"], ["Off track", "Off track"], ["none", "Not set"]];
  openDialog(trigger, `Set health for ${pr.name}`, "", `<fieldset><legend class="sr-only">Health</legend>${opts.map(([v, l]) => `<label class="opt"><input type="radio" name="health" value="${esc(v)}" ${v === cur ? "checked" : ""}>${esc(l)}</label>`).join("")}</fieldset>`,
    cancelBtn + `<button class="btn primary" type="button" data-act="health-save" data-id="${pid}">Set health</button>`);
}
function openConfirmRemove(pid, t, trigger) {
  openDialog(trigger, `Remove ${TEAMS[t].name} from ${P[pid].name}?`, `${P[pid].name} will have no team.`, "",
    cancelBtn + `<button class="btn danger" type="button" data-act="team-rm-confirm" data-id="${pid}" data-v="${t}">Remove ${esc(TEAMS[t].name)}</button>`);
}
function openConfirmOffboard(id, trigger) {
  const m = M[id]; if (!m) return;
  openDialog(trigger, `Offboard ${m.name}?`, `${m.name} will be paused and stopped. Its journal, memory, and records remain read-only.`, "",
    cancelBtn + `<button class="btn danger" type="button" data-act="offboard-confirm" data-id="${esc(id)}">Offboard ${esc(m.name)}</button>`);
}
function openAddTeam(pid, trigger) {
  const free = Object.keys(TEAMS).filter((t) => !P[pid].teams.includes(t));
  const verb = P[pid].teams.length ? "Add" : "Assign";
  openDialog(trigger, `${verb} a team to ${P[pid].name}`, "", `<div style="margin-top:16px"><label for="add-team" style="display:block;font-weight:500;margin-bottom:6px">Team</label><select class="field" id="add-team" style="width:100%">${free.map((t) => `<option value="${t}">${esc(TEAMS[t].name)}</option>`).join("")}</select></div>`,
    cancelBtn + `<button class="btn primary" type="button" data-act="team-add-save" data-id="${pid}">${verb} team</button>`);
}
function openAssign(itemId, trigger) {
  const it = IN.find((i) => i.id === itemId); if (!it) return;
  const opts = memberIds();
  openDialog(trigger, `Assign ${it.task}`, "It leaves your Inbox once someone is assigned.", `<div style="margin-top:16px"><label for="assign-to" style="display:block;font-weight:500;margin-bottom:6px">Assign to</label><select class="field" id="assign-to" style="width:100%">${opts.map((k) => `<option value="${k}" ${k === "rowan" ? "selected" : ""}>${esc(M[k].name)} · ${esc(M[k].role)}</option>`).join("")}</select></div>`,
    cancelBtn + `<button class="btn primary" type="button" data-act="assign-save" data-id="${esc(itemId)}">Assign</button>`);
}
function closeSheet() { document.getElementById("overlay-root").innerHTML = ""; if (sheetReturn) sheetReturn.focus(); }
document.addEventListener("keydown", (e) => {
  if (e.key !== "Tab") return;
  const sh = document.querySelector(".sheet"); if (!sh) return;
  const f = sh.querySelectorAll("button, a[href], input, select, textarea"); if (!f.length) return;
  const first = f[0], last = f[f.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

const verSel = document.getElementById("ver-select");
if (verSel) {
  verSel.addEventListener("change", () => { location.href = verSel.value + (location.hash || ""); });
  window.addEventListener("pageshow", () => { verSel.value = verSel.dataset.cur; });
}

document.addEventListener("submit", (e) => {
  if (e.target && e.target.id === "hb-ask-form") {
    e.preventDefault();
    const inp = document.getElementById("hb-ask-input");
    const val = (inp && inp.value || "").trim();
    if (!val) return;
    S.askQ = "";
    S.askAns = answerOrgQuestion(val);
    render(false);
    const nextInp = document.getElementById("hb-ask-input");
    if (nextInp) nextInp.focus();
  }
});

applyNavCollapsed();
if (!location.hash) {
  try { history.replaceState(null, "", "#/home"); } catch (e) {}
}
render(true);
</script>
